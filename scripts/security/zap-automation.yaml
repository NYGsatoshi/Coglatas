env:
  contexts:
    - name: sec06-api
      urls:
        - "${COGLATAS_SECURITY_ZAP_TARGET}"
      includePaths:
        - "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/.*"
      # OpenAPI import sends generated requests. Exclude session-mutating auth
      # routes at the context boundary so importing the contract cannot revoke
      # the SEC-03 session before the authenticated coverage probe/active scan.
      excludePaths:
        - "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/api/auth/logout(?:[/?#].*)?$"
        - "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/api/auth/change-password(?:[/?#].*)?$"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 25
      scanOnlyInScope: true
      maxBodySizeInBytesToScan: 1048576
      enableTags: false
      disableAllRules: false

  # POST /api/comments returns the caller's newly submitted comment body.
  # ZAP can therefore rediscover its own Luhn-valid active-scan payload as
  # passive PII rule 10062. Scope the false-positive override to this write
  # response only.
  #
  # POST /api/announcements returns caller-controlled announcement title/body
  # content from the submitted write. ZAP can therefore passively rediscover
  # its own scan value as PII. Scope the override to this exact POST response;
  # announcement reads and all other endpoints remain unfiltered.
  #
  # POST /api/tenant/export is the explicit, reauthorized metadata-export
  # boundary. Its contract intentionally includes redacted tenant-user metadata
  # such as email while excluding secrets, hashes, tokens, and file bodies.
  # Treat rule 10062 as a false positive only for that exact export response.
  #
  # GET /api/admin/invites is an explicitly privileged administration read whose
  # response contract intentionally contains invitee email addresses. SEC-05
  # independently requires ordinary/restricted users to receive a safe 403 on
  # this route, so authorization/non-disclosure remains fail-closed while SEC-06
  # avoids treating the authorized PII-bearing contract itself as a vulnerability.
  # Rule 10062 can also mistake a denial-envelope traceId substring for a card.
  # Match only the advertised optional, canonical-decimal page/pageSize query
  # parameters, in either order. Other keys, duplicates and paths remain unfiltered.
  - type: alertFilter
    alertFilters:
      - ruleId: 10062
        ruleName: PII Disclosure
        newRisk: False Positive
        context: sec06-api
        url: "${COGLATAS_SECURITY_ZAP_TARGET}/api/comments"
        urlRegex: false
        methods:
          - POST
      - ruleId: 10062
        ruleName: PII Disclosure
        newRisk: False Positive
        context: sec06-api
        url: "${COGLATAS_SECURITY_ZAP_TARGET}/api/announcements"
        urlRegex: false
        methods:
          - POST
      - ruleId: 10062
        ruleName: PII Disclosure
        newRisk: False Positive
        context: sec06-api
        url: "${COGLATAS_SECURITY_ZAP_TARGET}/api/tenant/export"
        urlRegex: false
        methods:
          - POST
      - ruleId: 10062
        ruleName: PII Disclosure
        newRisk: False Positive
        context: sec06-api
        url: "^${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/api/admin/invites(?:[?](?:page=-?(?:0|[1-9][0-9]*)(?:&pageSize=-?(?:0|[1-9][0-9]*))?|pageSize=-?(?:0|[1-9][0-9]*)(?:&page=-?(?:0|[1-9][0-9]*))?))?$"
        urlRegex: true
        methods:
          - GET

  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: SEC-06 tenant boundary header
        url: "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/.*"
        matchType: req_header
        matchString: X-Tenant-Slug
        matchRegex: false
        replacementString: "${COGLATAS_SECURITY_ZAP_TENANT}"
      - description: SEC-06 ephemeral SEC-03 session cookie
        url: "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/.*"
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: "${COGLATAS_SECURITY_ZAP_COOKIE}"
      - description: SEC-06 ephemeral SEC-03 CSRF token
        url: "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/.*"
        matchType: req_header
        matchString: X-CSRF-Token
        matchRegex: false
        replacementString: "${COGLATAS_SECURITY_ZAP_CSRF_TOKEN}"

  - type: openapi
    parameters:
      apiFile: /work/artifacts/openapi/coglatas-openapi.json
      context: sec06-api
      targetUrl: "${COGLATAS_SECURITY_ZAP_TARGET}"
    tests:
      - name: OpenAPI import produced a non-zero authenticated API surface
        type: stats
        statistic: openapi.urls.added
        operator: ">"
        value: 0
        onFail: error

  # Each role runs in a fresh ZAP process with role-specific replacer values.
  # Require an actual protected request/response exchange so an imported-only
  # OpenAPI surface cannot satisfy the SEC-06 coverage gate.
  - type: requestor
    requests:
      - name: SEC-06 authenticated role coverage probe
        url: "${COGLATAS_SECURITY_ZAP_TARGET}/api/announcements/audiences"
        method: GET
        headers:
          - "X-Tenant-Slug:${COGLATAS_SECURITY_ZAP_TENANT}"
          - "Cookie:${COGLATAS_SECURITY_ZAP_COOKIE}"
          - "X-CSRF-Token:${COGLATAS_SECURITY_ZAP_CSRF_TOKEN}"
        responseCode: 200

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: activeScan-config
    # The session harness owns credential lifecycle. Keep these routes in scope
    # for import/passive inspection, but exclude them from active attacks so the
    # synthetic credential remains valid for the rest of the matrix.
    excludePaths:
      - "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/api/auth/logout(?:[/?#].*)?$"
      - "${COGLATAS_SECURITY_ZAP_TARGET_REGEX}/api/auth/change-password(?:[/?#].*)?$"

  - type: activeScan-policy
    parameters:
      name: sec06-strict-api
    policyDefinition:
      # Default-off is deliberate: required CI executes only stack-relevant,
      # repository-reviewed release rules. Beta/OAST/desync classes are not
      # silently activated by a ZAP image refresh.
      defaultStrength: Medium
      defaultThreshold: "Off"
      rules:
        - id: 6
          name: Path Traversal
          strength: Medium
          threshold: Low
        - id: 40003
          name: CRLF Injection
          strength: Medium
          threshold: Low
        - id: 40008
          name: Parameter Tampering
          strength: Medium
          threshold: Low
        - id: 40012
          name: Cross Site Scripting Reflected
          strength: Medium
          threshold: Low
        - id: 40014
          name: Cross Site Scripting Persistent
          strength: Medium
          threshold: Low
        - id: 40018
          name: SQL Injection
          strength: Medium
          threshold: Low
        - id: 40022
          name: SQL Injection PostgreSQL Time Based
          strength: Low
          threshold: Low
        - id: 90020
          name: Remote OS Command Injection
          strength: Medium
          threshold: Low

  - type: activeScan
    parameters:
      context: sec06-api
      url: "${COGLATAS_SECURITY_ZAP_TARGET}"
      policy: sec06-strict-api
      # Keep each reviewed rule bounded. The started/skipped assertions below
      # require every required rule to execute without being skipped.
      maxRuleDurationInMins: 2
      # A non-zero internal limit plus the host-side timeout in zap-runner.sh
      # prevents a hung scanner from running indefinitely. The tests below make
      # any global stop or per-rule skip a blocking incomplete-scan failure.
      maxScanDurationInMins: 10
      delayInMs: 0
      handleAntiCSRFTokens: false
      # Some required API scan rules only receive work when requests expose
      # scanable parameters. Treat authenticated headers as scan inputs too so
      # parameter-oriented rules cannot silently remain at started=0.
      scanHeadersAllRequests: true
    tests:
      - name: Active scan completed without forced stop
        type: stats
        statistic: stats.ascan.stopped
        operator: "=="
        value: 0
        onFail: error
      - name: Path Traversal rule started
        type: stats
        statistic: stats.ascan.6.started
        operator: ">="
        value: 1
        onFail: error
      - name: Path Traversal rule completed without skip
        type: stats
        statistic: stats.ascan.6.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: CRLF Injection rule started
        type: stats
        statistic: stats.ascan.40003.started
        operator: ">="
        value: 1
        onFail: error
      - name: CRLF Injection rule completed without skip
        type: stats
        statistic: stats.ascan.40003.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: Parameter Tampering rule started
        type: stats
        statistic: stats.ascan.40008.started
        operator: ">="
        value: 1
        onFail: error
      - name: Parameter Tampering rule completed without skip
        type: stats
        statistic: stats.ascan.40008.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: Reflected XSS rule started
        type: stats
        statistic: stats.ascan.40012.started
        operator: ">="
        value: 1
        onFail: error
      - name: Reflected XSS rule completed without skip
        type: stats
        statistic: stats.ascan.40012.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: Persistent XSS rule started
        type: stats
        statistic: stats.ascan.40014.started
        operator: ">="
        value: 1
        onFail: error
      - name: Persistent XSS rule completed without skip
        type: stats
        statistic: stats.ascan.40014.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: SQL Injection rule started
        type: stats
        statistic: stats.ascan.40018.started
        operator: ">="
        value: 1
        onFail: error
      - name: SQL Injection rule completed without skip
        type: stats
        statistic: stats.ascan.40018.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: PostgreSQL time-based SQL Injection rule started
        type: stats
        statistic: stats.ascan.40022.started
        operator: ">="
        value: 1
        onFail: error
      - name: PostgreSQL time-based SQL Injection rule completed without skip
        type: stats
        statistic: stats.ascan.40022.skipped
        operator: "=="
        value: 0
        onFail: error
      - name: Remote OS Command Injection rule started
        type: stats
        statistic: stats.ascan.90020.started
        operator: ">="
        value: 1
        onFail: error
      - name: Remote OS Command Injection rule completed without skip
        type: stats
        statistic: stats.ascan.90020.skipped
        operator: "=="
        value: 0
        onFail: error

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: script
    alwaysRun: true
    parameters:
      action: add
      type: standalone
      engine: Graal.js
      name: sec06-private-attribution
      source: /work/scripts/security/zap-attribution.js

  - type: script
    alwaysRun: true
    parameters:
      action: run
      type: standalone
      name: sec06-private-attribution
      failureLevel: error

  - type: report
    alwaysRun: true
    parameters:
      # traditional-json intentionally omits raw request/response bodies. The
      # generated file is still ephemeral and is reduced again by the sanitizer.
      template: traditional-json
      reportDir: "${COGLATAS_SECURITY_ZAP_REPORT_DIR}"
      reportFile: "${COGLATAS_SECURITY_ZAP_REPORT_FILE}"
      reportTitle: "Coglatas SEC-06 authenticated API DAST"
      reportDescription: "Disposable SEC-02 target; sanitized evidence is generated outside ZAP."
      displayReport: false
    risks:
      - high
      - medium
      - low
      - info
    confidences:
      - high
      - medium
      - low
      - falsepositive

  - type: exitStatus
    alwaysRun: true
    parameters:
      errorLevel: High
      okExitValue: 0
      errorExitValue: 1
      warnExitValue: 1
