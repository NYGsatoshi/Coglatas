# MBJ-03 authentication/session lifecycle overlay.
#
# Uses an isolated fresh PostgreSQL database and persistent Data Protection
# volume from the real-backend stack. Only a synthetic SystemAdmin is seeded;
# the subject account is created through the real administrator invite flow.
# Passwords are generated at runtime by the runner and never stored in source
# or uploaded evidence.

services:
  app:
    environment:
      COGLATAS_BROWSER_SMOKE_SEED_ENABLED: "false"
      COGLATAS_BROWSER_SMOKE_RESPONSE_GATE_ENABLED: "false"
      COGLATAS_SEED_ADMIN_ENABLED: ${COGLATAS_MBJ03_SEED_ADMIN_ENABLED:-true}
      COGLATAS_SEED_ADMIN_EMAIL: ${COGLATAS_MBJ03_ADMIN_EMAIL:?set COGLATAS_MBJ03_ADMIN_EMAIL}
      COGLATAS_SEED_ADMIN_USERNAME: ${COGLATAS_MBJ03_ADMIN_DISPLAY_NAME:-MBJ03 System Admin}
      COGLATAS_SEED_ADMIN_PASSWORD: ${COGLATAS_MBJ03_SEED_ADMIN_PASSWORD:-}

  real-backend-playwright:
    environment:
      COGLATAS_MBJ03_ADMIN_EMAIL: ${COGLATAS_MBJ03_ADMIN_EMAIL:?set COGLATAS_MBJ03_ADMIN_EMAIL}
      COGLATAS_MBJ03_ADMIN_DISPLAY_NAME: ${COGLATAS_MBJ03_ADMIN_DISPLAY_NAME:-MBJ03 System Admin}
      COGLATAS_MBJ03_ADMIN_PASSWORD: ${COGLATAS_MBJ03_ADMIN_PASSWORD:?set COGLATAS_MBJ03_ADMIN_PASSWORD}
      COGLATAS_MBJ03_SUBJECT_EMAIL: ${COGLATAS_MBJ03_SUBJECT_EMAIL:?set COGLATAS_MBJ03_SUBJECT_EMAIL}
      COGLATAS_MBJ03_SUBJECT_DISPLAY_NAME: ${COGLATAS_MBJ03_SUBJECT_DISPLAY_NAME:-MBJ03 Session Subject}
      COGLATAS_MBJ03_OLD_PASSWORD: ${COGLATAS_MBJ03_OLD_PASSWORD:?set COGLATAS_MBJ03_OLD_PASSWORD}
      COGLATAS_MBJ03_NEW_PASSWORD: ${COGLATAS_MBJ03_NEW_PASSWORD:?set COGLATAS_MBJ03_NEW_PASSWORD}
