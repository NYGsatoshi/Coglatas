services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: syncfusion_license
          target: syncfusion_license
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-coglatas};Username=${DB_USER:-coglatas};Password=${DB_PASSWORD:?set DB_PASSWORD}
      DataProtection__KeysPath: /app/data/protection-keys
      Tenancy__AppMode: ${TENANCY_APP_MODE:-OnPremSingleTenant}
      Tenancy__DefaultTenantSlug: ${TENANCY_DEFAULT_TENANT_SLUG:-default}
      Tenancy__TenantResolutionStrategy: ${TENANCY_RESOLUTION_STRATEGY:-ConfigDefault}
      Tenancy__AllowTenantSwitching: ${TENANCY_ALLOW_SWITCHING:-false}
      Tenancy__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-26214400}
      Security__CookieSecurePolicy: ${SECURITY_COOKIE_SECURE_POLICY:-SameAsRequest}
      Security__RequireHttps: ${SECURITY_REQUIRE_HTTPS:-false}
      Security__EnableHsts: ${SECURITY_ENABLE_HSTS:-false}
      ReverseProxy__TrustForwardedHeaders: ${REVERSE_PROXY_TRUST_FORWARDED_HEADERS:-false}
      Platform__PlatformAdminSetupMode: ${PLATFORM_ADMIN_SETUP_MODE:-true}
      COGLATAS_SEED_ADMIN_ENABLED: ${COGLATAS_SEED_ADMIN_ENABLED:-false}
      COGLATAS_SEED_ADMIN_EMAIL: ${COGLATAS_SEED_ADMIN_EMAIL:-admin@example.local}
      COGLATAS_SEED_ADMIN_USERNAME: ${COGLATAS_SEED_ADMIN_USERNAME:-admin}
      COGLATAS_SEED_ADMIN_PASSWORD: ${COGLATAS_SEED_ADMIN_PASSWORD:-}
      COGLATAS_BOOTSTRAP_ADMIN_EMAIL: ${COGLATAS_BOOTSTRAP_ADMIN_EMAIL:-}
      COGLATAS_BOOTSTRAP_ADMIN_PASSWORD: ${COGLATAS_BOOTSTRAP_ADMIN_PASSWORD:-}
      COGLATAS_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${COGLATAS_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Bootstrap Admin}
      LocalAdmin__SeedOnStartup: ${LOCAL_ADMIN_SEED_ON_STARTUP:-false}
      LocalAdmin__Email: ${LOCAL_ADMIN_EMAIL:-admin@example.com}
      LocalAdmin__Password: ${LOCAL_ADMIN_PASSWORD:-}
      LocalAdmin__DisplayName: ${LOCAL_ADMIN_DISPLAY_NAME:-Local Admin}
    ports:
      - "${COGLATAS_PORT:-8080}:8080"
    volumes:
      - coglatas_uploads:/app/storage/uploads
      - coglatas_data_protection:/app/data/protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    restart: "no"
    volumes:
      - ./:/src
      - coglatas_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-coglatas};Username=${DB_USER:-coglatas};Password=${DB_PASSWORD:?set DB_PASSWORD}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/Coglatas.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-coglatas}
      POSTGRES_USER: ${DB_USER:-coglatas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      default:
        aliases:
          - db
    volumes:
      - coglatas_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coglatas} -d ${DB_NAME:-coglatas}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coglatas_pgdata:
  coglatas_uploads:
  coglatas_data_protection:
  coglatas_nuget:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
