services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coglatas}
      POSTGRES_USER: ${POSTGRES_USER:-coglatas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coglatas_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coglatas_local_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coglatas} -d ${POSTGRES_DB:-coglatas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    volumes:
      - ./:/src
      - coglatas_local_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-coglatas};Username=${POSTGRES_USER:-coglatas};Password=${POSTGRES_PASSWORD:-coglatas_password}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/Coglatas.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - syncfusion_license
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-coglatas};Username=${POSTGRES_USER:-coglatas};Password=${POSTGRES_PASSWORD:-coglatas_password}
      Tenancy__AppMode: OnPremSingleTenant
      Tenancy__DefaultTenantSlug: default
      Tenancy__TenantResolutionStrategy: ConfigDefault
      Tenancy__AllowTenantSwitching: "false"
      Tenancy__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-52428800}
      Security__CookieSecurePolicy: SameAsRequest
      Security__RequireHttps: "false"
      Security__EnableHsts: "false"
      Platform__EnablePlatformAdmin: "true"
      Platform__PlatformAdminSetupMode: "true"
      Platform__AllowTenantCreationFromAdmin: "true"
      COGLATAS_SEED_ADMIN_ENABLED: ${COGLATAS_SEED_ADMIN_ENABLED:-false}
      COGLATAS_SEED_ADMIN_EMAIL: ${COGLATAS_SEED_ADMIN_EMAIL:-admin@example.local}
      COGLATAS_SEED_ADMIN_USERNAME: ${COGLATAS_SEED_ADMIN_USERNAME:-admin}
      COGLATAS_SEED_ADMIN_PASSWORD: ${COGLATAS_SEED_ADMIN_PASSWORD:-}
      LocalAdmin__SeedOnStartup: ${LOCAL_ADMIN_SEED_ON_STARTUP:-true}
      LocalAdmin__Email: ${LOCAL_ADMIN_EMAIL:-admin@example.com}
      LocalAdmin__Password: ${LOCAL_ADMIN_PASSWORD:-}
      LocalAdmin__DisplayName: ${LOCAL_ADMIN_DISPLAY_NAME:-Local Admin}
    ports:
      - "${COGLATAS_PORT:-8080}:8080"
    volumes:
      - coglatas_local_uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  coglatas_local_pgdata:
  coglatas_local_uploads:
  coglatas_local_nuget:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
