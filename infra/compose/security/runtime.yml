# SEC-02 CI runtime override.
#
# Public PR security CI must not receive the private Syncfusion build credential.
# Each execution job builds infra/docker/security-runtime.Dockerfile, then its
# assigned isolated Core/Schemathesis/ZAP stacks reuse that immutable local image.
#
# This file is CI-only. It does not publish a host port and is not a deployment
# profile.

services:
  migrate:
    image: ${COGLATAS_SECURITY_RUNTIME_IMAGE:?COGLATAS_SECURITY_RUNTIME_IMAGE is required}
    working_dir: /src
    volumes: !reset []
    environment:
      NUGET_PACKAGES: /root/.nuget/packages
    command: >
      bash -lc "dotnet ef database update
      --project src/Coglatas.Infrastructure
      --startup-project src/Coglatas.Web
      --configuration Release
      --no-build"

  app:
    build: !reset null
    image: ${COGLATAS_SECURITY_RUNTIME_IMAGE:?COGLATAS_SECURITY_RUNTIME_IMAGE is required}
    working_dir: /src/src/Coglatas.Web
    environment:
      NUGET_PACKAGES: /root/.nuget/packages
    volumes: !reset []
    healthcheck: !reset null
    command: >
      bash -lc "mkdir -p
      /app/storage/uploads
      /app/data/protection-keys &&
      dotnet bin/Release/net10.0/Coglatas.Web.dll"
