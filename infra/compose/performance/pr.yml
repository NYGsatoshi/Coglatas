# PERF-02 public-PR runtime override.
#
# The canonical performance stack normally builds the production Dockerfile,
# which requires the private Syncfusion build credential. Pull requests must not
# receive that credential, so this overlay runs the same ASP.NET Core project
# from the pinned .NET SDK image while preserving the dedicated PostgreSQL,
# tenancy, storage, fixture, CSRF, and evidence configuration.
#
# This is CI-only and is not a deployment profile.

services:
  app:
    build: !reset null
    image: mcr.microsoft.com/dotnet/sdk:10.0.403@sha256:afd0ccff9d306812a69ef0f47458376b6acb544ae866cfc4b8d28ff0eef35ea7
    working_dir: /src
    environment:
      NUGET_PACKAGES: /root/.nuget/packages
    volumes:
      - ../../../:/src
      - performance_nuget:/root/.nuget/packages
      - ${COGLATAS_PERFORMANCE_EVIDENCE_DIR:?COGLATAS_PERFORMANCE_EVIDENCE_DIR is required}:/app/performance-evidence
      - performance_uploads:/app/storage/uploads
      - performance_data_protection:/app/data/protection-keys
    healthcheck: !reset null
    command: >
      bash -lc "mkdir -p
      /src/src/Coglatas.Web/wwwroot
      /app/storage/uploads
      /app/data/protection-keys &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet run --project src/Coglatas.Web/Coglatas.Web.csproj
      --configuration Release
      --no-restore
      --no-launch-profile"
