# SEC-02 CI runtime override.
#
# The ordinary security overlay intentionally inherits the production Dockerfile,
# which requires the private Syncfusion build credential for the Angular bundle.
# Public PR security CI must not receive that credential, so this override runs the
# same ASP.NET Core project from the pinned .NET SDK image while preserving the
# SEC-02 PostgreSQL, tenancy, storage, and Test-only fixture configuration.
#
# This file is CI-only. It does not publish a host port and is not a deployment
# profile.

services:
  app:
    build: !reset null
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    environment:
      NUGET_PACKAGES: /root/.nuget/packages
    volumes:
      - ./:/src
      - real_backend_smoke_nuget:/root/.nuget/packages
    healthcheck: !reset null
    command: >
      bash -lc "mkdir -p
      /src/src/Coglatas.Web/wwwroot
      /app/storage/uploads
      /app/data/protection-keys &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet run --project src/Coglatas.Web/Coglatas.Web.csproj
      --configuration Release
      --no-restore
      --no-launch-profile"
