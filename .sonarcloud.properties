# SonarQube Cloud scope shared with the trusted CI-based .NET scanner.
# .github/workflows/sonarcloud-ci.yml explicitly imports these approved keys.
# Project binding, analysis method and the Quality Gate are managed in SonarQube Cloud.
sonar.sourceEncoding=UTF-8

# Keep generated output, dependencies, runtime data and the inactive frontend
# scaffold out of the repository-wide analysis. Root audit outputs must not
# hide tracked application source directories also named Artifacts/artifacts.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/TestResults/**,**/test-results/**,**/playwright-report/**,**/.playwright/**,**/storybook-static/**,artifacts/**,src/Coglatas.Web/wwwroot/**,src/Coglatas.Web/data/**,coglatas-frontend/**

# Generated/dependency output should not contribute to duplication metrics.
sonar.cpd.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,artifacts/**,src/Coglatas.Web/wwwroot/**,coglatas-frontend/**

# Executable regression test bodies are not production coverage subjects.
# Operational fixtures/helpers remain measured; all files retain issue analysis.
# Underscore unittest bodies are classified only in audited directories.
# AV-MIG operational drivers and their shared contract module remain visible.
sonar.coverage.exclusions=scripts/ci/test-*.py,**/*.node-test.mjs,deploy/sakura/test_*.py,scripts/ci/qodana-packets/test_*.py,scripts/ci/test_audit_*.py,scripts/ci/test_av_mig_contract_boundary_*.py,scripts/ci/test_github_*.py,scripts/ci/test_nuget_*.py,scripts/ci/test_sec*.py,scripts/ci/test_specification_*.py,scripts/ci/test_verify_*.py,scripts/quality/test_*.py,tests/ci/test_*.py
