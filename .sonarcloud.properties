# Shared scope for SonarCloud CI. The workflow passes these properties to the
# .NET scanner explicitly; it does not automatically read this file.
# Disable Automatic Analysis in SonarCloud before activating CI scanning.
sonar.sourceEncoding=UTF-8

# Keep generated output, dependencies, runtime data and the inactive frontend
# scaffold out of the repository-wide analysis.
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/TestResults/**,**/test-results/**,**/playwright-report/**,**/.playwright/**,**/storybook-static/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,src/Coglatas.Web/data/**,coglatas-frontend/**

# Generated/dependency output should not contribute to duplication metrics.
sonar.cpd.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,coglatas-frontend/**
