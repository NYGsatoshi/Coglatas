<section class="attachment-picker" [attr.aria-label]="i18n.translate('files.picker.ariaLabel')" data-testid="attachment-picker">
  <header>
    <p>{{ i18n.translate('files.picker.eyebrow') }}</p>
    <h2>{{ i18n.translate('files.picker.title') }}</h2>
  </header>

  <div class="attachment-picker__list">
    @for (file of files; track file.id) {
      <label class="attachment-picker__row" data-testid="attachment-picker-row">
        <input
          type="radio"
          name="attachment-picker-selection"
          [checked]="selectedAttachmentId === file.id"
          [attr.aria-checked]="selectedAttachmentId === file.id"
          [disabled]="disabled || !file.id || file.scanStatus !== 'allowed'"
          (change)="toggleFile(file, $any($event.target).checked)"
          data-testid="attachment-picker-checkbox"
        />
        <span class="attachment-picker__name">{{ fileName(file) }}</span>
        <app-file-scan-status-badge [status]="file.scanStatus" />
        @if (disabled) {
          <span class="attachment-picker__note" data-testid="attachment-picker-disabled">{{ disabledMessage ?? i18n.translate('files.picker.unavailable') }}</span>
        } @else if (file.scanStatus !== 'allowed') {
          <span class="attachment-picker__note" data-testid="non-canonical-disabled">{{ i18n.translate('files.picker.cleanOnly') }}</span>
        }
      </label>
    }
  </div>

  <p class="attachment-picker__selection" data-testid="selected-attachment">{{ selectedAttachmentId ? i18n.translate('files.picker.selected') : i18n.translate('files.picker.noneSelected') }}</p>
</section>
