@let vm = viewModel();

<div
  class="app-shell"
  data-testid="app-shell"
  [class.app-shell--drawer-open]="mobileDrawerOpen()"
  [class.app-shell--feature-menu-collapsed]="featureMenuCollapsed()"
  [class.app-shell--right-expanded]="vm.rightPanelMode === 'expanded'"
  [class.app-shell--right-collapsed]="vm.rightPanelMode === 'collapsed'"
>
  <a class="app-shell__skip-link" href="#app-shell-main-content">{{ i18n.translate('shell.skipToMain') }}</a>

  <app-mobile-header
    class="app-shell__mobile-header"
    data-testid="mobile-header"
    [workspaceLabel]="vm.workspace?.label || ''"
    [drawerOpen]="mobileDrawerOpen()"
    (drawerToggle)="toggleMobileDrawer()"
  />

  <app-feature-menu
    class="app-shell__feature-menu"
    [navigationAriaLabel]="i18n.translate('shell.workspaceNavigation')"
    [navigationItems]="vm.primaryNavigationItems"
    [pinnedItems]="orderedPinnedNavigationItems()"
    [pinnedCollapsed]="pinnedSectionCollapsed()"
    [collapsible]="true"
    [collapsed]="featureMenuCollapsed()"
    (collapsedChange)="setFeatureMenuCollapsed($event)"
    (pinnedCollapsedChange)="setPinnedSectionCollapsed($event)"
    (pinnedMove)="movePinnedItem($event)"
  />

  <div class="app-shell__body" data-testid="shell-body">
    <app-top-bar
      data-testid="top-bar-region"
      [workspace]="vm.workspace"
      [workspaceOptions]="vm.workspaceOptions"
      [workspaceSelectionStatus]="vm.workspaceSelectionStatus"
      [runningProjectCount]="vm.runningProjectCount"
      [needsReviewProjectCount]="vm.needsReviewProjectCount"
      [canOpenWorkspaceMembers]="vm.canOpenWorkspaceMembers"
      [hasExternalShares]="vm.hasExternalShares"
      [externalShareCount]="vm.externalShareCount"
      [memberPreview]="vm.memberPreview"
      [canInspectWorkspaceSharing]="vm.canInspectWorkspaceSharing"
      [canManageWorkspaceSharing]="vm.canManageWorkspaceSharing"
      [sessionStatus]="vm.session.status"
      [rightPanelMode]="vm.rightPanelMode"
      [logoutPending]="logoutPending()"
      [logoutError]="logoutError()"
      (workspaceSelected)="selectWorkspace($event)"
      (logoutRequested)="logout()"
      (rightPanelToggle)="toggleRightPanelFromTopBar($event)"
    />
    @if (realtime.isEnabled()) {
      <app-realtime-connection-indicator [state]="realtime.connectionState()" />
    }
    <main id="app-shell-main-content" class="app-shell__main" [attr.aria-label]="i18n.translate('shell.mainContent')" tabindex="-1">
      <router-outlet />
    </main>
  </div>

  <app-right-panel
    class="app-shell__right-panel"
    [class.app-shell__right-panel--drawer]="vm.rightPanelMode === 'drawer'"
    data-testid="right-panel-region"
    [session]="vm.session"
    [workspace]="vm.workspace"
    [mode]="vm.rightPanelMode"
    [returnFocusTo]="rightPanelReturnFocus()"
    [activeScope]="{
      workspaceId: vm.workspace?.id || '',
      projectId: '',
      conversationId: ''
    }"
  />

  <div class="app-shell__scrim" aria-hidden="true" (click)="closeMobileDrawer()"></div>
  <aside
    #mobileDrawer
    id="mobile-navigation"
    class="app-shell__mobile-drawer"
    data-testid="mobile-navigation"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="i18n.translate('shell.mobileNavigation')"
    [attr.aria-hidden]="!mobileDrawerOpen()"
    [attr.inert]="mobileDrawerOpen() ? null : ''"
    tabindex="-1"
    [cdkTrapFocus]="mobileDrawerOpen()"
    [cdkTrapFocusAutoCapture]="mobileDrawerOpen()"
  >
    <app-feature-menu
      [navigationAriaLabel]="i18n.translate('shell.workspaceNavigation')"
      [compact]="true"
      [navigationItems]="vm.primaryNavigationItems"
      [pinnedItems]="orderedPinnedNavigationItems()"
      [pinnedCollapsed]="pinnedSectionCollapsed()"
      (itemSelected)="closeMobileDrawer(false)"
      (pinnedCollapsedChange)="setPinnedSectionCollapsed($event)"
      (pinnedMove)="movePinnedItem($event)"
    />
  </aside>
</div>
