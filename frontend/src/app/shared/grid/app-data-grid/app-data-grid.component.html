<section class="app-data-grid" [attr.aria-label]="ariaLabel" data-testid="app-data-grid">
  @if (syncfusionRequested()) {
    @if (syncfusionLoadError()) {
      <p class="app-data-grid__adapter-error" role="alert" data-testid="app-data-grid-adapter-error">{{ i18n.translate('grid.loadError') }}</p>
    }
    <ng-container #syncfusionHost />
  } @else {
    <ag-grid-angular
      class="ag-theme-quartz app-data-grid__grid"
      [attr.aria-label]="ariaLabel"
      [modules]="modules"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="rowData"
      [rowHeight]="rowHeight"
      [class.app-data-grid__grid--sticky-header]="stickyHeader"
      [loading]="loading"
      [pagination]="pagination"
      [paginationPageSize]="boundedPageSize"
      [paginationPageSizeSelector]="pageSizeOptions"
      [localeText]="agGridLocaleText()"
      [getRowId]="getRowId"
      [rowSelection]="rowSelection"
      (cellClicked)="handleCellClicked($event)"
      (selectionChanged)="handleSelectionChanged($event)"
    />
  }
  <p class="app-data-grid__page-limit" data-testid="app-data-grid-page-limit">{{ i18n.translate('grid.pageLimit', { count: maximumPageSizeLabel }) }}</p>
</section>
