version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /coglatas-frontend
      - /tools/frontend-inspections
    schedule:
      interval: cron
      cronjob: "0 3 * * *"
      timezone: Asia/Tokyo
    # The goal is fast PR creation, not an age-based trust decision.
    # Explicit wildcard exclusion overrides the default three-day cooldown.
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 20
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      npm-angular-version-updates:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - patch
          - minor
      npm-ngrx-version-updates:
        applies-to: version-updates
        patterns:
          - "@ngrx/*"
        update-types:
          - patch
          - minor
      npm-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngrx/*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: nuget
    directories:
      - /src/Coglatas.Web
      - /src/Coglatas.Application
      - /src/Coglatas.Infrastructure
      - /tests/Coglatas.Tests
    schedule:
      interval: cron
      cronjob: "10 3 * * *"
      timezone: Asia/Tokyo
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 20
    groups:
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      nuget-ef-postgres-version-updates:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
        update-types:
          - patch
          - minor
      nuget-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  # Dependabot natively updates the pinned SDK version in global.json.
  # Keep SDK PRs separate from application NuGet changes and require
  # Docker/Compose image parity through the existing review/CI gates.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: cron
      cronjob: "20 3 * * *"
      timezone: Asia/Tokyo
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(dotnet)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "30 3 * * *"
      timezone: Asia/Tokyo
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 10
    groups:
      github-actions-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/sakura
      - /infra/docker
    schedule:
      interval: cron
      cronjob: "40 3 * * *"
      timezone: Asia/Tokyo
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 10
    groups:
      docker-sdk-updates:
        applies-to: version-updates
        patterns:
          - "dotnet/sdk"
          - "mcr.microsoft.com/dotnet/sdk"
      docker-image-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "dotnet/sdk"
          - "mcr.microsoft.com/dotnet/sdk"
    ignore:
      # Node 24 is the current approved LTS baseline. Dependabot must not
      # propose Current/non-LTS Node majors as a production build dependency.
      # Reassess this explicit hold when the next line becomes LTS and the
      # owner approves a separate toolchain migration; minor/patch/digest
      # updates within Node 24 remain eligible.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      # infra/docker/playwright.Dockerfile must stay on the exact browser/runtime
      # version resolved by the root @playwright/test lockfile. Upgrade it only
      # as part of the coordinated npm Playwright update and compatibility pass.
      - dependency-name: "playwright"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/sakura
      - /deploy/onprem
      - /infra/compose/dev
      - /infra/compose/test
      - /infra/compose/performance
    schedule:
      interval: cron
      cronjob: "50 3 * * *"
      timezone: Asia/Tokyo
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 10
    groups:
      docker-compose-sdk-updates:
        applies-to: version-updates
        patterns:
          - "dotnet/sdk"
          - "mcr.microsoft.com/dotnet/sdk"
      docker-compose-image-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "dotnet/sdk"
          - "mcr.microsoft.com/dotnet/sdk"
    # Keep the same approved Node LTS-major boundary for Compose images.
    # Security/digest/patch updates on Node 24 remain proposal candidates.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(compose)"
