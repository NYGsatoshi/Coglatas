version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /coglatas-frontend
      - /tools/frontend-inspections
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 20
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      npm-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: nuget
    directories:
      - /src/Coglatas.Web
      - /src/Coglatas.Application
      - /src/Coglatas.Infrastructure
      - /tests/Coglatas.Tests
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 20
    groups:
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      nuget-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      github-actions-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/sakura
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      docker-image-updates:
        patterns:
          - "*"
    ignore:
      # Node 24 is the repository's current LTS baseline. Promote to a new Node
      # major only through an explicit toolchain migration and acceptance pass.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      # Dockerfile.playwright must stay on the exact browser/runtime version
      # resolved by the root @playwright/test lockfile. Upgrade the image only
      # as part of the coordinated npm Playwright update and compatibility pass.
      - dependency-name: "playwright"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/sakura
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      docker-compose-image-updates:
        patterns:
          - "*"
    ignore:
      # Keep Docker Compose service images on the same Node LTS-major policy as
      # Dockerfiles; remove this hold only as part of the explicit Node migration.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(compose)"
