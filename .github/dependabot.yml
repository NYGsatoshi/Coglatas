version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /coglatas-frontend
      - /tools/frontend-inspections
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Tokyo
    # Favor prompt patch PRs without bypassing any review or CI gate.
    cooldown:
      default-days: 1
      semver-patch-days: 1
      semver-minor-days: 2
      semver-major-days: 7
    open-pull-requests-limit: 20
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      npm-angular-version-updates:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - patch
          - minor
      npm-ngrx-version-updates:
        applies-to: version-updates
        patterns:
          - "@ngrx/*"
        update-types:
          - patch
          - minor
      npm-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngrx/*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: nuget
    directories:
      - /src/Coglatas.Web
      - /src/Coglatas.Application
      - /src/Coglatas.Infrastructure
      - /tests/Coglatas.Tests
    schedule:
      interval: daily
      time: "03:15"
      timezone: Asia/Tokyo
    # Favor prompt patch PRs without bypassing any review or CI gate.
    cooldown:
      default-days: 1
      semver-patch-days: 1
      semver-minor-days: 2
      semver-major-days: 7
    open-pull-requests-limit: 20
    groups:
      nuget-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      nuget-ef-postgres-version-updates:
        applies-to: version-updates
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
        update-types:
          - patch
          - minor
      nuget-compatible-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"

  # Dependabot natively updates the pinned SDK version in global.json.
  # Keep SDK PRs separate from application NuGet changes and require
  # Docker/Compose image parity through the existing review/CI gates.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: daily
      time: "03:10"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(dotnet)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      github-actions-updates:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/sakura
    schedule:
      interval: daily
      time: "03:45"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      docker-image-updates:
        patterns:
          - "*"
    ignore:
      # The Docker updater retains SDK image coverage. Cross-file SDK parity
      # is enforced separately; never merge a mismatched SDK/image candidate.
      # Node 24 is the repository's current LTS baseline. Promote to a new Node
      # major only through an explicit toolchain migration and acceptance pass.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      # infra/docker/playwright.Dockerfile must stay on the exact browser/runtime version
      # resolved by the root @playwright/test lockfile. Upgrade the image only
      # as part of the coordinated npm Playwright update and compatibility pass.
      - dependency-name: "playwright"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/sakura
    schedule:
      interval: daily
      time: "04:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      docker-compose-image-updates:
        patterns:
          - "*"
    ignore:
      # Keep SDK image coverage; release-time parity is a required review.
      # Keep Docker Compose service images on the same Node LTS-major policy as
      # Dockerfiles; remove this hold only as part of the explicit Node migration.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore(compose)"
