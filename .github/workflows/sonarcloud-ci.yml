name: SonarQube Cloud CI-based analysis

# The repository policy forbids secrets in pull_request workflows. Scan only
# pushes in the base repository, resolving same-repository PR metadata via the
# read-only GitHub API. External fork heads are never executed with SONAR_TOKEN.
on:
  push:
    branches: ["**"]

concurrency:
  group: sonarcloud-ci-${{ github.ref }}
  cancel-in-progress: true

# Explicitly deny workflow-wide grants; each job grants its own minimum scope.
permissions: {}

jobs:
  target:
    name: Resolve trusted analysis target
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_scan: ${{ steps.resolve.outputs.should_scan }}
      analysis_kind: ${{ steps.resolve.outputs.analysis_kind }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
      pr_base: ${{ steps.resolve.outputs.pr_base }}
    steps:
      - name: Resolve main or exact same-repository PR
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_ACTOR: ${{ github.actor }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          ORGANIZATION_KEY: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_REPOSITORY" != "NYGsatoshi/Coglatas" ]]; then
            echo "::error::Unexpected repository identity."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ -z "${PROJECT_KEY:-}" || -z "${ORGANIZATION_KEY:-}" ]]; then
              echo "::error::Configure SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
              exit 1
            fi
            {
              echo "should_scan=true"
              echo "analysis_kind=main"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub Apps (including dependency-update bots) can push to branches
          # in the upstream repository. Such push access does not mean the
          # branch's dependencies or build code are safe to execute with a
          # SonarCloud token. Limit PR analysis to pushes by the repo owner.
          if [[ "$TARGET_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "Non-owner branch push: skipping token-backed Sonar analysis."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A push to the upstream repository is not a pull_request event.
          # Confirm the PR head repository, branch, exact SHA and target base
          # against the authoritative API; never accept caller-supplied PR IDs.
          pulls="$(gh api --method GET "/repos/$TARGET_REPOSITORY/pulls" \
            -f state=open -f base=main \
            -f "head=$GITHUB_REPOSITORY_OWNER:$TARGET_BRANCH" -f per_page=100)"

          eligible="$(jq -c \
            --arg repo "$TARGET_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --arg sha "$TARGET_SHA" \
            '[.[] | select(
                .state == "open" and
                .base.ref == "main" and
                .base.repo.full_name == $repo and
                .head.repo.full_name == $repo and
                .head.ref == $branch and
                .head.sha == $sha
              )]' <<< "$pulls")"

          count="$(jq 'length' <<< "$eligible")"
          if [[ "$count" -gt 1 ]]; then
            echo "::error::Ambiguous pull request identity; refusing token-backed analysis."
            exit 1
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "No matching open same-repository PR at the pushed SHA; skipping Sonar analysis."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${PROJECT_KEY:-}" || -z "${ORGANIZATION_KEY:-}" ]]; then
            echo "::error::Configure SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "$eligible")"
          pr_branch="$(jq -r '.[0].head.ref' <<< "$eligible")"
          {
            echo "should_scan=true"
            echo "analysis_kind=pull_request"
            echo "pr_number=$pr_number"
            echo "pr_branch=$pr_branch"
            echo "pr_base=main"
          } >> "$GITHUB_OUTPUT"

  windows-dotnet:
    name: Native Windows .NET coverage without analysis credentials
    permissions:
      contents: read
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ASPNETCORE_ENVIRONMENT: Test
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Preserve original Git source bytes on the ephemeral runner
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Set up Python for original report verification
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"

      - name: Set up Node for the existing portable cohort contract
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Use repository npm without lifecycle scripts
        run: npm install --global npm@11.17.0 --no-audit --no-fund --ignore-scripts

      - name: Install locked portable verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore and freshly build revision-stamped Windows binaries
        shell: pwsh
        run: |
          dotnet restore Coglatas.slnx --disable-parallel --verbosity minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Coglatas.slnx --configuration Release --no-restore --no-incremental --disable-build-servers -m:1 -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true
          exit $LASTEXITCODE

      - name: Collect actual native Windows portable coverage
        shell: pwsh
        run: |
          dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj --configuration Release --no-build --no-restore --disable-build-servers -m:1 --filter "Portability=CrossPlatform" --collect "XPlat Code Coverage;Format=cobertura;DeterministicReport=true" --logger "trx;LogFileName=windows-tests.trx" --results-directory artifacts/sonar-windows
          exit $LASTEXITCODE

      - name: Verify original Windows execution and source identity
        shell: pwsh
        run: |
          node scripts/ci/verify-os-portability-results.mjs --contract scripts/ci/os-portability.contract.json --trx artifacts/sonar-windows/windows-tests.trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostGit = (Get-Command git.exe -CommandType Application -All | Select-Object -First 1).Source
          python -B scripts/ci/verify-sonar-windows-coverage.py capture --folder artifacts/sonar-windows --git "$hostGit" --sha $env:GITHUB_SHA --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          exit $LASTEXITCODE

      - name: Retain original native Windows report and binary provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-windows-dotnet-coverage
          path: artifacts/sonar-windows/
          if-no-files-found: error
          retention-days: 7

  python-native-lanes:
    name: Python native coverage admission / ${{ matrix.lane }}
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    strategy:
      fail-fast: false
      matrix:
        # PR: execute the entire canonical inventory once, in disjoint lanes.
        # Main retains the independent full-baseline equivalence experiment.
        lane: ${{ fromJSON(needs.target.outputs.analysis_kind == 'pull_request' && '["shard-1","shard-2"]' || '["baseline","shard-1","shard-2"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install checksum-pinned Python coverage tool
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes
          --target "$RUNNER_TEMP/sonar-coverage-tools"
          -r scripts/ci/sonar-coverage-requirements.txt

      - name: Test native Python sharding evidence controls
        run: python3 -B scripts/ci/test-sonar-python-sharding.py

      - name: Measure existing CI regression controls without analysis credentials
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ runner.temp }}/sonar-coverage-tools
          COVERAGE_CORE: pytrace
          PROOF_LANE: ${{ matrix.lane }}
        run: python3 -B scripts/ci/verify-sonar-python-sharding.py collect --lane "$PROOF_LANE"

      - name: Retain original process shards and native lane reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-python-shard-proof-${{ matrix.lane }}-${{ github.run_attempt }}
          path: artifacts/sonar-python-shard-lane/
          if-no-files-found: error
          retention-days: 7

  python-coverage:
    name: Verify Python shard equivalence and GCP coverage without analysis credentials
    permissions:
      contents: read
    needs: [target, python-native-lanes]
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      digest: ${{ steps.handoff.outputs.digest }}
    steps:
      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install checksum-pinned Python coverage tool without analysis credentials
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes
          --target "$RUNNER_TEMP/sonar-coverage-tools"
          -r scripts/ci/sonar-coverage-requirements.txt

      - name: Download exact-attempt Python lane evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-python-shard-proof-*-${{ github.run_attempt }}
          path: artifacts/sonar-python-shard-proof

      - name: Require complete native Python coverage admission
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ runner.temp }}/sonar-coverage-tools
          COVERAGE_CORE: pytrace
          PROOF_MODE: ${{ needs.target.outputs.analysis_kind == 'pull_request' && 'single-pass' || 'full' }}
        run: python3 -B scripts/ci/verify-sonar-python-sharding.py compare --mode "$PROOF_MODE"

      - name: Stage native coverage.py combined evidence without report rewriting
        shell: bash
        run: |
          set -euo pipefail
          test ! -e artifacts/sonar-python
          mkdir -p artifacts/sonar-python/native-shards
          for report in coverage.xml coverage.native.json coverage.native.data receipt.json; do
            source="artifacts/sonar-python-shard-equivalence/$report"
            target="artifacts/sonar-python/$report"
            test -s "$source"
            test ! -L "$source"
            cp -- "$source" "$target"
            cmp -- "$source" "$target"
          done
          # Retain every native shard; Main's independent baseline has its own archive.
          for lane in shard-1 shard-2; do
            source="artifacts/sonar-python-shard-proof/sonar-python-shard-proof-$lane-${GITHUB_RUN_ATTEMPT}/native-shards"
            target="artifacts/sonar-python/native-shards/$lane"
            test -d "$source"
            test ! -L "$source"
            mkdir "$target"
            cp -- "$source"/* "$target/"
            for original in "$source"/*; do
              cmp -- "$original" "$target/${original##*/}"
            done
          done

      - name: Measure GCP loopback controls separately before analysis credentials
        env:
          PYTHONPATH: ${{ runner.temp }}/sonar-coverage-tools
          COVERAGE_FILE: ${{ runner.temp }}/sonar-gcp.coverage
          COVERAGE_CORE: pytrace
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-gcp
          python3 -B -m coverage run --rcfile= --branch --source=deploy/gcp tests/ci/test_gcp_loopback.py
          python3 -B -m coverage xml --rcfile= -o artifacts/sonar-gcp/coverage.xml
          python3 -B - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd().resolve()
          expected = root / 'deploy/gcp/verify-loopback.py'
          document = ET.parse('artifacts/sonar-gcp/coverage.xml')
          sources = [Path(node.text).resolve() for node in document.findall('./sources/source')]
          classes = document.findall('.//class')
          assert len(classes) == 1
          assert expected in {(source / classes[0].attrib['filename']).resolve() for source in sources}
          rows = classes[0].findall('./lines/line')
          lines = [int(row.attrib['number']) for row in rows]
          assert len(lines) == len(set(lines)) and lines
          assert all(0 < line <= len(expected.read_text(encoding='utf-8').splitlines()) for line in lines)
          assert all(int(row.attrib['hits']) >= 0 for row in rows)
          baseline = ET.parse('artifacts/sonar-python/coverage.xml')
          old_sources = [Path(node.text).resolve() for node in baseline.findall('./sources/source')]
          assert all(expected not in {(source / node.attrib['filename']).resolve() for source in old_sources}
                     for node in baseline.findall('.//class'))
          print('Original GCP guard coverage source verified; existing Python cohort remains disjoint.')
          PY

      - name: Retain original GCP loopback coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-gcp-loopback-coverage
          path: artifacts/sonar-gcp/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Retain original Python coverage and native shards
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-python-native-coverage
          path: |
            artifacts/sonar-python/coverage.xml
            artifacts/sonar-python/coverage.native.json
            artifacts/sonar-python/coverage.native.data
            artifacts/sonar-python/receipt.json
            artifacts/sonar-python/native-shards/**
          if-no-files-found: error
          retention-days: 7

      - name: Bind Python coverage handoff to exact execution
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for report in artifacts/sonar-python/coverage.xml artifacts/sonar-gcp/coverage.xml artifacts/sonar-python/receipt.json; do
            test -s "$report"
            test ! -L "$report"
          done
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE"
              sha256sum -- artifacts/sonar-python/coverage.xml artifacts/sonar-gcp/coverage.xml artifacts/sonar-python/receipt.json
            } | sha256sum | cut -d ' ' -f1
          )"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload Python scanner inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-python-handoff-${{ github.run_attempt }}
          path: |
            artifacts/sonar-python/coverage.xml
            artifacts/sonar-gcp/coverage.xml
            artifacts/sonar-python/receipt.json
          if-no-files-found: error
          retention-days: 7

  javascript-coverage:
    name: Node native coverage without analysis credentials
    permissions:
      contents: read
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      digest: ${{ steps.handoff.outputs.digest }}
    steps:
      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install existing reporter dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install pinned headless Chromium for existing Group entry controls
        run: node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium

      - name: Prepare pinned isolated recovery PostgreSQL before analysis credentials
        run: docker pull postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

      - name: Measure existing Functional and roster Node controls before credentials
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/sonar-node/raw
          COGLATAS_RI_NATIVE_TEST: '1'
        run: |
          mkdir -p artifacts/sonar-node
          coverage_temp_root="$(node -p 'require("node:os").tmpdir()')"
          node --enable-source-maps --test --experimental-test-coverage \
            --test-coverage-exclude='**/*.node-test.mjs' \
            --test-coverage-exclude='**/tests/ci/synthetic-trigger-catalog.postgres-test.mjs' \
            --test-coverage-exclude='**/scripts/security/zap-attribution.test.cjs' \
            --test-coverage-exclude='**/tests/ci/test_restore_data_dependency_advisor.mjs' \
            --test-coverage-exclude="$coverage_temp_root/thread-secondary-reporter-*/**" \
            --test-coverage-exclude="$coverage_temp_root/coglatas-thread-matrix-*/**" \
            --test-coverage-exclude="$coverage_temp_root/group-keyboard-control-*/**" \
            --test-coverage-exclude="$coverage_temp_root/search-drawer-control-*/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-node/lcov.info \
            tests/functional/build-functional-grep.node-test.mjs \
            tests/functional/functional-diagnostics.node-test.mjs \
            tests/functional/messaging-observation.node-test.mjs \
            tests/functional/thread-initial-observation.node-test.mjs \
            tests/functional/thread-probe-observation.node-test.mjs \
            tests/functional/private-playwright-output.node-test.mjs \
            tests/ui/readonly-roster-runner.node-test.mjs \
            tests/ui/readonly-roster-fixture.node-test.mjs \
            tests/ui/actor-replacement-runner.node-test.mjs \
            tests/ui/prepare-host-artifacts.node-test.mjs \
            tests/ui/real-backend-smoke-compose-helpers.node-test.mjs \
            tests/ui/student-council-pilot-origin-guard.node-test.mjs \
            tests/ui/webkit-pinned-provisioning.node-test.mjs \
            tests/ui/mobile-mvp0-profile.node-test.mjs \
            tests/ui/mobile-mvp0-runner.node-test.mjs \
            tests/diagnostics/thread-matrix.node-test.mjs \
            tests/ui/group-keyboard-observation.node-test.mjs \
            tests/ui/search-drawer-observation.node-test.mjs \
            tests/ui/observer-dom-runtime.node-test.mjs \
            tests/ui/group-entry-coverage.node-test.mjs \
            scripts/ci/node-toolchain-qualification.node-test.mjs \
            tests/ci/synthetic-logical-recovery.node-test.mjs \
            tests/ci/synthetic-logical-recovery-cleanup.node-test.mjs \
            tests/ci/synthetic-logical-recovery-probe.node-test.mjs \
            tests/ci/synthetic-trigger-catalog.node-test.mjs \
            tests/ci/synthetic-trigger-catalog.postgres-test.mjs \
            tests/ci/synthetic-restore-list.node-test.mjs \
            tests/ci/test_restore_data_dependency_advisor.mjs \
            tests/ui/channel-dialog-serializer-coverage.node-test.mjs \
            scripts/security/zap-attribution.test.cjs \
            scripts/ci/verify-sonar-node-coverage.node-test.mjs
          test -s artifacts/sonar-node/lcov.info
          node scripts/ci/verify-sonar-node-coverage.mjs artifacts/sonar-node/lcov.info
          env -u NODE_V8_COVERAGE node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          import { readOwnedRepositoryText, trustedGitExecutable } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd()), sha = process.env.GITHUB_SHA;
          assert.match(sha ?? '', /^[a-f0-9]{40}$/);
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const paths = ['tests/functional/fixtures/functional-diagnostics.mjs',
            'tests/functional/fixtures/messaging-observation.mjs',
            'tests/functional/helpers/thread-probe-diagnostics.mjs',
            'tests/functional/helpers/thread-probe-observation.mjs',
            'tests/ui/helpers/group-keyboard-observation.mjs',
            'tests/ui/helpers/search-drawer-observation.mjs'];
          const subjects = new Map(paths.map(path => {
            const source = readOwnedRepositoryText(root, path);
            const original = execFileSync(trustedGitExecutable(), ['show', sha + ':' + path]);
            assert.ok(original.equals(Buffer.from(source)), 'Source differs from Git: ' + path);
            return [pathToFileURL(resolve(root, path)).href,
              { path, sourceSha256: digest(original), utf16Length: source.length, records: 0 }];
          }));
          const originals = [];
          for (const name of readdirSync('artifacts/sonar-node/raw').filter(name => /^coverage-.*\.json$/.test(name))) {
            const text = readOwnedRepositoryText(root, 'artifacts/sonar-node/raw/' + name);
            const raw = JSON.parse(text);
            originals.push({ name, sha256: digest(text) });
            for (const script of raw.result) {
              const subject = subjects.get(script.url);
              if (!subject) continue;
              assert.ok(!raw['source-map-cache']?.[script.url]?.data,
                'Functional helper was transpiled: ' + subject.path);
              const ranges = script.functions.flatMap(fn => fn.ranges);
              assert.ok(ranges.length > 0);
              for (const range of ranges) {
                assert.ok(Number.isInteger(range.startOffset) && Number.isInteger(range.endOffset) &&
                  range.startOffset >= 0 && range.startOffset <= range.endOffset && range.endOffset <= subject.utf16Length,
                  'Raw range differs from Git: ' + subject.path);
                assert.ok(Number.isSafeInteger(range.count) && range.count >= 0, 'Invalid native hit count: ' + subject.path);
              }
              const end = Math.max(...ranges.map(range => range.endOffset));
              assert.equal(end, subject.utf16Length, 'Raw coordinates differ from Git: ' + subject.path);
              subject.records++;
            }
          }
          assert.ok(originals.length > 0);
          for (const subject of subjects.values()) assert.ok(subject.records > 0, 'Missing native source: ' + subject.path);
          const report = readOwnedRepositoryText(root, 'artifacts/sonar-node/lcov.info');
          const reported = new Set(report.split(/\r?\n/).filter(row => row.startsWith('SF:'))
            .map(row => pathToFileURL(resolve(root, row.slice(3))).href));
          for (const [url, subject] of subjects) assert.ok(reported.has(url), 'Missing LCOV source: ' + subject.path);
          writeFileSync('artifacts/sonar-node/representation.json', JSON.stringify({
            sourceSha: sha, nodeVersion: process.version, reportSha256: digest(report),
            subjects: [...subjects.values()], rawFiles: originals, originalBytesRewritten: false,
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log('Functional helper native coordinates match Git: ' + subjects.size + ' subjects.');
          JS

      - name: Retain measured Node regression coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-node-coverage
          path: |
            artifacts/sonar-node/lcov.info
            artifacts/sonar-node/representation.json
          if-no-files-found: error
          retention-days: 7

      - name: Qualify existing private output CLI imports without coverage
        run: |
          test "$(/usr/bin/id -u)" -ne 0
          unset NODE_V8_COVERAGE NODE_OPTIONS
          node --test tests/functional/private-playwright-output-import.node-test.mjs

      - name: Retain original Functional and roster raw V8 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-node-raw-v8
          path: artifacts/sonar-node/raw/
          if-no-files-found: error
          retention-days: 7

      - name: Measure existing Pilot helpers in a separate native cohort
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-pilot-helper
          node --test --experimental-test-coverage --test-concurrency=1 \
            --test-coverage-include='tests/ui/public-https-golden-path-helpers.mjs' \
            --test-coverage-include='tests/ui/student-council-pilot-helpers.mjs' \
            --test-coverage-include='tests/ui/student-council-pilot-run.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-pilot-helper/lcov.info \
            tests/ui/student-council-pilot-helpers.node-test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { realpathSync } from 'node:fs';
          import { relative, resolve } from 'node:path';
          import { readOwnedRepositoryText, validateNodeCoverage } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd());
          const identity = source => relative(root, resolve(root, source)).replaceAll('\\', '/');
          const text = readOwnedRepositoryText(root, 'artifacts/sonar-pilot-helper/lcov.info');
          assert.ok(Buffer.byteLength(text) <= 1024 * 1024);
          const checked = validateNodeCoverage(text);
          const sources = new Set(text.split(/\r?\n/).filter(row => row.startsWith('SF:')).map(row => identity(row.slice(3))));
          assert.equal(checked.sourceFiles, 3); assert.equal(sources.size, 3);
          for (const source of ['tests/ui/public-https-golden-path-helpers.mjs', 'tests/ui/student-council-pilot-helpers.mjs', 'tests/ui/student-council-pilot-run.mjs']) assert.ok(sources.has(source));
          const baseline = readOwnedRepositoryText(root, 'artifacts/sonar-node/lcov.info');
          validateNodeCoverage(baseline);
          for (const row of baseline.split(/\r?\n/).filter(row => row.startsWith('SF:'))) assert.ok(!sources.has(identity(row.slice(3))), 'Native source reports must be disjoint.');
          console.log('Pilot helper native source scope verified: ' + JSON.stringify(checked));
          JS

      - name: Retain original Pilot helper native coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-pilot-helper-coverage
          path: artifacts/sonar-pilot-helper/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Measure existing operational contract controls before credentials
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/sonar-operational/raw
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-operational
          node --enable-source-maps --test --experimental-test-coverage --test-concurrency=1 \
            --test-coverage-include='frontend/scripts/check-av-mig-source.mjs' \
            --test-coverage-include='scripts/ci/check-npm-audit-baseline.mjs' \
            --test-coverage-include='scripts/ci/os-portability-contract.mjs' \
            --test-coverage-include='scripts/ci/verify-os-portability-results.mjs' \
            --test-coverage-include='scripts/ci/compat-critical-contract.mjs' \
            --test-coverage-include='tests/ui/fixed-sha-evidence.mjs' \
            --test-coverage-include='tests/ui/real-backend-authorization-frame.mjs' \
            --test-coverage-include='scripts/security/sec-arch-runtime-options.mjs' \
            --test-coverage-include='scripts/security/sec-arch-runtime-assemblies.mjs' \
            --test-coverage-include='scripts/security/sec-arch-kafka-acls.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-operational/lcov.info \
            frontend/scripts/av-mig-source.node-test.mjs \
            scripts/ci/check-npm-audit-baseline.node-test.mjs \
            tests/ci/os-portability-contract.node-test.mjs \
            tests/ui/compat-critical-contract.node-test.mjs \
            tests/ui/fixed-sha-evidence.node-test.mjs \
            tests/ui/real-backend-authorization-frame.node-test.mjs \
            scripts/security/sec-arch-runtime-options.test.mjs \
            scripts/security/sec-arch-kafka-acls.test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { realpathSync } from 'node:fs';
          import { relative, resolve } from 'node:path';
          import { readOwnedRepositoryText, validateNodeCoverage } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd());
          const identity = source => relative(root, resolve(root, source)).replaceAll('\\', '/');
          const text = readOwnedRepositoryText(root, 'artifacts/sonar-operational/lcov.info');
          assert.ok(Buffer.byteLength(text) <= 1024 * 1024);
          const checked = validateNodeCoverage(text);
          const sources = new Set(text.split(/\r?\n/).filter(row => row.startsWith('SF:')).map(row => identity(row.slice(3))));
          const paths = ['frontend/scripts/check-av-mig-source.mjs', 'scripts/ci/check-npm-audit-baseline.mjs',
            'scripts/ci/os-portability-contract.mjs', 'scripts/ci/verify-os-portability-results.mjs',
            'scripts/ci/compat-critical-contract.mjs', 'tests/ui/fixed-sha-evidence.mjs',
            'tests/ui/real-backend-authorization-frame.mjs', 'scripts/security/sec-arch-runtime-options.mjs',
            'scripts/security/sec-arch-runtime-assemblies.mjs', 'scripts/security/sec-arch-kafka-acls.mjs'];
          assert.equal(checked.sourceFiles, paths.length); assert.deepEqual([...sources].sort(), [...paths].sort());
          for (const report of ['artifacts/sonar-node/lcov.info', 'artifacts/sonar-pilot-helper/lcov.info']) {
            const existing = readOwnedRepositoryText(root, report);
            validateNodeCoverage(existing);
            for (const row of existing.split(/\r?\n/).filter(row => row.startsWith('SF:'))) assert.ok(!sources.has(identity(row.slice(3))), 'Native source reports must be disjoint.');
          }
          console.log('Operational native source scope verified: ' + JSON.stringify(checked));
          JS

      - name: Install locked operational report converter without analysis credentials
        run: >-
          npm ci --prefix scripts/ci/sonar-operational-coverage-tools
          --ignore-scripts --no-audit --no-fund --engine-strict

      - name: Convert only original untransformed operational ranges and verify zero controls
        run: |
          set -euo pipefail
          node scripts/ci/sonar-operational-coverage-tools/node_modules/c8/bin/c8.js report \
            --config=scripts/ci/sonar-operational-coverage-tools/c8.json \
            --temp-directory=artifacts/sonar-operational/raw \
            --reports-dir=artifacts/sonar-operational/c8
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, realpathSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { relative, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { readOwnedRepositoryText, validateNodeCoverage } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd());
          const paths = ['frontend/scripts/check-av-mig-source.mjs', 'scripts/ci/check-npm-audit-baseline.mjs',
            'scripts/ci/os-portability-contract.mjs', 'scripts/ci/verify-os-portability-results.mjs',
            'scripts/ci/compat-critical-contract.mjs', 'tests/ui/fixed-sha-evidence.mjs',
            'tests/ui/real-backend-authorization-frame.mjs', 'scripts/security/sec-arch-runtime-options.mjs',
            'scripts/security/sec-arch-runtime-assemblies.mjs', 'scripts/security/sec-arch-kafka-acls.mjs'];
          const report = readOwnedRepositoryText(root, 'artifacts/sonar-operational/c8/lcov.info');
          const checked = validateNodeCoverage(report);
          const sources = report.split(/\r?\n/).filter(row => row.startsWith('SF:'))
            .map(row => relative(root, resolve(root, row.slice(3))).replaceAll('\\', '/'));
          assert.equal(checked.sourceFiles, paths.length); assert.deepEqual(sources.sort(), [...paths].sort());
          const originals = new Map(paths.map(path => [pathToFileURL(resolve(root, path)).href,
            { path, source: readFileSync(resolve(root, path), 'utf8'), scripts: [] }]));
          const rawFiles = readdirSync('artifacts/sonar-operational/raw').filter(name => /^coverage-.*\.json$/.test(name));
          assert.ok(rawFiles.length > 0);
          for (const name of rawFiles) {
            const raw = JSON.parse(readOwnedRepositoryText(root, 'artifacts/sonar-operational/raw/' + name));
            for (const script of raw.result) {
              const original = originals.get(script.url);
              if (!original) continue;
              assert.ok(!raw['source-map-cache']?.[script.url]?.data, 'Transformed source requires separate qualification.');
              assert.equal(script.functions[0].ranges[0].endOffset, original.source.length);
              original.scripts.push(script);
            }
          }
          for (const original of originals.values()) assert.ok(original.scripts.length > 0);
          const audit = [...originals.values()].find(item => item.path === paths[1]);
          const auditRecord = report.split('end_of_record').find(block => block.split(/\r?\n/)
            .some(row => row.startsWith('SF:') && relative(root, resolve(root, row.slice(3))).replaceAll('\\', '/') === paths[1]));
          assert.ok(auditRecord);
          const countsAt = offset => audit.scripts.map(script => {
            const ranges = script.functions.flatMap(fn => fn.ranges)
              .filter(range => range.startOffset <= offset && offset < range.endOffset)
              .sort((a, b) => (a.endOffset - a.startOffset) - (b.endOffset - b.startOffset));
            assert.ok(ranges.length > 0);
            return ranges[0].count;
          });
          const markers = ['url', 'title'].map(key => 'return ' + String.fromCharCode(96) + key + ':');
          markers.push("return 'unknown';");
          const zeroControls = [];
          for (const marker of markers) {
            const offset = audit.source.indexOf(marker);
            assert.ok(offset > 0); assert.equal(audit.source.indexOf(marker, offset + 1), -1);
            const counts = countsAt(offset); assert.ok(counts.every(count => count === 0));
            const line = audit.source.slice(0, offset).split('\n').length;
            assert.ok(auditRecord.split(/\r?\n/).includes('DA:' + line + ',0'), 'A never-executed return must remain uncovered in its own source record.');
            zeroControls.push({ line, rawRecords: counts.length, allZero: true });
          }
          const positive = audit.source.indexOf('return ' + String.fromCharCode(96) + 'advisory:');
          assert.ok(positive > 0); assert.ok(countsAt(positive).some(count => count > 0));
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/);
          const digest = value => createHash('sha256').update(value).digest('hex');
          writeFileSync('artifacts/sonar-operational/c8/report-tool.json', JSON.stringify({
            sourceSha: process.env.GITHUB_SHA, processorNodeVersion: process.version,
            c8Version: JSON.parse(readOwnedRepositoryText(root, 'scripts/ci/sonar-operational-coverage-tools/node_modules/c8/package.json')).version,
            toolLockSha256: digest(readOwnedRepositoryText(root, 'scripts/ci/sonar-operational-coverage-tools/package-lock.json')),
            originalNativeReportSha256: digest(readOwnedRepositoryText(root, 'artifacts/sonar-operational/lcov.info')),
            convertedReportSha256: digest(report), zeroControls,
            matchedRawScripts: [...originals.values()].map(item => ({ source: item.path, records: item.scripts.length })),
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log('Original operational range/source identity and uncovered returns verified: ' + JSON.stringify({ checked, zeroControls }));
          JS

      - name: Retain original operational native coverage and ranges
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-operational-coverage
          path: artifacts/sonar-operational/
          if-no-files-found: error
          retention-days: 7

      - name: Bind JavaScript coverage handoff to exact execution
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for report in artifacts/sonar-node/lcov.info artifacts/sonar-pilot-helper/lcov.info artifacts/sonar-operational/c8/lcov.info; do
            test -s "$report"
            test ! -L "$report"
          done
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE"
              sha256sum -- artifacts/sonar-node/lcov.info artifacts/sonar-pilot-helper/lcov.info artifacts/sonar-operational/c8/lcov.info
            } | sha256sum | cut -d ' ' -f1
          )"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload JavaScript scanner inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-javascript-handoff-${{ github.run_attempt }}
          path: |
            artifacts/sonar-node/lcov.info
            artifacts/sonar-pilot-helper/lcov.info
            artifacts/sonar-operational/c8/lcov.info
          if-no-files-found: error
          retention-days: 7

  angular-native-lanes:
    name: Angular native coverage admission / ${{ matrix.lane }}
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    strategy:
      fail-fast: false
      matrix:
        # PR executes the original unfiltered baseline exactly once.
        # Main retains the independent baseline and complementary shards.
        lane: ${{ fromJSON(needs.target.outputs.analysis_kind == 'pull_request' && '["baseline"]' || '["baseline","shard-1","shard-2"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install existing reporter dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Test the qualification parser
        run: python3 -B scripts/ci/test-sonar-angular-coverage.py

      - name: Run original Angular coverage command with native test-result reporter
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          PROOF_LANE: ${{ matrix.lane }}
        run: python3 -B scripts/ci/verify-sonar-angular-coverage.py collect --lane "$PROOF_LANE"

      - name: Retain original Angular test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-angular-shard-proof-${{ matrix.lane }}-${{ github.run_attempt }}
          path: artifacts/sonar-angular-proof/
          if-no-files-found: error
          retention-days: 7


  angular-coverage:
    name: Verify native Angular coverage admission without analysis credentials
    permissions:
      contents: read
    needs: [target, angular-native-lanes]
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.handoff.outputs.digest }}
    steps:
      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # v8 extracts a single pattern match directly into path, whereas
      # multiple matches get artifact-name subdirectories. Preserve the exact
      # lane inventory in both modes; extra matches in PR mode fail admission.
      - name: Download original Angular baseline into its exact lane directory
        if: needs.target.outputs.analysis_kind == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-angular-shard-proof-*-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-proof/sonar-angular-shard-proof-baseline-${{ github.run_attempt }}
          merge-multiple: false

      - name: Download original Angular baseline and shards from this attempt
        if: needs.target.outputs.analysis_kind == 'main'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-angular-shard-proof-*-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-proof
          merge-multiple: false

      - name: Require complete native Angular coverage admission
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          PROOF_MODE: ${{ needs.target.outputs.analysis_kind == 'pull_request' && 'baseline-only' || 'full' }}
        run: python3 -B scripts/ci/verify-sonar-angular-coverage.py compare --mode "$PROOF_MODE"

      - name: Stage only the selected original native Angular reports for scanner ingestion
        shell: bash
        env:
          SONAR_ANALYSIS_KIND: ${{ needs.target.outputs.analysis_kind }}
        run: |
          set -euo pipefail
          case "$SONAR_ANALYSIS_KIND" in
            pull_request) lanes=(baseline) ;;
            main) lanes=(shard-1 shard-2) ;;
            *) exit 1 ;;
          esac
          test ! -e artifacts/sonar-angular-inputs
          for lane in "${lanes[@]}"; do
            source="artifacts/sonar-angular-shard-proof/sonar-angular-shard-proof-$lane-${GITHUB_RUN_ATTEMPT}/lcov.info"
            target="artifacts/sonar-angular-inputs/$lane/lcov.info"
            mkdir -p "$(dirname "$target")"
            cp -- "$source" "$target"
            cmp -- "$source" "$target"
          done
          cp -- artifacts/sonar-angular-shard-equivalence.json artifacts/sonar-angular-inputs/receipt.json
          cmp -- artifacts/sonar-angular-shard-equivalence.json artifacts/sonar-angular-inputs/receipt.json

      - name: Bind Angular coverage handoff to exact execution
        id: handoff
        shell: bash
        env:
          SONAR_ANALYSIS_KIND: ${{ needs.target.outputs.analysis_kind }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$SONAR_ANALYSIS_KIND" in
            pull_request) reports=(artifacts/sonar-angular-inputs/baseline/lcov.info) ;;
            main) reports=(artifacts/sonar-angular-inputs/shard-1/lcov.info artifacts/sonar-angular-inputs/shard-2/lcov.info) ;;
            *) exit 1 ;;
          esac
          reports+=(artifacts/sonar-angular-inputs/receipt.json)
          test -d artifacts/sonar-angular-inputs
          test ! -L artifacts/sonar-angular-inputs
          for report in "${reports[@]}"; do
            test -s "$report"
            test ! -L "$report"
            test ! -L "$(dirname "$report")"
          done
          actual="$(find artifacts/sonar-angular-inputs ! -type d -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${reports[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$SONAR_ANALYSIS_KIND"
              sha256sum -- "${reports[@]}"
            } | sha256sum | cut -d ' ' -f1
          )"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload Angular scanner inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-angular-handoff-${{ github.run_attempt }}
          path: artifacts/sonar-angular-inputs/
          if-no-files-found: error
          retention-days: 7

  dotnet-shard-coverage:
    name: Scanner-compatible native Ubuntu shard qualification without analysis credentials
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    permissions:
      contents: read
    uses: ./.github/workflows/sonar-dotnet-shard-proof.yml
    with:
      source_sha: ${{ github.sha }}

  sonarcloud:
    name: SonarQube Cloud / .NET and multi-language analysis
    permissions:
      contents: read
    needs: [target, windows-dotnet, python-coverage, javascript-coverage, angular-coverage, dotnet-shard-coverage]
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    environment: sonarcloud-analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328 # PostgreSQL 18.7
        env:
          POSTGRES_DB: coglatas_ci
          POSTGRES_USER: coglatas_ci
          POSTGRES_PASSWORD: coglatas_ci_password
          POSTGRES_INITDB_ARGS: >-
            --set=log_error_verbosity=terse
            --set=log_min_error_statement=panic
            --set=log_parameter_max_length=0
            --set=log_parameter_max_length_on_error=0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coglatas_ci -d coglatas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Test
      COGLATAS_TEST_USE_MIGRATED_TEMPLATE: "true"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SONAR_ANALYSIS_KIND: ${{ needs.target.outputs.analysis_kind }}
      SONAR_PR_NUMBER: ${{ needs.target.outputs.pr_number }}
      SONAR_PR_BRANCH: ${{ needs.target.outputs.pr_branch }}
      SONAR_PR_BASE: ${{ needs.target.outputs.pr_base }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download native Windows coverage from this exact workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-windows-dotnet-coverage
          path: artifacts/sonar-windows

      - name: Independently verify Windows bytes before analysis credentials
        run: >-
          python3 -B scripts/ci/verify-sonar-windows-coverage.py consume
          --folder artifacts/sonar-windows --git /usr/bin/git
          --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Install pinned SonarScanner for .NET
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/sonar-tools" \
            --version 12.0.0

      - name: Restore the solution without analysis credentials
        run: dotnet restore Coglatas.slnx --verbosity minimal

      - name: Restore repository-pinned EF tooling without analysis credentials
        run: dotnet tool restore

      - name: Verify PostgreSQL diagnostic privacy
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -B scripts/ci/verify-postgres-log-privacy.py --container "$POSTGRES_CONTAINER"

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install existing reporter dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Download Python scanner inputs from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-python-handoff-${{ github.run_attempt }}
          path: artifacts

      - name: Verify Python coverage handoff before scanner credentials
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.python-coverage.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for report in artifacts/sonar-python/coverage.xml artifacts/sonar-gcp/coverage.xml artifacts/sonar-python/receipt.json; do
            test -s "$report"
            test ! -L "$report"
          done
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE"
              sha256sum -- artifacts/sonar-python/coverage.xml artifacts/sonar-gcp/coverage.xml artifacts/sonar-python/receipt.json
            } | sha256sum | cut -d ' ' -f1
          )"
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ && "$digest" == "$EXPECTED_DIGEST" ]] || {
            echo "::error::Coverage handoff identity or bytes differ from producer."
            exit 1
          }

      - name: Download JavaScript scanner inputs from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-javascript-handoff-${{ github.run_attempt }}
          path: artifacts

      - name: Verify JavaScript coverage handoff before scanner credentials
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.javascript-coverage.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for report in artifacts/sonar-node/lcov.info artifacts/sonar-pilot-helper/lcov.info artifacts/sonar-operational/c8/lcov.info; do
            test -s "$report"
            test ! -L "$report"
          done
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE"
              sha256sum -- artifacts/sonar-node/lcov.info artifacts/sonar-pilot-helper/lcov.info artifacts/sonar-operational/c8/lcov.info
            } | sha256sum | cut -d ' ' -f1
          )"
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ && "$digest" == "$EXPECTED_DIGEST" ]] || {
            echo "::error::Coverage handoff identity or bytes differ from producer."
            exit 1
          }

      - name: Download Angular scanner inputs from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-angular-handoff-${{ github.run_attempt }}
          path: artifacts/sonar-angular-inputs

      - name: Verify Angular coverage handoff before scanner credentials
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.angular-coverage.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$SONAR_ANALYSIS_KIND" in
            pull_request) reports=(artifacts/sonar-angular-inputs/baseline/lcov.info) ;;
            main) reports=(artifacts/sonar-angular-inputs/shard-1/lcov.info artifacts/sonar-angular-inputs/shard-2/lcov.info) ;;
            *) exit 1 ;;
          esac
          reports+=(artifacts/sonar-angular-inputs/receipt.json)
          test -d artifacts/sonar-angular-inputs
          test ! -L artifacts/sonar-angular-inputs
          for report in "${reports[@]}"; do
            test -s "$report"
            test ! -L "$report"
            test ! -L "$(dirname "$report")"
          done
          actual="$(find artifacts/sonar-angular-inputs ! -type d -print | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${reports[@]}" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          digest="$(
            {
              printf '%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE" "$SONAR_ANALYSIS_KIND"
              sha256sum -- "${reports[@]}"
            } | sha256sum | cut -d ' ' -f1
          )"
          [[ "$EXPECTED_DIGEST" =~ ^[0-9a-f]{64}$ && "$digest" == "$EXPECTED_DIGEST" ]] || {
            echo "::error::Coverage handoff identity or bytes differ from producer."
            exit 1
          }

      - name: Download exact-attempt native Ubuntu shard handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-dotnet-shard-handoff-${{ github.run_attempt }}
          path: artifacts/sonar-dotnet-shard-inputs

      - name: Download same-attempt diagnostic compiler evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-openapi-native-identity-${{ github.run_attempt }}
          path: artifacts/sonar-openapi-reproduction

      - name: Verify native Ubuntu shard and compiler handoffs before scanner credentials
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DOTNET_SHARD_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.digest }}
          EXPECTED_RECEIPT_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.compiler_digest }}
        run: python3 -B scripts/ci/verify-sonar-dotnet-coverage.py shard-verify-compiler

      - name: Verify diagnostic bytes and prepare read-only compiler input observer
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_RECEIPT_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.compiler_digest }}
        run: python3 -B scripts/ci/verify-sonar-scanner-identity-trial.py prepare

      - name: Begin pinned SonarCloud analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is missing. Configure it before enabling CI-based analysis."
            exit 1
          fi

          # The .NET scanner does not automatically read .sonarcloud.properties.
          # Import only the four reviewed scope keys, including the narrow
          # CI-test-only coverage exclusion. Never load credentials, arbitrary
          # scanner settings, a different host or executable shell code.
          scope_args=()
          while IFS='=' read -r key value || [[ -n "$key" ]]; do
            case "$key" in
              sonar.sourceEncoding|sonar.exclusions|sonar.cpd.exclusions|sonar.coverage.exclusions)
                [[ -n "$value" ]] || { echo "::error::Empty Sonar scope setting: $key"; exit 1; }
                scope_args+=("/d:$key=$value")
                ;;
            esac
          done < .sonarcloud.properties

          if [[ -z "$SONAR_PROJECT_KEY" || -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error::SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables are required."
            exit 1
          fi

          case "$SONAR_ANALYSIS_KIND" in
            pull_request) angular_reports=artifacts/sonar-angular-inputs/baseline/lcov.info ;;
            main) angular_reports=artifacts/sonar-angular-inputs/shard-1/lcov.info,artifacts/sonar-angular-inputs/shard-2/lcov.info ;;
            *) exit 1 ;;
          esac
          scanner_args=(
            begin
            "/k:$SONAR_PROJECT_KEY"
            "/o:$SONAR_ORGANIZATION"
            /d:sonar.host.url=https://sonarcloud.io
            /d:sonar.scanner.scanAll=true
            "/d:sonar.javascript.lcov.reportPaths=$angular_reports,artifacts/sonar-node/lcov.info,artifacts/sonar-pilot-helper/lcov.info,artifacts/sonar-operational/c8/lcov.info"
            "/d:sonar.cs.opencover.reportsPaths=artifacts/sonar-dotnet-shard-inputs/files-db/verified.opencover.xml,artifacts/sonar-dotnet-shard-inputs/other-db/verified.opencover.xml,artifacts/sonar-dotnet-shard-inputs/security-aq/verified.opencover.xml,artifacts/sonar-dotnet-shard-inputs/remaining/verified.opencover.xml"
            /d:sonar.cs.cobertura.reportsPaths=artifacts/sonar-windows/verified.cobertura.xml
            "/d:sonar.python.coverage.reportPaths=artifacts/sonar-python/coverage.xml,artifacts/sonar-gcp/coverage.xml"
            "${scope_args[@]}"
          )

          if [[ "$SONAR_ANALYSIS_KIND" == "pull_request" ]]; then
            [[ "$SONAR_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Missing or invalid verified PR number."
              exit 1
            }
            scanner_args+=(
              "/d:sonar.pullrequest.key=$SONAR_PR_NUMBER"
              "/d:sonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "/d:sonar.pullrequest.base=$SONAR_PR_BASE"
            )
          elif [[ "$SONAR_ANALYSIS_KIND" != "main" ]]; then
            echo "::error::Unsupported analysis kind."
            exit 1
          fi

          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" \
            "${scanner_args[@]}" "/d:sonar.token=$SONAR_TOKEN"

      - name: Build inside the SonarScanner begin/end interval
        run: >-
          dotnet build Coglatas.slnx --configuration Release --no-restore --disable-build-servers -m
          -p:ContinuousIntegrationBuild=true -p:DeterministicSourcePaths=true
          -p:EmitCompilerGeneratedFiles=true
          -p:CustomAfterMicrosoftCommonTargets="$RUNNER_TEMP/sonar-scanner-input-observer/observer.targets"

      - name: Compare actual scanner build with credential-free diagnostic build
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_RECEIPT_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.compiler_digest }}
        run: python3 -B scripts/ci/verify-sonar-scanner-identity-trial.py compare

      - name: Retain only sanitized scanner identity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-scanner-identity-result-${{ github.run_attempt }}
          path: artifacts/sonar-scanner-identity-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain original deterministic production source mapping
        run: |
          set -euo pipefail
          mapping=tests/Coglatas.Tests/bin/Release/net11.0/CoverletSourceRootsMapping_Coglatas.Tests
          test -s "$mapping"
          mkdir -p artifacts/sonar-dotnet
          cp "$mapping" artifacts/sonar-dotnet/deterministic-source-roots.original
          sha256sum artifacts/sonar-dotnet/deterministic-source-roots.original
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_binaries', 'scripts/ci/verify-sonar-windows-coverage.py')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          folder = Path('artifacts/sonar-dotnet/pre-test-rebuild')
          folder.mkdir()
          record = {'sourceSha': os.environ['GITHUB_SHA'],
                    'artifacts': verifier.assemblies(verifier.ROOT, folder, os.environ['GITHUB_SHA'], True)}
          (folder / 'outputs.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Preserve physical caller source paths in the test assembly
        # Recorders hash the actual caller source; production binaries retain
        # their deterministic paths and are not rebuilt by this project build.
        run: >-
          dotnet build tests/Coglatas.Tests/Coglatas.Tests.csproj
          --configuration Release --no-restore --no-incremental --no-dependencies
          --disable-build-servers -m:1
          -p:ContinuousIntegrationBuild=false -p:DeterministicSourcePaths=false

      - name: Restore original production mapping for native instrumentation
        # The test-only build regenerates reference maps with physical paths.
        # Production PDBs still use the original deterministic paths. Restore
        # their unmodified build metadata, never edit collected report paths.
        run: |
          set -euo pipefail
          mapping=tests/Coglatas.Tests/bin/Release/net11.0/CoverletSourceRootsMapping_Coglatas.Tests
          cp "$mapping" artifacts/sonar-dotnet/physical-test-source-roots.original
          cp artifacts/sonar-dotnet/deterministic-source-roots.original "$mapping"
          cmp artifacts/sonar-dotnet/deterministic-source-roots.original "$mapping"

      - name: Apply migrations to the isolated coverage database
        if: env.SONAR_ANALYSIS_KIND == 'main'
        run: dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web --configuration Release --no-build

      - name: Generate .NET coverage without analysis credentials
        if: env.SONAR_ANALYSIS_KIND == 'main'
        run: >-
          dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers -m:1
          --collect "XPlat Code Coverage;Format=opencover"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory artifacts/sonar-dotnet

      - name: Record actual collector report layout
        if: always() && env.SONAR_ANALYSIS_KIND == 'main'
        shell: bash
        run: |
          if [[ -d artifacts/sonar-dotnet ]]; then
            find artifacts/sonar-dotnet -maxdepth 3 -name coverage.opencover.xml -printf '%P %s bytes\n'
          fi

      - name: Verify executed tests and production coverage before publication
        if: env.SONAR_ANALYSIS_KIND == 'main'
        run: |
          set -euo pipefail
          cmp artifacts/sonar-dotnet/deterministic-source-roots.original \
            tests/Coglatas.Tests/bin/Release/net11.0/CoverletSourceRootsMapping_Coglatas.Tests
          bash scripts/ci/verify-trx-results.sh artifacts/sonar-dotnet/backend-tests.trx \
            --minimum-total 1 --label "Sonar .NET coverage suite"
          python3 scripts/ci/verify-sonar-dotnet-coverage.py
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('native_binaries', 'scripts/ci/verify-sonar-windows-coverage.py')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          folder = Path('artifacts/sonar-dotnet')
          before = json.loads((folder / 'pre-test-rebuild/outputs.json').read_bytes())
          if before['sourceSha'] != os.environ['GITHUB_SHA']:
              raise ValueError('Pre-rebuild source revision differs')
          executed = folder / 'executed-binaries'
          executed.mkdir()
          after = verifier.assemblies(verifier.ROOT, executed, os.environ['GITHUB_SHA'], True)
          for name, digest in before['artifacts'].items():
              if name not in ('assemblies/Coglatas.Tests.dll', 'assemblies/Coglatas.Tests.pdb') and after[name] != digest:
                  raise ValueError('Test-only rebuild or collection changed a production binary')
          record = {'sourceSha': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'executedArtifacts': after,
                    'trxSha256': verifier.digest((folder / 'backend-tests.trx').read_bytes()),
                    'sourceMappingSha256': verifier.digest((folder / 'deterministic-source-roots.original').read_bytes()),
                    'productionBinariesUnchanged': True}
          (folder / 'binary-provenance.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Retain .NET coverage and source receipt
        if: always() && env.SONAR_ANALYSIS_KIND == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-dotnet-coverage
          path: |
            artifacts/sonar-dotnet/**/coverage.opencover.xml
            artifacts/sonar-dotnet/verified.opencover.xml
            artifacts/sonar-dotnet/receipt.json
            artifacts/sonar-dotnet/*-source-roots.original
            artifacts/sonar-dotnet/backend-tests.trx
            artifacts/sonar-dotnet/binary-provenance.json
            artifacts/sonar-dotnet/pre-test-rebuild/
            artifacts/sonar-dotnet/executed-binaries/
          if-no-files-found: error
          retention-days: 7

      - name: Require actual scanner baseline and all shard binaries and points to agree
        if: env.SONAR_ANALYSIS_KIND == 'main'
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DOTNET_SHARD_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.digest }}
        run: python3 -B scripts/ci/verify-sonar-dotnet-coverage.py shard-admit

      - name: Require rebuilt scanner identity and original independent full-baseline equivalence
        if: env.SONAR_ANALYSIS_KIND == 'pull_request'
        env:
          PROOF_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_DOTNET_SHARD_DIGEST: ${{ needs.dotnet-shard-coverage.outputs.digest }}
        run: python3 -B scripts/ci/verify-sonar-dotnet-coverage.py shard-admit-rebuilt

      - name: Retain actual scanner rebuild and mapping evidence
        if: always() && env.SONAR_ANALYSIS_KIND == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-dotnet-scanner-rebuild-evidence
          path: |
            artifacts/sonar-dotnet/*-source-roots.original
            artifacts/sonar-dotnet/pre-test-rebuild/
          if-no-files-found: error
          retention-days: 7

      - name: Retain actual scanner native admission receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-dotnet-scanner-admission-${{ github.run_attempt }}
          path: artifacts/sonar-dotnet-scanner-admission.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish SonarCloud report
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SONAR_TOKEN" ]] || { echo "::error::SONAR_TOKEN is missing."; exit 1; }
          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" end "/d:sonar.token=$SONAR_TOKEN"
