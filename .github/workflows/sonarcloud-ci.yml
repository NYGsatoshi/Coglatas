name: SonarQube Cloud CI-based analysis

# The repository policy forbids secrets in pull_request workflows. Scan only
# pushes in the base repository, resolving same-repository PR metadata via the
# read-only GitHub API. External fork heads are never executed with SONAR_TOKEN.
on:
  push:
    branches: ["**"]

concurrency:
  group: sonarcloud-ci-${{ github.ref }}
  cancel-in-progress: true

# Explicitly deny workflow-wide grants; each job grants its own minimum scope.
permissions: {}

jobs:
  target:
    name: Resolve trusted analysis target
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_scan: ${{ steps.resolve.outputs.should_scan }}
      analysis_kind: ${{ steps.resolve.outputs.analysis_kind }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
      pr_base: ${{ steps.resolve.outputs.pr_base }}
    steps:
      - name: Resolve main or exact same-repository PR
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_ACTOR: ${{ github.actor }}
          PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          ORGANIZATION_KEY: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_REPOSITORY" != "NYGsatoshi/Coglatas" ]]; then
            echo "::error::Unexpected repository identity."
            exit 1
          fi

          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ -z "${PROJECT_KEY:-}" || -z "${ORGANIZATION_KEY:-}" ]]; then
              echo "::error::Configure SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
              exit 1
            fi
            {
              echo "should_scan=true"
              echo "analysis_kind=main"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub Apps (including dependency-update bots) can push to branches
          # in the upstream repository. Such push access does not mean the
          # branch's dependencies or build code are safe to execute with a
          # SonarCloud token. Limit PR analysis to pushes by the repo owner.
          if [[ "$TARGET_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "Non-owner branch push: skipping token-backed Sonar analysis."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A push to the upstream repository is not a pull_request event.
          # Confirm the PR head repository, branch, exact SHA and target base
          # against the authoritative API; never accept caller-supplied PR IDs.
          pulls="$(gh api --method GET "/repos/$TARGET_REPOSITORY/pulls" \
            -f state=open -f base=main \
            -f "head=$GITHUB_REPOSITORY_OWNER:$TARGET_BRANCH" -f per_page=100)"

          eligible="$(jq -c \
            --arg repo "$TARGET_REPOSITORY" \
            --arg branch "$TARGET_BRANCH" \
            --arg sha "$TARGET_SHA" \
            '[.[] | select(
                .state == "open" and
                .base.ref == "main" and
                .base.repo.full_name == $repo and
                .head.repo.full_name == $repo and
                .head.ref == $branch and
                .head.sha == $sha
              )]' <<< "$pulls")"

          count="$(jq 'length' <<< "$eligible")"
          if [[ "$count" -gt 1 ]]; then
            echo "::error::Ambiguous pull request identity; refusing token-backed analysis."
            exit 1
          fi
          if [[ "$count" -eq 0 ]]; then
            echo "No matching open same-repository PR at the pushed SHA; skipping Sonar analysis."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${PROJECT_KEY:-}" || -z "${ORGANIZATION_KEY:-}" ]]; then
            echo "::error::Configure SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "$eligible")"
          pr_branch="$(jq -r '.[0].head.ref' <<< "$eligible")"
          {
            echo "should_scan=true"
            echo "analysis_kind=pull_request"
            echo "pr_number=$pr_number"
            echo "pr_branch=$pr_branch"
            echo "pr_base=main"
          } >> "$GITHUB_OUTPUT"

  sonarcloud:
    name: SonarQube Cloud / .NET and multi-language analysis
    permissions:
      contents: read
    needs: target
    if: needs.target.outputs.should_scan == 'true' && github.repository == 'NYGsatoshi/Coglatas'
    environment: sonarcloud-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4 # PostgreSQL 18.6
        env:
          POSTGRES_DB: coglatas_ci
          POSTGRES_USER: coglatas_ci
          POSTGRES_PASSWORD: coglatas_ci_password
          POSTGRES_INITDB_ARGS: >-
            --set=log_error_verbosity=terse
            --set=log_min_error_statement=panic
            --set=log_parameter_max_length=0
            --set=log_parameter_max_length_on_error=0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coglatas_ci -d coglatas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Test
      COGLATAS_TEST_USE_MIGRATED_TEMPLATE: "true"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SONAR_ANALYSIS_KIND: ${{ needs.target.outputs.analysis_kind }}
      SONAR_PR_NUMBER: ${{ needs.target.outputs.pr_number }}
      SONAR_PR_BRANCH: ${{ needs.target.outputs.pr_branch }}
      SONAR_PR_BASE: ${{ needs.target.outputs.pr_base }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout exact trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install pinned SonarScanner for .NET
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install dotnet-sonarscanner \
            --tool-path "$RUNNER_TEMP/sonar-tools" \
            --version 12.0.0

      - name: Restore the solution without analysis credentials
        run: dotnet restore Coglatas.slnx --verbosity minimal

      - name: Restore repository-pinned EF tooling without analysis credentials
        run: dotnet tool restore

      - name: Verify PostgreSQL diagnostic privacy
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -B scripts/ci/verify-postgres-log-privacy.py --container "$POSTGRES_CONTAINER"

      - name: Install checksum-pinned Python coverage tool without analysis credentials
        run: >-
          python3 -m pip install --disable-pip-version-check --no-deps --require-hashes
          --target "$RUNNER_TEMP/sonar-coverage-tools"
          -r scripts/ci/sonar-coverage-requirements.txt

      - name: Measure existing CI regression controls without analysis credentials
        env:
          PYTHONPATH: ${{ runner.temp }}/sonar-coverage-tools
          COVERAGE_FILE: ${{ runner.temp }}/sonar-python.coverage
          COVERAGE_CORE: pytrace
        run: |
          set -euo pipefail
          export SONAR_PYTHON_SOURCE_ROOT="$PWD"
          export COVERAGE_RCFILE="$PWD/scripts/ci/sonar-python.coveragerc"
          python3 -B -m coverage erase
          for control in \
            scripts/ci/test-sonar-python-process-coverage.py \
            scripts/ci/test-sonar-dotnet-coverage.py \
            tests/ci/test_security_finding_policy.py \
            tests/ci/test_sec04_deep_ci.py \
            scripts/ci/test_sec17_deep_execution.py \
            scripts/ci/test_sec17_file_policy_execution.py \
            scripts/ci/test-mbj02-trx-receipt.py \
            scripts/ci/test-workspace-icon-disclosure-policy.py \
            scripts/ci/test-main-runtime-artifact.py \
            deploy/sakura/test_validate_pilot_intake_policy.py \
            tests/ci/test_release_image_graph.py \
            scripts/ci/test-functional-diagnostics.py \
            scripts/ci/test-postgres-log-privacy.py \
            scripts/ci/test-functional-setup-failure-probe.py \
            tests/ci/test_security_zap_attribution.py \
            tests/ci/test_performance_db_ci.py; do
            COVERAGE_PROCESS_START="$COVERAGE_RCFILE" \
              PYTHONPATH="$PWD/scripts/ci/sonar-python-coverage-bootstrap:$PYTHONPATH" \
              python3 -B -m coverage run "$control"
          done
          python3 -B -m coverage combine
          python3 -B -m coverage xml -o artifacts/sonar-python/coverage.xml

      - name: Measure GCP loopback controls separately before analysis credentials
        env:
          PYTHONPATH: ${{ runner.temp }}/sonar-coverage-tools
          COVERAGE_FILE: ${{ runner.temp }}/sonar-gcp.coverage
          COVERAGE_CORE: pytrace
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-gcp
          python3 -B -m coverage run --rcfile= --branch --source=deploy/gcp tests/ci/test_gcp_loopback.py
          python3 -B -m coverage xml --rcfile= -o artifacts/sonar-gcp/coverage.xml
          python3 -B - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path.cwd().resolve()
          expected = root / 'deploy/gcp/verify-loopback.py'
          document = ET.parse('artifacts/sonar-gcp/coverage.xml')
          sources = [Path(node.text).resolve() for node in document.findall('./sources/source')]
          classes = document.findall('.//class')
          assert len(classes) == 1
          assert expected in {(source / classes[0].attrib['filename']).resolve() for source in sources}
          rows = classes[0].findall('./lines/line')
          lines = [int(row.attrib['number']) for row in rows]
          assert len(lines) == len(set(lines)) and lines
          assert all(0 < line <= len(expected.read_text(encoding='utf-8').splitlines()) for line in lines)
          assert all(int(row.attrib['hits']) >= 0 for row in rows)
          baseline = ET.parse('artifacts/sonar-python/coverage.xml')
          old_sources = [Path(node.text).resolve() for node in baseline.findall('./sources/source')]
          assert all(expected not in {(source / node.attrib['filename']).resolve() for source in old_sources}
                     for node in baseline.findall('.//class'))
          print('Original GCP guard coverage source verified; existing Python cohort remains disjoint.')
          PY

      - name: Retain original GCP loopback coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-gcp-loopback-coverage
          path: artifacts/sonar-gcp/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install existing reporter dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install pinned headless Chromium for existing Group entry controls
        run: node node_modules/@playwright/test/cli.js install --with-deps --only-shell chromium

      - name: Measure existing Functional and roster Node controls before credentials
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/sonar-node/raw
        run: |
          mkdir -p artifacts/sonar-node
          coverage_temp_root="$(node -p 'require("node:os").tmpdir()')"
          node --enable-source-maps --test --experimental-test-coverage \
            --test-coverage-exclude='**/*.node-test.mjs' \
            --test-coverage-exclude='**/tests/ci/test_restore_data_dependency_advisor.mjs' \
            --test-coverage-exclude="$coverage_temp_root/thread-secondary-reporter-*/**" \
            --test-coverage-exclude="$coverage_temp_root/coglatas-thread-matrix-*/**" \
            --test-coverage-exclude="$coverage_temp_root/group-keyboard-control-*/**" \
            --test-coverage-exclude="$coverage_temp_root/search-drawer-control-*/**" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-node/lcov.info \
            tests/functional/build-functional-grep.node-test.mjs \
            tests/functional/functional-diagnostics.node-test.mjs \
            tests/functional/messaging-observation.node-test.mjs \
            tests/functional/thread-initial-observation.node-test.mjs \
            tests/functional/thread-probe-observation.node-test.mjs \
            tests/functional/private-playwright-output.node-test.mjs \
            tests/ui/readonly-roster-runner.node-test.mjs \
            tests/ui/mobile-mvp0-profile.node-test.mjs \
            tests/ui/mobile-mvp0-runner.node-test.mjs \
            tests/diagnostics/thread-matrix.node-test.mjs \
            tests/ui/group-keyboard-observation.node-test.mjs \
            tests/ui/search-drawer-observation.node-test.mjs \
            tests/ui/group-entry-coverage.node-test.mjs \
            tests/ci/test_restore_data_dependency_advisor.mjs \
            tests/ui/channel-dialog-serializer-coverage.node-test.mjs \
            scripts/ci/verify-sonar-node-coverage.node-test.mjs
          test -s artifacts/sonar-node/lcov.info
          node scripts/ci/verify-sonar-node-coverage.mjs artifacts/sonar-node/lcov.info

      - name: Retain measured Node regression coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-node-coverage
          path: artifacts/sonar-node/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Qualify existing private output CLI imports without coverage
        run: |
          test "$(/usr/bin/id -u)" -ne 0
          unset NODE_V8_COVERAGE NODE_OPTIONS
          node --test tests/functional/private-playwright-output-import.node-test.mjs

      - name: Retain original Functional and roster raw V8 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-node-raw-v8
          path: artifacts/sonar-node/raw/
          if-no-files-found: error
          retention-days: 7

      - name: Measure existing Pilot helpers in a separate native cohort
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-pilot-helper
          node --test --experimental-test-coverage --test-concurrency=1 \
            --test-coverage-include='tests/ui/public-https-golden-path-helpers.mjs' \
            --test-coverage-include='tests/ui/student-council-pilot-helpers.mjs' \
            --test-coverage-include='tests/ui/student-council-pilot-run.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-pilot-helper/lcov.info \
            tests/ui/student-council-pilot-helpers.node-test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { realpathSync } from 'node:fs';
          import { relative, resolve } from 'node:path';
          import { readOwnedRepositoryText, validateNodeCoverage } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd());
          const identity = source => relative(root, resolve(root, source)).replaceAll('\\', '/');
          const text = readOwnedRepositoryText(root, 'artifacts/sonar-pilot-helper/lcov.info');
          assert.ok(Buffer.byteLength(text) <= 1024 * 1024);
          const checked = validateNodeCoverage(text);
          const sources = new Set(text.split(/\r?\n/).filter(row => row.startsWith('SF:')).map(row => identity(row.slice(3))));
          assert.equal(checked.sourceFiles, 3); assert.equal(sources.size, 3);
          for (const source of ['tests/ui/public-https-golden-path-helpers.mjs', 'tests/ui/student-council-pilot-helpers.mjs', 'tests/ui/student-council-pilot-run.mjs']) assert.ok(sources.has(source));
          const baseline = readOwnedRepositoryText(root, 'artifacts/sonar-node/lcov.info');
          validateNodeCoverage(baseline);
          for (const row of baseline.split(/\r?\n/).filter(row => row.startsWith('SF:'))) assert.ok(!sources.has(identity(row.slice(3))), 'Native source reports must be disjoint.');
          console.log('Pilot helper native source scope verified: ' + JSON.stringify(checked));
          JS

      - name: Retain original Pilot helper native coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-pilot-helper-coverage
          path: artifacts/sonar-pilot-helper/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Measure existing source inventory and npm audit controls before credentials
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/artifacts/sonar-operational/raw
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonar-operational
          node --enable-source-maps --test --experimental-test-coverage --test-concurrency=1 \
            --test-coverage-include='frontend/scripts/check-av-mig-source.mjs' \
            --test-coverage-include='scripts/ci/check-npm-audit-baseline.mjs' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/sonar-operational/lcov.info \
            frontend/scripts/av-mig-source.node-test.mjs \
            scripts/ci/check-npm-audit-baseline.node-test.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { realpathSync } from 'node:fs';
          import { relative, resolve } from 'node:path';
          import { readOwnedRepositoryText, validateNodeCoverage } from './scripts/ci/verify-sonar-node-coverage.mjs';
          const root = realpathSync(process.cwd());
          const identity = source => relative(root, resolve(root, source)).replaceAll('\\', '/');
          const text = readOwnedRepositoryText(root, 'artifacts/sonar-operational/lcov.info');
          assert.ok(Buffer.byteLength(text) <= 1024 * 1024);
          const checked = validateNodeCoverage(text);
          const sources = new Set(text.split(/\r?\n/).filter(row => row.startsWith('SF:')).map(row => identity(row.slice(3))));
          assert.equal(checked.sourceFiles, 2); assert.equal(sources.size, 2);
          for (const source of ['frontend/scripts/check-av-mig-source.mjs', 'scripts/ci/check-npm-audit-baseline.mjs']) assert.ok(sources.has(source));
          for (const report of ['artifacts/sonar-node/lcov.info', 'artifacts/sonar-pilot-helper/lcov.info']) {
            const existing = readOwnedRepositoryText(root, report);
            validateNodeCoverage(existing);
            for (const row of existing.split(/\r?\n/).filter(row => row.startsWith('SF:'))) assert.ok(!sources.has(identity(row.slice(3))), 'Native source reports must be disjoint.');
          }
          console.log('Operational native source scope verified: ' + JSON.stringify(checked));
          JS

      - name: Retain original operational native coverage and ranges
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-operational-coverage
          path: artifacts/sonar-operational/
          if-no-files-found: error
          retention-days: 7

      - name: Generate frontend coverage before scanner credentials
        run: |
          npm --prefix frontend run test:coverage
          test -s frontend/coverage/frontend/lcov.info

      - name: Begin pinned SonarCloud analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is missing. Configure it before enabling CI-based analysis."
            exit 1
          fi

          # The .NET scanner does not automatically read .sonarcloud.properties.
          # Import only the four reviewed scope keys, including the narrow
          # CI-test-only coverage exclusion. Never load credentials, arbitrary
          # scanner settings, a different host or executable shell code.
          scope_args=()
          while IFS='=' read -r key value || [[ -n "$key" ]]; do
            case "$key" in
              sonar.sourceEncoding|sonar.exclusions|sonar.cpd.exclusions|sonar.coverage.exclusions)
                [[ -n "$value" ]] || { echo "::error::Empty Sonar scope setting: $key"; exit 1; }
                scope_args+=("/d:$key=$value")
                ;;
            esac
          done < .sonarcloud.properties

          if [[ -z "$SONAR_PROJECT_KEY" || -z "$SONAR_ORGANIZATION" ]]; then
            echo "::error::SONAR_PROJECT_KEY and SONAR_ORGANIZATION repository variables are required."
            exit 1
          fi

          scanner_args=(
            begin
            "/k:$SONAR_PROJECT_KEY"
            "/o:$SONAR_ORGANIZATION"
            /d:sonar.host.url=https://sonarcloud.io
            /d:sonar.scanner.scanAll=true
            "/d:sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info,artifacts/sonar-node/lcov.info,artifacts/sonar-pilot-helper/lcov.info"
            /d:sonar.cs.opencover.reportsPaths=artifacts/sonar-dotnet/verified.opencover.xml
            /d:sonar.python.coverage.reportPaths=artifacts/sonar-python/coverage.xml,artifacts/sonar-gcp/coverage.xml
            "${scope_args[@]}"
          )

          if [[ "$SONAR_ANALYSIS_KIND" == "pull_request" ]]; then
            [[ "$SONAR_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "::error::Missing or invalid verified PR number."
              exit 1
            }
            scanner_args+=(
              "/d:sonar.pullrequest.key=$SONAR_PR_NUMBER"
              "/d:sonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "/d:sonar.pullrequest.base=$SONAR_PR_BASE"
            )
          elif [[ "$SONAR_ANALYSIS_KIND" != "main" ]]; then
            echo "::error::Unsupported analysis kind."
            exit 1
          fi

          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" \
            "${scanner_args[@]}" "/d:sonar.token=$SONAR_TOKEN"

      - name: Build inside the SonarScanner begin/end interval
        run: dotnet build Coglatas.slnx --configuration Release --no-restore --disable-build-servers -m

      - name: Apply migrations to the isolated coverage database
        run: dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web --configuration Release --no-build

      - name: Generate .NET coverage without analysis credentials
        run: >-
          dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers -m:1
          --collect "XPlat Code Coverage;Format=opencover"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory artifacts/sonar-dotnet

      - name: Record actual collector report layout
        if: always()
        shell: bash
        run: |
          if [[ -d artifacts/sonar-dotnet ]]; then
            find artifacts/sonar-dotnet -maxdepth 3 -name coverage.opencover.xml -printf '%P %s bytes\n'
          fi

      - name: Verify executed tests and production coverage before publication
        run: |
          bash scripts/ci/verify-trx-results.sh artifacts/sonar-dotnet/backend-tests.trx \
            --minimum-total 1 --label "Sonar .NET coverage suite"
          python3 scripts/ci/verify-sonar-dotnet-coverage.py

      - name: Retain .NET coverage and source receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-dotnet-coverage
          path: |
            artifacts/sonar-dotnet/**/coverage.opencover.xml
            artifacts/sonar-dotnet/verified.opencover.xml
            artifacts/sonar-dotnet/receipt.json
            artifacts/sonar-python/coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Publish SonarCloud report
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SONAR_TOKEN" ]] || { echo "::error::SONAR_TOKEN is missing."; exit 1; }
          "$RUNNER_TEMP/sonar-tools/dotnet-sonarscanner" end "/d:sonar.token=$SONAR_TOKEN"
