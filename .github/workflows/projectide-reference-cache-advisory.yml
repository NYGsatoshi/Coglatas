          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy missing' }
          $context = Join-Path $env:RUNNER_TEMP 'reference-cache-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
