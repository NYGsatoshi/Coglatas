            '--product-head', $env:PRODUCT_HEAD,
            '--worktree', "$env:RUNNER_TEMP/reference-cache-qualification-product",
            '--evidence', "$env:RUNNER_TEMP/reference-cache-qualification-evidence")
          if ('${{ matrix.mode }}' -eq 'historical-red') { $candidateArguments += '--historical' }
          python @candidateArguments
          if ($LASTEXITCODE -ne 0) { throw 'Reference cache original native qualification did not complete' }
      - name: Retain original source, native outcomes and identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-cache-${{ matrix.mode }}-windows-latest-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-cache-qualification-context
            ${{ runner.temp }}/reference-cache-qualification-evidence
          if-no-files-found: error
          retention-days: 7
