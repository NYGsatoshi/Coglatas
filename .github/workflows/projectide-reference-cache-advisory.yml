name: ProjectIDE reference cache native RED GREEN advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-reference-cache-advisory.yml
      - tests/candidates/projectide-reference-cache/**

permissions:
  contents: read

env:
  SOURCE_BLOB: c43f357d8387be13c1ab3106193277c8455c653c
  RUNNER_BLOB: d7d3e26d3f32b23ac822f172be197dffdc246f06
  CONTROLS_BLOB: 473773cc8fe88f42b999a2352be647836f80c603

concurrency:
  group: reference-cache-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reference-cache-ubuntu:
    name: Reference cache ${{ matrix.mode }} (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        mode: [corrected, historical-red]
        include:
          - mode: corrected
            product: 71c261b1beabd8f93383ee059aab14d800b4339c
            scope: SYNTHETIC_REFERENCE_CACHE_CORE_ONLY
          - mode: historical-red
            product: ee6ab354c1f9bdcc9d181e4b329954af7f50d852
            scope: SYNTHETIC_REFERENCE_CACHE_HISTORICAL_LIFETIME_ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
      PRODUCT_HEAD: ${{ matrix.product }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve LF source bytes' }
      - name: Checkout immutable independent Security Test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source identities and Product SDK policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $case = git rev-parse 'HEAD:tests/candidates/projectide-reference-cache/SecurityReferenceCacheCandidateTests.cs'
          if ($LASTEXITCODE -ne 0 -or $case -ne $env:SOURCE_BLOB) { throw 'Independent source blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-reference-cache/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Independent runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-reference-cache/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Admission controls blob mismatch' }
          git cat-file -e "$($env:PRODUCT_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Product commit missing' }
          $policy = git show "$($env:PRODUCT_HEAD):global.json"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy missing' }
          $context = Join-Path $env:RUNNER_TEMP 'reference-cache-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
            testHead = $actual
            productHead = $env:PRODUCT_HEAD
            sourceBlob = $case
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            mode = '${{ matrix.mode }}'
            executionScope = '${{ matrix.scope }}'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Install exact Product .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ${{ runner.temp }}/reference-cache-qualification-context/global.json
      - name: Install composition Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Verify positive and rejection admission controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'reference-cache-qualification-context/admission-controls.log'
          python -B -m unittest discover -s tests/candidates/projectide-reference-cache -p test_compose_and_verify.py -v *> $log
          $result = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($result -ne 0) { throw 'Reference cache admission controls failed' }
      - name: Execute original native facts and compiled discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateArguments = @('-B', 'tests/candidates/projectide-reference-cache/compose_and_verify.py',
            '--product-head', $env:PRODUCT_HEAD,
            '--worktree', "$env:RUNNER_TEMP/reference-cache-qualification-product",
            '--evidence', "$env:RUNNER_TEMP/reference-cache-qualification-evidence")
          if ('${{ matrix.mode }}' -eq 'historical-red') { $candidateArguments += '--historical' }
          python @candidateArguments
          if ($LASTEXITCODE -ne 0) { throw 'Reference cache original native qualification did not complete' }
      - name: Retain original source, native outcomes and identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-cache-${{ matrix.mode }}-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reference-cache-qualification-context
            ${{ runner.temp }}/reference-cache-qualification-evidence
          if-no-files-found: error
          retention-days: 7

  reference-cache-windows:
    name: Reference cache ${{ matrix.mode }} (windows-latest)
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
