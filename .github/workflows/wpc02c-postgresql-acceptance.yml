name: WPC-02C PostgreSQL Acceptance

# TEMPORARY CONTEST MODE: this milestone acceptance duplicates the core
# backend build/test path on most code PRs. Keep it available on demand.
on:
  workflow_dispatch:

concurrency:
  group: wpc02c-postgresql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: WPC-02C PostgreSQL / PG18
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coglatas_wpc02c
          POSTGRES_USER: coglatas_wpc02c
          POSTGRES_PASSWORD: coglatas_wpc02c_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U coglatas_wpc02c -d coglatas_wpc02c"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Configure PostgreSQL connection
        shell: bash
        run: |
          postgres_port='${{ job.services.postgres.ports[5432] }}'
          test -n "$postgres_port"
          {
            echo "ConnectionStrings__DefaultConnection=Host=localhost;Port=${postgres_port};Database=coglatas_wpc02c;Username=coglatas_wpc02c;Password=coglatas_wpc02c_password"
            echo "POSTGRES_TEST_CONNECTION_STRING=Host=localhost;Port=${postgres_port};Database=coglatas_wpc02c;Username=coglatas_wpc02c;Password=coglatas_wpc02c_password"
          } >> "$GITHUB_ENV"

      - name: Repair previous Docker workspace ownership
        shell: bash
        run: |
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.21 \
            sh -c "chown -R ${uid}:${gid} /workspace"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure user-local .NET install and NuGet isolation
        shell: bash
        run: |
          install_dir="$HOME/.dotnet-ci"
          job_temp="$RUNNER_TEMP/dotnet-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p \
            "$install_dir" \
            "$job_temp/home" \
            "$job_temp/nuget/scratch" \
            "$HOME/.nuget/packages"
          {
            echo "DOTNET_INSTALL_DIR=$install_dir"
            echo "DOTNET_ROOT=$install_dir"
            echo "DOTNET_MULTILEVEL_LOOKUP=0"
            echo "DOTNET_CLI_HOME=$job_temp/home"
            echo "DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=1"
            echo "NUGET_PACKAGES=$HOME/.nuget/packages"
            echo "NUGET_SCRATCH=$job_temp/nuget/scratch"
          } >> "$GITHUB_ENV"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Coglatas.slnx --disable-parallel --disable-build-servers --verbosity normal

      - name: Build
        run: dotnet build Coglatas.slnx --configuration Release --no-restore --disable-build-servers -m:1

      - name: Run WPC-02C acceptance
        shell: bash
        run: |
          mkdir -p artifacts/wpc02c-test-results
          dotnet test \
            tests/Coglatas.Tests/Coglatas.Tests.csproj \
            --configuration Release \
            --no-build \
            --disable-build-servers \
            -m:1 \
            --verbosity normal \
            --filter "Scope=WPC02C" \
            --logger "trx;LogFileName=wpc02c-acceptance.trx" \
            --results-directory artifacts/wpc02c-test-results

      - name: Verify WPC-02C required tests
        shell: bash
        run: |
          bash scripts/ci/verify-trx-results.sh \
            artifacts/wpc02c-test-results/wpc02c-acceptance.trx \
            --minimum-total 15 \
            --required-tests scripts/ci/wpc02c-required-tests.txt \
            --label "WPC-02C PostgreSQL"

      - name: Upload WPC-02C acceptance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wpc02c-postgresql-acceptance-results
          path: artifacts/wpc02c-test-results
          if-no-files-found: warn
          retention-days: 14
