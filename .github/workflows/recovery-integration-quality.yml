name: Recovery integration full Qodana

# Credential-free complete inventory before integration. Main keeps its existing
# Community and protected Cloud workflows; no historical result is inherited.
on:
  push:
    branches:
      - 'integration/recovery-qodana-completion-*'
permissions:
  contents: read
concurrency:
  group: recovery-integration-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-qodana:
    if: github.repository == 'NYGsatoshi/Coglatas'
    uses: NYGsatoshi/Coglatas/.github/workflows/qodana_trusted_gate.yml@ffd069e53df4f91b01f9cdc2df48fc347a77a171
