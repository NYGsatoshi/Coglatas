name: Fixed Licensed Workflow State Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/licensed-workflow-state-diagnostic.yml"
      - "scripts/ci/licensed-workflow-state.py"
      - "scripts/ci/test-licensed-workflow-state.py"
  push:
    branches:
      - "diagnostic/ci-licensed-workflow-state-20261027"

permissions:
  contents: read
  actions: read

concurrency:
  group: licensed-workflow-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify fixed identity, source, privacy and redirect controls
        run: python3 scripts/ci/test-licensed-workflow-state.py

  provider-state:
    needs: controls
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/ci-licensed-workflow-state-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read one fixed workflow state without changing execution policy
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/licensed-workflow-state.py
      - name: Retain only the closed source-bound state projection
        if: always() && steps.probe.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licensed-workflow-state-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/licensed-workflow-state/state.json
          if-no-files-found: error
          retention-days: 14
