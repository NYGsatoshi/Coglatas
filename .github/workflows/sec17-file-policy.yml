name: SEC-17 File sharing policy backend

on:
  pull_request:
    paths:
      - 'tests/Coglatas.Tests/SecurityArchitecture/**'
      - 'scripts/ci/sec17_file_policy_execution.py'
      - 'scripts/ci/test_sec17_file_policy_execution.py'
      - 'scripts/ci/test_sec17_execution_support.py'
      - 'scripts/ci/sec_arch_evidence.py'
      - 'scripts/ci/sec_arch_assembly_binding.py'
      - '.github/workflows/sec17-file-policy.yml'
      - 'src/Coglatas.Application/Files/**'
      - 'src/Coglatas.Infrastructure/Persistence/File*'
      - 'src/Coglatas.Web/Realtime/**'
      - 'src/Coglatas.Web/Controllers/FilesController.cs'
      - 'src/Coglatas.Web/Controllers/AttachmentsController.cs'
      - 'src/Coglatas.Application/Realtime/BusinessInvalidationPublisher.cs'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec17-file-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-policy:
    name: SEC-17 current File sharing policy transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4 # PostgreSQL 18.6
        env:
          POSTGRES_DB: coglatas_ci
          POSTGRES_USER: coglatas_ci
          POSTGRES_PASSWORD: coglatas_ci_password
          POSTGRES_INITDB_ARGS: >-
            --set=log_error_verbosity=terse
            --set=log_min_error_statement=panic
            --set=log_parameter_max_length=0
            --set=log_parameter_max_length_on_error=0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coglatas_ci -d coglatas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      COGLATAS_TEST_USE_MIGRATED_TEMPLATE: "true"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
    steps:
      - name: Checkout exact execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce public workflow boundary
        run: python3 -B scripts/ci/check-publication-readiness.py
      - name: Test exact File policy execution false-green and byte-binding controls
        run: |
          python3 -B scripts/ci/test_sec17_file_policy_execution.py
          python3 -B scripts/ci/test_sec17_deep_execution.py
          python3 -B scripts/ci/test_sec_arch_evidence.py
      - name: Verify PostgreSQL diagnostic privacy
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -B scripts/ci/verify-postgres-log-privacy.py --container "$POSTGRES_CONTAINER"
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore, build and stamp exact candidate
        run: |
          dotnet restore Coglatas.slnx --disable-parallel --verbosity minimal
          dotnet build Coglatas.slnx --configuration Release --no-restore --disable-build-servers -m:1
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/dotnet-build-sha
      - name: Execute only the exact native File policy owner
        run: >-
          dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj
          --configuration Release --no-build --no-restore --disable-build-servers -m:1
          --filter "FullyQualifiedName=Coglatas.Tests.SecurityArchitecture.SecurityArchitectureFilePolicyTransportTests.ActualWorkspaceFileSharingPolicyReauthorizesEstablishedAndFreshTransportAndReplay"
          --logger "trx;LogFileName=sec17-file-policy.trx"
          --results-directory artifacts/sec17-file-policy
      - name: Require exact native File policy execution and capture closed evidence
        if: always()
        run: >-
          python3 -B scripts/ci/sec17_file_policy_execution.py
          --candidate-sha "$GITHUB_SHA"
          --trx artifacts/sec17-file-policy/sec17-file-policy.trx
          --output artifacts/sec17-file-policy/execution.json
      - name: Upload File policy execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec17-file-policy-execution
          path: artifacts/sec17-file-policy/execution.json
          if-no-files-found: error
          retention-days: 7
