name: Diagnostic only - owned Web child native comparison
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact current Product Main source
        required: true
        type: string
      candidate_sha:
        description: Exact PR1804 source
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-comparison:
    name: Diagnostic only - no coverage import or promotion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout diagnostic code separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: diagnostic
      - name: Checkout exact baseline source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.baseline_sha }}
          persist-credentials: false
          path: baseline
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          path: candidate
      - name: Collect actual isolated native tests and originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B diagnostic/scripts/verification/native-node26-diagnostic/owned-child-native.py
      - name: Retain original native evidence separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-child-comparison-${{ inputs.candidate_sha }}-${{ github.run_attempt }}
          path: |
            outputs/*.tar.gz
            outputs/comparison-progress.json
            outputs/*/provider.original.json
            outputs/*/native.original.log
            outputs/*/receipt.json
            outputs/*/focused/**/*.trx
            outputs/*/focused/**/coverage.opencover.xml
            outputs/*/owning/**/*.trx
            outputs/*/owning/**/coverage.opencover.xml
          if-no-files-found: error
          retention-days: 14
