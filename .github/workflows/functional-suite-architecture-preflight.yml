name: Functional Suite Architecture Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/functional-suite-architecture-preflight.yml"
      - ".github/workflows/functional-validation.yml"
      - ".github/workflows/functional-extended.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.functional.config.ts"
      - "scripts/ci/build-functional-grep.mjs"
      - "scripts/ci/functional-tags.mjs"
      - "scripts/ci/run-functional-playwright.mjs"
      - "scripts/ci/*functional*"
      - "tests/functional/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/functional-suite-architecture-preflight.yml"
      - ".github/workflows/functional-validation.yml"
      - ".github/workflows/functional-extended.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.functional.config.ts"
      - "scripts/ci/build-functional-grep.mjs"
      - "scripts/ci/functional-tags.mjs"
      - "scripts/ci/run-functional-playwright.mjs"
      - "scripts/ci/*functional*"
      - "tests/functional/**"

concurrency:
  group: functional-suite-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  functional-suite-architecture-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install repository Playwright dependencies
        run: npm ci --prefer-offline --ignore-scripts --no-audit --no-fund

      - name: Self-test Functional metadata and selection contracts
        run: node --test tests/functional/*.node-test.mjs

      - name: Reject stale, incomplete and quarantined Functional evidence
        run: |
          python3 scripts/ci/test-functional-evidence.py
          python3 scripts/ci/validate-functional-quarantine.py

      - name: Check Functional runner syntax
        shell: bash
        run: |
          node --check scripts/ci/functional-tags.mjs
          node --check scripts/ci/build-functional-grep.mjs
          node --check scripts/ci/run-functional-playwright.mjs
          node --check scripts/ci/run-functional-domain.mjs
          bash -n scripts/ci/package-pr-functional-runtime.sh

      - name: Load Functional Playwright config and discover an actual spec
        shell: bash
        run: |
          discovery="$(node node_modules/@playwright/test/cli.js test --config playwright.functional.config.ts --list)"
          printf '%s\n' "$discovery"
          grep -Fq \
            "FCI-03 discovers FUNC-AUTH-001 metadata without claiming real-backend coverage" \
            <<< "$discovery"

      - name: Verify metadata to tags to grep selection end-to-end
        shell: bash
        run: |
          selected="$(node scripts/ci/run-functional-playwright.mjs \
            --gate functional-fast \
            --domain auth \
            --priority p0 \
            --backend mock \
            --journey FUNC-AUTH-001 \
            -- --list)"
          printf '%s\n' "$selected"
          grep -Fq \
            "FCI-03 discovers FUNC-AUTH-001 metadata without claiming real-backend coverage" \
            <<< "$selected"

      - name: Summarize FCI-03 architecture contract
        shell: bash
        run: |
          {
            echo "### Functional Suite Architecture Preflight"
            echo
            echo "- Repository Playwright dependency graph installed with npm ci"
            echo "- Functional Playwright config loaded successfully"
            echo "- Actual tests/functional/**/*.spec.ts discovery verified"
            echo "- Metadata -> Playwright tags -> grep selection verified end-to-end"
            echo "- Gate/domain/Journey selection contracts self-tested"
            echo "- Real-backend default classification self-tested"
            echo "- Artifact redaction self-tested"
          } >> "$GITHUB_STEP_SUMMARY"
