name: ProjectIDE Pure Core entry isolated candidates

on:
  pull_request:
    paths:
      - tests/Coglatas.ProjectIde.Entry.Tests/**
      - tests/ci/projectide_entry_isolated.py
      - tests/ci/test_projectide_entry_isolated.py
      - tests/ci/test_projectide_entry_resharper.py
      - scripts/quality/projectide_entry_resharper.py
      - scripts/quality/check-resharper-pr-sarif.py
      - .github/workflows/resharper_pr.yml
      - Coglatas.slnx
      - .github/workflows/projectide-entry-isolated.yml

permissions:
  contents: read

concurrency:
  group: projectide-entry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Promoted Entry current tree (ubuntu-latest)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'projectide/integration-20261031' &&
      github.head_ref == 'test/projectide-entry-scoped-promotion-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
    steps:
      - name: Checkout exact independent Test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Set up evidence interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Set up independent hash runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Compose and verify exact pure candidates without runtime adapters
        shell: pwsh
        run: |
          python -B tests/ci/projectide_entry_isolated.py --integrated --worktree "${{ runner.temp }}/entry-combined" --evidence "${{ runner.temp }}/entry-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Pure Core candidate verification failed' }
      - name: Retain exact identities, discovery, TRX and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-pure-entry-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/entry-evidence
          if-no-files-found: error

  windows:
    name: Promoted Entry current tree (windows-latest)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'projectide/integration-20261031' &&
      github.head_ref == 'test/projectide-entry-scoped-promotion-20261108'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
    steps:
      - name: Checkout exact independent Test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Set up evidence interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Set up independent hash runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Compose and verify exact pure candidates without runtime adapters
        shell: pwsh
        run: |
          python -B tests/ci/projectide_entry_isolated.py --integrated --worktree "${{ runner.temp }}/entry-combined" --evidence "${{ runner.temp }}/entry-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Pure Core candidate verification failed' }
      - name: Retain exact identities, discovery, TRX and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-pure-entry-windows-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/entry-evidence
          if-no-files-found: error
