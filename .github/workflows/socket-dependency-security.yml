name: Socket Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/socket-dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/socket-dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  socket-firewall:
    name: socket-firewall-${{ matrix.package_dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - "."
          - "frontend"
          - "coglatas-frontend"
          - "tools/frontend-inspections"

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up approved Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Socket Firewall Free
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Verify dependency fetches with Socket Firewall
        working-directory: ${{ matrix.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          sfw npm ci --ignore-scripts --no-audit --no-fund

  socket-sca:
    name: socket-sca-opt-in
    if: vars.SOCKET_SCA_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout full repository history for Socket SCM attribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Require Socket API credentials
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOCKET_SECURITY_API_KEY" || {
            echo "::error::SOCKET_SCA_ENABLED is true but SOCKET_SECURITY_API_KEY is missing."
            exit 1
          }

      - name: Install Socket SCA CLI
        run: python -m pip install socketsecurity

      - name: Scan dependencies with Socket SCA
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          socketcli --target-path "$GITHUB_WORKSPACE" --scm github
