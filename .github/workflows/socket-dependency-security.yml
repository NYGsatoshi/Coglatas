name: Socket Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/socket-dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/socket-dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  socket-firewall:
    name: socket-firewall-${{ matrix.package_dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - "."
          - "frontend"
          - "coglatas-frontend"
          - "tools/frontend-inspections"

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up approved Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install Socket Firewall Free
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Verify dependency fetches with Socket Firewall
        working-directory: ${{ matrix.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          sfw npm ci --ignore-scripts --no-audit --no-fund
