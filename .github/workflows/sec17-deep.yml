name: Diagnostic only - native Node 26 original-input replay

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact Product Main source SHA to inspect
        required: true
        type: string
      sonar_run_id:
        description: Completed original Main Sonar workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  native-replay:
    name: Diagnostic only - no coverage import or promotion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCT_SHA: ${{ inputs.product_sha }}
      SONAR_RUN_ID: ${{ inputs.sonar_run_id }}
    steps:
      - name: Validate immutable diagnostic target
        run: |
          set -euo pipefail
          [[ "$PRODUCT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SONAR_RUN_ID" =~ ^[0-9]+$ ]]
      - name: Checkout diagnostic code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: diagnostic
      - name: Checkout exact Product source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.product_sha }}
          persist-credentials: false
          path: product
      - name: Verify provider originals and archive exact LF source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B diagnostic/scripts/verification/native-node26-diagnostic/fetch-original-inputs.py
      - name: Replay original raw inputs in pinned native Node 26
        run: |
          set -euo pipefail
          docker run --rm --cpus 2 --memory 3g --network none \
            --env PRODUCT_SHA \
            --mount "type=bind,source=$GITHUB_WORKSPACE/inputs,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/diagnostic/scripts/verification/native-node26-diagnostic,target=/code,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/outputs,target=/output" \
            node:26@sha256:438603bbb5cda404b9416f0b5c8026f61501ab911760d861ec28c36b5d675725 \
            bash -euc '
              mkdir -p /home/runner/work/Coglatas/Coglatas
              tar -xf /input/source.tar -C /home/runner/work/Coglatas/Coglatas
              cd /home/runner/work/Coglatas/Coglatas
              node /code/verify-subjects.mjs "$PWD" /input/node/representation.json
              node --expose-internals /code/functional-representation-order-proof.cjs "$PWD" /input/raw /output/current-hosted-native-order.original.json "$PRODUCT_SHA"
              node /code/compare-functional-native-replay-node26.mjs /output/current-hosted /input/node /input/raw v26.13.0
            '
      - name: Preserve diagnostic outputs separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-node26-replay-${{ inputs.product_sha }}-${{ github.run_attempt }}
          path: outputs/
          if-no-files-found: error
          retention-days: 14
