name: ProjectIDE local evidence cross-client candidate parity

on:
  pull_request:
    paths:
      - tests/candidates/projectide-evidence/**
      - .github/workflows/projectide-evidence-display-candidates.yml

permissions:
  contents: read

concurrency:
  group: projectide-evidence-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Pure evidence UI parity (ubuntu-latest)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'SecurityTestImplimation' &&
      github.head_ref == 'test/projectide-evidence-display-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: a9c09f7e74a8ca5a2dcd4e6579ca9df56105941b
      CI: 'true'
    steps:
      - name: Checkout exact independent Test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Configure Python evidence interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Configure Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify exact Product/Test composition and retained receipts
        shell: pwsh
        run: |
          python -B tests/candidates/projectide-evidence/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "${{ runner.temp }}/projectide-evidence-composed" --evidence "${{ runner.temp }}/projectide-evidence-receipts"
          if ($LASTEXITCODE -ne 0) { throw 'ProjectIDE evidence candidate parity failed' }
      - name: Retain observed logs and negative outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-evidence-ubuntu-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projectide-evidence-receipts
          if-no-files-found: warn

  windows:
    name: Pure evidence UI parity (windows-latest)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'SecurityTestImplimation' &&
      github.head_ref == 'test/projectide-evidence-display-20261108'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: a9c09f7e74a8ca5a2dcd4e6579ca9df56105941b
      CI: 'true'
    steps:
      - name: Checkout exact independent Test candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure repository .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Configure Python evidence interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Configure Node 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify exact Product/Test composition and retained receipts
        shell: pwsh
        run: |
          python -B tests/candidates/projectide-evidence/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "${{ runner.temp }}/projectide-evidence-composed" --evidence "${{ runner.temp }}/projectide-evidence-receipts"
          if ($LASTEXITCODE -ne 0) { throw 'ProjectIDE evidence candidate parity failed' }
      - name: Retain observed logs and negative outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-evidence-windows-latest-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projectide-evidence-receipts
          if-no-files-found: warn
