name: ProjectIDE Run comparison Web exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-run-comparison-web-advisory.yml
      - tests/candidates/projectide-run-comparison-web/**

permissions:
  contents: read

env:
  PRODUCT_HEAD: 09347c1113f5f9c007bbbc5052278d5b5151feb5
  ANGULAR_BLOB: f4271b707d98b1d49d0d63e5e9a3cb9a7ec1bfe3
  RUNNER_BLOB: cfa27e1aaf1a1116dbc6cd332313da6080d9196e
  CONTROLS_BLOB: fa4c36ad76113f2bea1db2c587a724c6ad70c5de

concurrency:
  group: run-comparison-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  angular-composition-ubuntu:
    name: Run comparison Web composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_HEAD: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select committed LF checkout bytes' }
      - name: Checkout immutable independent Test owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact Test Product runner and workflow sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualTest = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualTest -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $angular = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison-web/projectide-run-comparison-security.candidate.spec.ts'
          if ($LASTEXITCODE -ne 0 -or $angular -ne $env:ANGULAR_BLOB) { throw 'Frozen Angular candidate blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison-web/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Composition runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison-web/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Admission controls blob mismatch' }
          if ($env:WORKFLOW_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Executing workflow commit is not an exact Git SHA' }
          git -c protocol.version=2 fetch --no-tags --no-recurse-submodules origin $env:WORKFLOW_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the immutable executing workflow commit' }
          $actualWorkflow = git rev-parse --verify "$($env:WORKFLOW_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $actualWorkflow -ne $env:WORKFLOW_HEAD) { throw 'Executing workflow commit mismatch' }
          $workflow = git rev-parse "$($env:WORKFLOW_HEAD):.github/workflows/projectide-run-comparison-web-advisory.yml"
          if ($LASTEXITCODE -ne 0) { throw 'Executing workflow blob unavailable' }
          $testWorkflow = git rev-parse 'HEAD:.github/workflows/projectide-run-comparison-web-advisory.yml'
          if ($LASTEXITCODE -ne 0 -or $workflow -ne $testWorkflow) { throw 'Executing workflow differs from the reviewed Test workflow' }
          $workflowTree = git rev-parse "$($env:WORKFLOW_HEAD)^{tree}"
          if ($LASTEXITCODE -ne 0) { throw 'Executing workflow tree unavailable' }
          $testTree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $workflowTree -ne $testTree) { throw 'Executing workflow tree differs from the exact Test tree' }
          $productTree = git rev-parse "$($env:PRODUCT_HEAD)^{tree}"
          if ($LASTEXITCODE -ne 0 -or $productTree -ne '5abb6b4f4389f200a289a84b99a0dd13e60072cc') { throw 'Exact Product tree mismatch' }
          $context = Join-Path $env:RUNNER_TEMP 'run-comparison-web-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          @{
            workflowHead = $env:WORKFLOW_HEAD
            workflowRef = $env:WORKFLOW_REF
            workflowTree = $workflowTree
            testWorkflowBlob = $testWorkflow
            testTree = $testTree
            productHead = $env:PRODUCT_HEAD
            productTree = $productTree
            testHead = $actualTest
            angularBlob = $angular
            runnerBlob = $runner
            controlsBlob = $controls
            workflowBlob = $workflow
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_RUN_COMPARISON_WEB_READER_STORE_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Set up composition interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Set up supported frontend runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Pin the Product package manager
        shell: pwsh
        run: |
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm installation failed' }
          $version = npm --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '11.17.0') { throw 'Pinned npm version mismatch' }
      - name: Execute the frozen Angular candidate against exact Product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'run-comparison-web-context'
          $status = git -c core.autocrlf=false status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Test checkout status' }
          [System.IO.File]::WriteAllText(
            (Join-Path $context 'source-status.txt'),
            ($status -join "`n"),
            [System.Text.UTF8Encoding]::new($false))
          if ($status) { throw 'Independent Test checkout is not clean' }
          python --version | Set-Content (Join-Path $context 'python-version.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime unavailable' }
          python -B tests/candidates/projectide-run-comparison-web/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/run-comparison-web-composed" --evidence "$env:RUNNER_TEMP/run-comparison-web-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Angular composition failed; retain original evidence' }
      - name: Exercise strict admission with the original retained Angular report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = "$env:RUNNER_TEMP/run-comparison-web-context/admission-controls.log"
          python -B tests/candidates/projectide-run-comparison-web/test_compose_and_verify.py --evidence "$env:RUNNER_TEMP/run-comparison-web-evidence" --report "$env:RUNNER_TEMP/run-comparison-web-context/admission-controls.json" -v *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content $log
          if ($controlsExitCode -ne 0) { throw 'Retained Angular evidence admission controls failed' }
      - name: Retain original Angular outcomes source and control receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: run-comparison-web-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/run-comparison-web-context
            ${{ runner.temp }}/run-comparison-web-evidence
          if-no-files-found: error

