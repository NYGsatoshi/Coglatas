name: ProjectIDE Project Test Web exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-project-test-web-advisory.yml
      - tests/candidates/projectide-project-test-web/**
      - tests/candidates/workflow-provenance/**

permissions:
  contents: read

env:
  PROVENANCE_BLOB: bc8106b9c4ac38af7ddb53bd4f904aef98d847e8
  PROVENANCE_CONTROLS_BLOB: c9f7ec729870758b86b21f806423ce1bb726933c
  PRODUCT_HEAD: 09347c1113f5f9c007bbbc5052278d5b5151feb5
  ANGULAR_BLOB: a3e91af4d3e97a0671761b3a3affe78b63484c60
  RUNNER_BLOB: 08a9fadbe9dd5f46642910b5807aa8220b96c42e
  CONTROLS_BLOB: b4704c302b243aa9956e7aae6f225df33975c09d

concurrency:
  group: project-test-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  angular-composition-ubuntu:
    name: Project Test Web composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_HEAD: ${{ github.event.pull_request.base.sha }}
      WORKFLOW_HEAD: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select committed LF checkout bytes' }
      - name: Checkout immutable independent Test owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact Test Product runner and workflow sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualTest = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualTest -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $angular = git rev-parse 'HEAD:tests/candidates/projectide-project-test-web/projectide-project-test-security.candidate.spec.ts'
          if ($LASTEXITCODE -ne 0 -or $angular -ne $env:ANGULAR_BLOB) { throw 'Frozen Angular candidate blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-project-test-web/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Composition runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-project-test-web/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Admission controls blob mismatch' }
          $productTree = git rev-parse "$($env:PRODUCT_HEAD)^{tree}"
          if ($LASTEXITCODE -ne 0 -or $productTree -ne '5abb6b4f4389f200a289a84b99a0dd13e60072cc') { throw 'Exact Product tree mismatch' }
          $context = Join-Path $env:RUNNER_TEMP 'project-test-web-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          @{
            productHead = $env:PRODUCT_HEAD
            productTree = $productTree
            testHead = $actualTest
            angularBlob = $angular
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_PROJECT_TEST_WEB_READER_STORE_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Set up composition interpreter
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Bind the immutable executing workflow to the reviewed Test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'project-test-web-context'
          python -B tests/candidates/workflow-provenance/verify_workflow_provenance.py --workflow-path .github/workflows/projectide-project-test-web-advisory.yml --context (Join-Path $context 'workflow-context.json')
          if ($LASTEXITCODE -ne 0) { throw 'Executing workflow provenance was refused' }
      - name: Exercise independent Git provenance refusal controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'project-test-web-context'
          $log = Join-Path $context 'provenance-controls.log'
          python -B -m unittest discover -s tests/candidates/workflow-provenance -p test_workflow_provenance.py -v *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($controlsExitCode -ne 0) { throw 'Executing workflow provenance controls failed' }
      - name: Set up supported frontend runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Pin the Product package manager
        shell: pwsh
        run: |
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm installation failed' }
          $version = npm --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '11.17.0') { throw 'Pinned npm version mismatch' }
      - name: Execute the frozen Angular candidate against exact Product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'project-test-web-context'
          $status = git -c core.autocrlf=false status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect Test checkout status' }
          [System.IO.File]::WriteAllText(
            (Join-Path $context 'source-status.txt'),
            ($status -join "`n"),
            [System.Text.UTF8Encoding]::new($false))
          if ($status) { throw 'Independent Test checkout is not clean' }
          python --version | Set-Content (Join-Path $context 'python-version.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Python runtime unavailable' }
          python -B tests/candidates/projectide-project-test-web/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/project-test-web-composed" --evidence "$env:RUNNER_TEMP/project-test-web-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Angular composition failed; retain original evidence' }
      - name: Exercise strict admission with the original retained Angular report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = "$env:RUNNER_TEMP/project-test-web-context/admission-controls.log"
          python -B tests/candidates/projectide-project-test-web/test_compose_and_verify.py --evidence "$env:RUNNER_TEMP/project-test-web-evidence" --report "$env:RUNNER_TEMP/project-test-web-context/admission-controls.json" -v *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content $log
          if ($controlsExitCode -ne 0) { throw 'Retained Angular evidence admission controls failed' }
      - name: Retain original Angular outcomes source and control receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: project-test-web-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/project-test-web-context
            ${{ runner.temp }}/project-test-web-evidence
          if-no-files-found: error

