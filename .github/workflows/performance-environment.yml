name: Performance environment

on:
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: small
      reuse_main_artifacts:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      profile:
        description: PERF-01 dataset profile
        required: true
        default: small
        type: choice
        options:
          - small
          - medium
          - large

concurrency:
  group: performance-environment-${{ github.ref }}-${{ inputs.profile || 'small' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  environment-smoke:
    name: performance-environment-${{ inputs.profile || 'small' }}
    runs-on: ubuntu-24.04
    environment: syncfusion-licensed-build
    timeout-minutes: 90
    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
      COGLATAS_PERFORMANCE_PROFILE: ${{ inputs.profile || 'small' }}
      COGLATAS_PERFORMANCE_PORT: "18080"
      COGLATAS_PERFORMANCE_COMPOSE_PROJECT: coglatas-performance-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build credential requirement
        shell: bash
        env:
          REUSE_MAIN_ARTIFACTS: ${{ inputs.reuse_main_artifacts && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_MAIN_ARTIFACTS" == "true" ]]; then
            # Compose still resolves the declared build secret during config
            # rendering even though the prebuilt app path uses --no-build.
            # Supply a non-secret sentinel only for that parser requirement.
            echo "SYNCFUSION_LICENSE=artifact-reuse-no-build" >> "$GITHUB_ENV"
          else
            test -n "${SYNCFUSION_LICENSE:-}" || {
              echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
              exit 1
            }
          fi
      - name: Download main build artifacts
        if: inputs.reuse_main_artifacts == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: main-build-artifacts
          path: ${{ runner.temp }}/main-build-artifacts

      - name: Restore main build artifacts
        if: inputs.reuse_main_artifacts == true
        shell: bash
        run: bash scripts/ci/restore-main-build-artifacts.sh "$RUNNER_TEMP/main-build-artifacts" "$TARGET_SHA" "$GITHUB_WORKSPACE"


      - name: Generate isolated synthetic fixture credential
        shell: bash
        run: |
          password="$(python3 - <<'PY'
          import secrets
          print('PerfCi-' + secrets.token_urlsafe(24))
          PY
          )"
          echo "::add-mask::$password"
          echo "COGLATAS_PERFORMANCE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Validate PERF-02 contract
        run: |
          python3 scripts/ci/verify-performance-contract.py
          python3 scripts/ci/verify-performance-environment.py
          python3 -m unittest discover -s tests/ci -p 'test_performance_environment.py'

      - name: Start, preflight, warm up, fingerprint, and teardown
        run: bash scripts/performance/with-environment.sh

      - name: Preserve first deterministic fixture evidence
        run: cp "artifacts/performance/${COGLATAS_PERFORMANCE_PROFILE}/fixture.json" /tmp/perf02-fixture-first.json

      - name: Assert first teardown is clean
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=${COGLATAS_PERFORMANCE_COMPOSE_PROJECT}")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=${COGLATAS_PERFORMANCE_COMPOSE_PROJECT}")"

      - name: Repeat environment startup without stale state
        run: bash scripts/performance/with-environment.sh

      - name: Compare deterministic fixture identity and cardinality
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path('/tmp/perf02-fixture-first.json').read_text(encoding='utf-8-sig'))
          second = json.loads(Path(f"artifacts/performance/{first['profile']}/fixture.json").read_text(encoding='utf-8-sig'))
          for key in ('fixtureVersion', 'seedManifestVersion', 'profile', 'seed', 'fixtureHash', 'cardinalities', 'focus', 'identities'):
              if first[key] != second[key]:
                  raise SystemExit(f'PERF-02 repeat-start drift in {key}')
          print(f"repeat-start deterministic fixture verified: {first['fixtureHash']}")
          PY

      - name: Assert final teardown is clean
        shell: bash
        run: |
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=${COGLATAS_PERFORMANCE_COMPOSE_PROJECT}")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=${COGLATAS_PERFORMANCE_COMPOSE_PROJECT}")"

      - name: Upload PERF-02 machine-readable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf02-${{ inputs.profile || 'small' }}-${{ github.sha }}
          path: artifacts/performance/${{ inputs.profile || 'small' }}/
          if-no-files-found: warn
          retention-days: 14
