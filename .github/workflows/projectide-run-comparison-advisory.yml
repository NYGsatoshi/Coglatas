name: ProjectIDE Run comparison exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-run-comparison-advisory.yml
      - tests/candidates/projectide-run-comparison/**

permissions:
  contents: read

env:
  PRODUCT_HEAD: ea339ed0bc094630654262ebb28568a95ba4198f
  SOURCE_BLOB: 73969c88ae939bc805e8e853b0022ef609a58f03
  RUNNER_BLOB: e103f47cfe3931f81a24110e0aaab54b7c2b17f5
  CONTROLS_BLOB: 2e0a19a3e58152cf706178b91e544fb736cb99c3

concurrency:
  group: run-comparison-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-comparison-ubuntu:
    name: Run comparison independent synthetic composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot use LF checkout policy' }
      - name: Checkout immutable independent Security Test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source blobs and Product SDK policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $case = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison/SecurityRunComparisonCandidateTests.cs'
          if ($LASTEXITCODE -ne 0 -or $case -ne $env:SOURCE_BLOB) { throw 'Candidate source blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Independent runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-run-comparison/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Verifier controls blob mismatch' }
          git cat-file -e "$($env:PRODUCT_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Product commit not present' }
          $policy = git show "$($env:PRODUCT_HEAD):global.json"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy absent' }
          $context = Join-Path $env:RUNNER_TEMP 'run-comparison-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
            testHead = $actual
            productHead = $env:PRODUCT_HEAD
            sourceBlob = $case
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_RUN_COMPARISON_CORE_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Install exact Product .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ${{ runner.temp }}/run-comparison-qualification-context/global.json
      - name: Install pinned composition Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Run synthetic verifier regression controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'run-comparison-qualification-context'
          $log = Join-Path $context 'admission-controls.log'
          # Verify both Python executables against immutable committed and worktree bytes.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-run-comparison/compose_and_verify.py'; Sha = $env:RUNNER_BLOB },
            @{ Path = 'tests/candidates/projectide-run-comparison/test_compose_and_verify.py'; Sha = $env:CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed script identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working script identity mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); bad=[p for p in root.rglob('*') if p.name=='__pycache__' or p.suffix in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-run-comparison'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Python bytecode cache is not admitted' }
          python -I -B -c "import runpy,sys; p=sys.argv[1]; sys.argv=[p]; runpy.run_path(p,run_name='__main__')" 'tests/candidates/projectide-run-comparison/test_compose_and_verify.py' *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($controlsExitCode -ne 0) { throw 'Run comparison synthetic verifier controls failed' }
      - name: Run exact independent source and real compiled xUnit controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Verify both Python executables against immutable committed and worktree bytes.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-run-comparison/compose_and_verify.py'; Sha = $env:RUNNER_BLOB },
            @{ Path = 'tests/candidates/projectide-run-comparison/test_compose_and_verify.py'; Sha = $env:CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed script identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working script identity mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); bad=[p for p in root.rglob('*') if p.name=='__pycache__' or p.suffix in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-run-comparison'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Python bytecode cache is not admitted' }
          python -I -B tests/candidates/projectide-run-comparison/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/run-comparison-qualification-product" --evidence "$env:RUNNER_TEMP/run-comparison-qualification-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Run comparison independent synthetic qualification did not complete' }
      - name: Retain original source, TRX and compiled discovery receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: run-comparison-qualification-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/run-comparison-qualification-context
            ${{ runner.temp }}/run-comparison-qualification-evidence
          if-no-files-found: error
          retention-days: 7


