name: Public HTTPS Production Golden Path

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-https-production-gate:
    # The protected environment owns all fixture values. It must be approved
    # after deployment and configured with the dedicated synthetic account.
    environment: public-https-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coglatas-public-https-deployment-gate
      cancel-in-progress: false
    env:
      COGLATAS_PUBLIC_HTTPS_SMOKE: '1'
      COGLATAS_PUBLIC_SMOKE_SYNTHETIC_FIXTURE: '1'
      COGLATAS_PUBLIC_SMOKE_URL: ${{ secrets.COGLATAS_PUBLIC_SMOKE_URL }}
      COGLATAS_PUBLIC_SMOKE_EMAIL: ${{ secrets.COGLATAS_PUBLIC_SMOKE_EMAIL }}
      COGLATAS_PUBLIC_SMOKE_PASSWORD: ${{ secrets.COGLATAS_PUBLIC_SMOKE_PASSWORD }}
      COGLATAS_PUBLIC_SMOKE_WORKSPACE_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_WORKSPACE_ID }}
      COGLATAS_PUBLIC_SMOKE_PROJECT_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_PROJECT_ID }}
      COGLATAS_PUBLIC_SMOKE_TASK_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_TASK_ID }}
      COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_WORKSPACE_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_WORKSPACE_ID }}
      COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_PROJECT_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_PROJECT_ID }}
      COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_TASK_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_TASK_ID }}
      COGLATAS_PUBLIC_SMOKE_REVOKED_FILE_ID: ${{ secrets.COGLATAS_PUBLIC_SMOKE_REVOKED_FILE_ID }}

    steps:
      - name: Checkout deployed candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install deployment-gate dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Verify protected deployment-gate configuration
        shell: bash
        run: |
          required=(
            COGLATAS_PUBLIC_SMOKE_URL
            COGLATAS_PUBLIC_SMOKE_EMAIL
            COGLATAS_PUBLIC_SMOKE_PASSWORD
            COGLATAS_PUBLIC_SMOKE_WORKSPACE_ID
            COGLATAS_PUBLIC_SMOKE_PROJECT_ID
            COGLATAS_PUBLIC_SMOKE_TASK_ID
            COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_WORKSPACE_ID
            COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_PROJECT_ID
            COGLATAS_PUBLIC_SMOKE_UNAUTHORIZED_TASK_ID
            COGLATAS_PUBLIC_SMOKE_REVOKED_FILE_ID
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "$key is not configured in the protected public-https-gate environment." >&2
              exit 1
            fi
          done

      - name: Run public HTTPS production Golden Path
        # No Playwright artifacts are uploaded. The public-gate configuration
        # disables trace, screenshots, video, HTML, and JUnit output so tokens,
        # cookies, credentials, and protected metadata cannot enter artifacts.
        run: npm run test:ui:public-https
