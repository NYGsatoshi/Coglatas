name: API Performance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect_diagnostics:
        description: Collect one bounded investigation cohort; results are not acceptance evidence
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: API performance routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.route.outputs.required }}
      modes: ${{ steps.route.outputs.modes }}
      diagnostics: ${{ steps.route.outputs.diagnostics }}
      applicable: ${{ steps.route.outputs.applicable }}
      assurance_mode: ${{ steps.route.outputs.assurance_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run non-measured API and assurance contract tests
        run: |
          python3 scripts/performance/assurance_policy.py status
          python3 -m unittest discover -s tests/ci -p 'test_performance_api*.py'
          python3 -m unittest discover -s tests/ci -p 'test_performance_assurance.py'
          node --test tests/ci/performance-api-k6.test.mjs
          python3 scripts/performance/api_k6.py validate
      - name: Classify relevant changes
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          required=true
          diagnostics=false
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [[ "$EVENT_NAME" != workflow_dispatch && -n "$base" && ! "$base" =~ ^0+$ ]]; then
            python3 scripts/performance/api_k6.py governance --base "$base"
            required="$(python3 scripts/performance/api_k6.py route --base "$base")"
            diagnostics="$(python3 scripts/performance/api_k6.py diagnostic-route --base "$base")"
          fi
          modes='["regression"]'
          if [[ "$EVENT_NAME" == pull_request ]]; then
            modes='["fast"]'
            if [[ "$(python3 scripts/performance/api_k6.py harness-route --base "$base")" == true ]]; then
              modes='["fast","regression"]'
            fi
          fi
          applicable="$required"
          assurance_mode="$(python3 scripts/performance/assurance_policy.py status)"
          if [[ "$assurance_mode" == suspended ]]; then
            required=false
            diagnostics=false
          fi
          {
            echo "modes=$modes"
            echo "required=$required"
            echo "applicable=$applicable"
            echo "assurance_mode=$assurance_mode"
            echo "diagnostics=$diagnostics"
          } >> "$GITHUB_OUTPUT"
          echo "API numerical performance: SUSPENDED / NOT_EVALUATED; applicable=$applicable; #1128" >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    name: API k6 benchmark (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.route.outputs.modes) }}
    needs: route
    if: needs.route.outputs.required == 'true'
    # Pin the declared OS class; hardware SKU remains normal runner assignment.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test collection, failure policy, and normalization
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_performance_api*.py'
          node --test tests/ci/performance-api-k6.test.mjs
          python3 scripts/performance/api_k6.py validate
      - name: Generate synthetic credential
        run: |
          password="$(python3 -c 'import secrets; print("PerfCi-" + secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "COGLATAS_PERFORMANCE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Measure Release backend and real PostgreSQL
        env:
          MODE: ${{ matrix.mode }}
        run: bash scripts/performance/run-api-k6.sh "$MODE"
      - name: Upload sanitized API measurements and decisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf04-api-${{ matrix.mode }}-${{ github.sha }}
          path: |
            artifacts/performance/api/current-*.json
            artifacts/performance/api/baseline-*.json
            artifacts/performance/api/result.json
            artifacts/performance/api/result.md
          if-no-files-found: error
          retention-days: 14

  diagnostics:
    name: API bounded variance investigation
    needs: route
    if: needs.route.outputs.assurance_mode == 'active' && github.run_attempt == 1 && ((github.event_name == 'pull_request' && github.event.action == 'opened' && needs.route.outputs.diagnostics == 'true') || (github.event_name == 'workflow_dispatch' && inputs.collect_diagnostics == true))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test bounded private diagnostic projection
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_performance_api*.py'
          node --test tests/ci/performance-api-k6.test.mjs
      - name: Generate synthetic credential
        run: |
          password="$(python3 -c 'import secrets; print("PerfCi-" + secrets.token_urlsafe(24))')"
          echo "::add-mask::$password"
          echo "COGLATAS_PERFORMANCE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Declare and execute exactly five current-only diagnostic groups
        run: bash scripts/performance/run-api-diagnostics.sh
      - name: Upload sanitized investigation evidence including failed groups
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf04-api-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/performance/api-diagnostics/cohort-manifest.json
            artifacts/performance/api-diagnostics/current-*.json
            artifacts/performance/api-diagnostics/group-*-status.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: performance-fast
    if: always()
    needs: [route, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision for policy verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Enforce policy and required child state
        env:
          ROUTING_RESULT: ${{ needs.route.result }}
          REQUIRED: ${{ needs.route.outputs.required }}
          APPLICABLE: ${{ needs.route.outputs.applicable }}
          ASSURANCE_MODE: ${{ needs.route.outputs.assurance_mode }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          set -euo pipefail
          test "$ROUTING_RESULT" == success
          actual_mode="$(python3 scripts/performance/assurance_policy.py status)"
          test "$ASSURANCE_MODE" == "$actual_mode"
          case "$ASSURANCE_MODE" in
            suspended)
              test "$REQUIRED" == false
              test "$BENCHMARK_RESULT" == skipped
              case "$APPLICABLE" in true|false) ;; *) exit 1 ;; esac
              python3 scripts/performance/assurance_policy.py receipt --suite api \
                --sha "$GITHUB_SHA" --output artifacts/performance/api-assurance/status.json
              echo "### API numerical assurance: SUSPENDED / NOT_EVALUATED" >> "$GITHUB_STEP_SUMMARY"
              echo "Required check covers routing/contracts, not k6 metrics or baseline acceptance. #1128" >> "$GITHUB_STEP_SUMMARY"
              ;;
            active)
              # Unreachable under the reviewed suspended-only policy; separate PR required.
              case "$REQUIRED" in
                true) test "$BENCHMARK_RESULT" == success ;;
                false) test "$BENCHMARK_RESULT" == skipped; echo "API performance: validated not-applicable" ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
      - name: Upload explicit numerical non-acceptance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf04-assurance-${{ github.sha }}
          path: artifacts/performance/api-assurance/status.json
          if-no-files-found: warn
          retention-days: 90
