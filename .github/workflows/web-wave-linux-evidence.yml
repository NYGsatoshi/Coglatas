name: Web wave isolated Linux visual evidence
on:
  push:
    branches: [codex/webwave-linux-evidence-20261019]
    paths: [.github/workflows/web-wave-linux-evidence.yml]
permissions:
  contents: read
jobs:
  combined-mobile-baseline:
    if: github.repository == 'NYGsatoshi/Coglatas'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: a269944331863da1a22925eea702c83cbd34bd17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a269944331863da1a22925eea702c83cbd34bd17
          persist-credentials: false
      - name: Generate exact-candidate Linux baseline for independent review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          project="coglatas-webwave-visual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export PLAYWRIGHT_NPM_CACHE_VOLUME="${project}-npm"
          export PLAYWRIGHT_ANGULAR_CACHE_VOLUME="${project}-angular"
          docker volume create "$PLAYWRIGHT_NPM_CACHE_VOLUME" >/dev/null
          docker volume create "$PLAYWRIGHT_ANGULAR_CACHE_VOLUME" >/dev/null
          trap 'docker compose -p "$project" -f infra/compose/dev/playwright.yml down --volumes --remove-orphans' EXIT
          docker compose -p "$project" -f infra/compose/dev/playwright.yml run --build --rm angular-playwright bash -lc \
            'bash scripts/ci/npm-ci-retry.sh . && bash scripts/ci/npm-ci-retry.sh frontend && npm --prefix frontend run build && node tests/ui/run-angular-playwright.mjs --project=chromium-mobile --grep "matches approved Angular P0 screenshot baselines" --update-snapshots'
          expected='tests/ui/__angular_snapshots__/linux/angular-smoke.spec.ts/mobile-shell-workspaces-drawer.png'
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$expected"
          file "$expected" | grep -F 'PNG image data, 390 x 844'
          git diff --check
          mkdir -p visual-evidence
          cp "$expected" visual-evidence/mobile-shell-workspaces-drawer.png
          sha256sum "$expected" > visual-evidence/png.sha256
          printf 'candidate=%s\nfrontend_tree=%s\nrun=%s\nattempt=%s\n' "$CANDIDATE_SHA" "$(git rev-parse HEAD:frontend)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > visual-evidence/source.txt
      - name: Retain candidate evidence without committing or approving it
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webwave-combined-linux-visual
          path: |
            visual-evidence/
            test-results/
          retention-days: 7
          if-no-files-found: warn
