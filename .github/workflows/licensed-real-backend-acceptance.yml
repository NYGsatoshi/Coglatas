name: Licensed Real Backend Acceptance

on:
  workflow_call:
    inputs:
      suite:
        required: false
        type: string
        default: all
      reuse_main_artifacts:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      suite:
        description: Licensed acceptance suite to run
        required: true
        default: p0
        type: choice
        options:
          - p0
          - fci04
          - mobile
          - mobile-mvp0
          - roster
          - issue683
          - authz
          - my-tasks
          - mbj01
          - mbj02
          - mbj03
          - all
  push:
    branches:
      - "integration/angular-22-migration"
      # Trusted write-access branches for exact-candidate FCI-04 evidence.
      - "test/fci04-*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: licensed-real-backend-${{ inputs.suite || 'main-all' }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  licensed-real-backend:
    name: licensed-real-backend
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 180

    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Download main build artifacts
        if: inputs.reuse_main_artifacts == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-build-artifacts
          path: ${{ runner.temp }}/main-build-artifacts

      - name: Restore main build artifacts
        if: inputs.reuse_main_artifacts == true
        shell: bash
        run: bash scripts/ci/restore-main-build-artifacts.sh "$RUNNER_TEMP/main-build-artifacts" "$TARGET_SHA" "$GITHUB_WORKSPACE"


      - name: Resolve build credential requirement
        shell: bash
        env:
          REUSE_MAIN_ARTIFACTS: ${{ inputs.reuse_main_artifacts && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$REUSE_MAIN_ARTIFACTS" == "true" ]]; then
            # The app image was already built in Main CI. Compose requires the
            # declared secret environment variable while rendering config, but
            # --no-build ensures this sentinel is never used as build material.
            echo "SYNCFUSION_LICENSE=artifact-reuse-no-build" >> "$GITHUB_ENV"
          else
            test -n "${SYNCFUSION_LICENSE:-}" || {
              echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
              exit 1
            }
          fi

      - name: Install acceptance runner dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Reset current prebuilt acceptance image receipts
        if: inputs.reuse_main_artifacts == true
        run: python3 scripts/ci/verify-acceptance-image-reuse.py --reset

      - name: Check receipt retention across actual Playwright output cleanup
        if: inputs.reuse_main_artifacts == true
        env:
          COGLATAS_RECEIPT_TEST_PLAYWRIGHT_CLI: ${{ github.workspace }}/node_modules/@playwright/test/cli.js
        run: python3 scripts/ci/test-main-runtime-artifact.py AcceptanceImageReuseTests.test_shared_workspace_receipts_survive_the_runner_output_cleanup_boundary

      - name: Prepare host-owned isolated roster output before Docker writes
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027') || inputs.suite == 'roster' || inputs.suite == 'all'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { accessSync, constants, lstatSync, mkdirSync } from 'node:fs';
          try {
            for (const path of ['artifacts', 'artifacts/roster-private', 'artifacts/roster-real']) {
              try { mkdirSync(path, { mode: 0o700 }); }
              catch (error) { if (error.code !== 'EEXIST') throw error; }
              const info = lstatSync(path);
              if (!info.isDirectory() || info.isSymbolicLink() || info.uid !== process.getuid() ||
                  (path !== 'artifacts' && (info.mode & 0o077) !== 0)) throw new Error();
              accessSync(path, constants.W_OK | constants.X_OK);
            }
          } catch {
            console.error('UI07_ROSTER_HOST_OUTPUT_NOT_WRITABLE');
            process.exit(1);
          }
          console.log('UI07_ROSTER_HOST_OUTPUT_READY');
          NODE

      - name: Prune unused Docker networks
        if: inputs.suite != 'roster' && !(github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027')
        run: docker network prune --force

      - name: Run canonical FCI-04 fast and full owner on the reviewed candidate
        if: startsWith(github.ref, 'refs/heads/test/fci04-') || inputs.suite == 'fci04'
        run: node tests/ui/run-real-backend-fci04.mjs functional-fast functional-full

      - name: Run P0 acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'p0' || inputs.suite == 'all'
        env:
          COGLATAS_FCI04_GATES: ${{ (inputs.reuse_main_artifacts == true || inputs.suite == 'all') && 'functional-full' || 'functional-fast' }}
        run: node tests/ui/run-real-backend-p0.mjs

      - name: Run Issue 683 fixed-SHA repeated race evidence
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'issue683'
        run: node tests/ui/run-issue-683-real-backend-evidence.mjs

      # The fixed trusted push candidate uses the existing direct credential scope.
      # Other push refs retain their previous suite selection.
      - name: Verify isolated ReadOnly roster runner contracts
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027') || inputs.suite == 'roster' || inputs.suite == 'all'
        run: node --test tests/ui/readonly-roster-fixture.node-test.mjs tests/ui/readonly-roster-runner.node-test.mjs

      - name: Run isolated real-backend ReadOnly roster acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027') || inputs.suite == 'roster' || inputs.suite == 'all'
        run: node tests/ui/run-real-backend-readonly-roster.mjs

      - name: Upload structural ReadOnly roster execution receipts
        if: always() && (inputs.reuse_main_artifacts == true || (github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027') || inputs.suite == 'roster' || inputs.suite == 'all')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readonly-roster-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/roster-real/*/execution.json
          if-no-files-found: error
          retention-days: 7

      - name: Run independent real-backend MVP0 Mobile acceptance
        if: inputs.suite == 'mobile-mvp0'
        run: |
          node --test tests/ui/mobile-mvp0-profile.node-test.mjs tests/ui/mobile-mvp0-runner.node-test.mjs
          node tests/ui/run-real-backend-mobile-mvp0.mjs

      - name: Upload sanitized MVP0 Mobile execution and device receipts
        if: always() && inputs.suite == 'mobile-mvp0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-backend-mobile-mvp0-${{ github.sha }}
          path: |
            artifacts/mobile-mvp0/source-sha
            artifacts/mobile-mvp0/profile.json
            artifacts/mobile-mvp0/execution.json
          if-no-files-found: error
          retention-days: 7

      - name: Run opt-in real-backend mobile acceptance
        if: inputs.suite == 'mobile'
        run: node scripts/ci/run-real-backend-mobile.mjs

      - name: Upload sanitized mobile owner and image continuity evidence
        if: always() && inputs.suite == 'mobile'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-backend-mobile-${{ github.sha }}
          path: |
            artifacts/mobile/owners.json
            artifacts/mobile/diagnostics.json
            artifacts/mobile/image-continuity.json
            artifacts/mobile/source-sha
          if-no-files-found: error
          retention-days: 7

      - name: Run MVP-A authorization boundary acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'authz' || inputs.suite == 'all'
        run: bash scripts/ci/run-mvp-a-authz-boundary-acceptance.sh

      - name: Run My Tasks acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'my-tasks' || inputs.suite == 'all'
        run: node tests/ui/run-real-backend-my-tasks.mjs

      - name: Repair test-results ownership before MBJ-01
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj01' || inputs.suite == 'all'
        shell: bash
        run: |
          mkdir -p test-results
          if [[ ! -w test-results ]]; then
            uid="$(id -u)"
            gid="$(id -g)"
            echo "Repairing test-results ownership left by a previous Docker acceptance lane."
            docker run --rm \
              -v "$PWD/test-results:/results" \
              alpine:3.21 \
              sh -c "chown -R ${uid}:${gid} /results"
          fi

      - name: Run MBJ-01 bootstrap acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj01' || inputs.suite == 'all'
        run: bash scripts/ci/run-mbj01-bootstrap-acceptance.sh

      - name: Repair test-results ownership before MBJ-02
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj02' || inputs.suite == 'all'
        shell: bash
        run: |
          mkdir -p test-results
          if [[ ! -w test-results ]]; then
            uid="$(id -u)"
            gid="$(id -g)"
            echo "Repairing test-results ownership left by a previous Docker acceptance lane."
            docker run --rm \
              -v "$PWD/test-results:/results" \
              alpine:3.21 \
              sh -c "chown -R ${uid}:${gid} /results"
          fi

      - name: Run MBJ-02 invite acceptance
        id: mbj02
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj02' || inputs.suite == 'all'
        run: |
          python3 scripts/ci/test-mbj02-trx-receipt.py
          bash scripts/ci/run-mbj02-invite-acceptance.sh

      - name: Validate fixed MBJ-02 PostgreSQL receipt
        id: mbj02-receipt
        if: always() && (steps.mbj02.outcome == 'success' || steps.mbj02.outcome == 'failure')
        run: python3 scripts/ci/mbj02-trx-receipt.py publish --acceptance-outcome '${{ steps.mbj02.outcome }}'

      - name: Upload validated MBJ-02 PostgreSQL receipt
        if: always() && steps.mbj02-receipt.outputs.validated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mbj02-issue527-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/mbj02-issue527/receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Repair test-results ownership before MBJ-03
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj03' || inputs.suite == 'all'
        shell: bash
        run: |
          mkdir -p test-results
          if [[ ! -w test-results ]]; then
            uid="$(id -u)"
            gid="$(id -g)"
            echo "Repairing test-results ownership left by a previous Docker acceptance lane."
            docker run --rm \
              -v "$PWD/test-results:/results" \
              alpine:3.21 \
              sh -c "chown -R ${uid}:${gid} /results"
          fi

      - name: Run MBJ-03 session acceptance
        if: inputs.reuse_main_artifacts == true || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/test/fci04-')) || inputs.suite == 'mbj03' || inputs.suite == 'all'
        run: bash scripts/ci/run-mbj03-session-acceptance.sh

      - name: Verify all four current prebuilt acceptance image receipts
        if: success() && inputs.reuse_main_artifacts == true
        run: python3 scripts/ci/verify-acceptance-image-reuse.py

      - name: Upload prebuilt acceptance image continuity receipts
        if: always() && inputs.reuse_main_artifacts == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-image-reuse-${{ github.sha }}
          path: |
            artifacts/acceptance-image-reuse/mvp-a-authz-image-reuse.json
            artifacts/acceptance-image-reuse/mbj01-image-reuse.json
            artifacts/acceptance-image-reuse/mbj02-image-reuse.json
            artifacts/acceptance-image-reuse/mbj03-image-reuse.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload sanitized FCI-04 owner completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fci04-owner-${{ github.sha }}
          path: artifacts/fci04/fci04-*-owner.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Issue 683 fixed-SHA evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.suite == 'issue683'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-683-real-backend-${{ github.sha }}
          path: issue-683-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized diagnostic artifacts on failure
        if: failure() && inputs.suite != 'mobile' && inputs.suite != 'mobile-mvp0' && inputs.suite != 'roster' && !(github.event_name == 'push' && github.ref == 'refs/heads/test/fci04-ui07-roster-20261027')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licensed-real-backend-${{ inputs.suite || 'main-all' }}-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
