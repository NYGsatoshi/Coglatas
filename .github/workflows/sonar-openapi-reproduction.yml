name: Sonar OpenAPI compiler input reproduction

on:
  pull_request:
    branches: ["ci/sonar-coverage-*"]
    paths:
      - ".github/workflows/sonar-openapi-reproduction.yml"
      - "scripts/ci/*sonar-openapi-reproduction.py"

permissions:
  contents: read

concurrency:
  group: sonar-openapi-reproduction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Deterministic compiler input / XML count ${{ matrix.count }}
    if: github.repository == 'NYGsatoshi/Coglatas' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ci/sonar-coverage-openapi-reproduction-')
    strategy:
      fail-fast: false
      matrix:
        count: [0, 1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PROOF_XML_COUNT: ${{ matrix.count }}
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore the solution without analysis credentials
        run: dotnet restore Coglatas.slnx --verbosity minimal

      - name: Restore repository-pinned EF tooling
        run: dotnet tool restore

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install reporter dependencies
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Test native reproduction controls
        run: python3 -B scripts/ci/test-sonar-openapi-reproduction.py

      - name: Build and capture deterministic output and generated source
        run: python3 -B scripts/ci/verify-sonar-openapi-reproduction.py collect

      - name: Retain exact diagnostic build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-openapi-reproduction-${{ matrix.count }}-${{ github.run_attempt }}
          path: artifacts/sonar-openapi-reproduction/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare exact compiler inputs and generated output
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download only this attempt's diagnostic artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-openapi-reproduction-*-${{ github.run_attempt }}
          path: artifacts/sonar-openapi-inputs

      - name: Compare native binaries and exact generated source changes
        run: python3 -B scripts/ci/verify-sonar-openapi-reproduction.py compare

      - name: Retain diagnostic receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-openapi-reproduction-result-${{ github.run_attempt }}
          path: artifacts/sonar-openapi-reproduction-result.json
          if-no-files-found: error
          retention-days: 7
