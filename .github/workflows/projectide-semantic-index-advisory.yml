name: ProjectIDE Semantic index exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-semantic-index-advisory.yml
      - tests/candidates/projectide-semantic-index/**

permissions:
  contents: read

env:
  PRODUCT_HEAD: df213dd93ccfbba03ac0aa303abd53f4a2bf3c1d
  SOURCE_BLOB: 997a30d5e0f4018982765fcd258eb3db60ea29b0
  RUNNER_BLOB: dad8f0986ab3f34b45371336893dfa5e9cbaa1b9
  CONTROLS_BLOB: eb9ff408c23ddbf3071bcf0e117dd1fc40972691

concurrency:
  group: semantic-index-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-index-ubuntu:
    name: Semantic index independent synthetic composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot use LF checkout policy' }
      - name: Checkout immutable independent Security Test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source blobs and Product SDK policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $case = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index/SecuritySemanticIndexCandidateTests.cs'
          if ($LASTEXITCODE -ne 0 -or $case -ne $env:SOURCE_BLOB) { throw 'Candidate source blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Independent runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Verifier controls blob mismatch' }
          git cat-file -e "$($env:PRODUCT_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Product commit not present' }
          $policy = git show "$($env:PRODUCT_HEAD):global.json"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy absent' }
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
            testHead = $actual
            productHead = $env:PRODUCT_HEAD
            sourceBlob = $case
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_SEMANTIC_INDEX_CORE_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Install exact Product .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ${{ runner.temp }}/semantic-index-qualification-context/global.json
      - name: Install pinned composition Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Run synthetic verifier regression controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-qualification-context'
          $log = Join-Path $context 'admission-controls.log'
          # Revalidate the immutable source and actual worktree before Python imports.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-semantic-index/compose_and_verify.py'; Sha = $env:RUNNER_BLOB },
            @{ Path = 'tests/candidates/projectide-semantic-index/test_compose_and_verify.py'; Sha = $env:CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed script identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working script identity mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); bad=[p for p in root.rglob('*') if p.name.casefold()=='__pycache__' or p.suffix.casefold() in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-semantic-index'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Python bytecode cache is not admitted' }
          python -I -B -c "import runpy,sys; p=sys.argv[1]; sys.argv=[p]; runpy.run_path(p,run_name='__main__')" 'tests/candidates/projectide-semantic-index/test_compose_and_verify.py' *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($controlsExitCode -ne 0) { throw 'Semantic index synthetic verifier controls failed' }
      - name: Run exact independent source and real compiled xUnit controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Revalidate the immutable source and actual worktree before Python imports.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-semantic-index/compose_and_verify.py'; Sha = $env:RUNNER_BLOB },
            @{ Path = 'tests/candidates/projectide-semantic-index/test_compose_and_verify.py'; Sha = $env:CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed script identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working script identity mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; root=Path(sys.argv[1]); bad=[p for p in root.rglob('*') if p.name.casefold()=='__pycache__' or p.suffix.casefold() in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-semantic-index'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Python bytecode cache is not admitted' }
          python -I -B tests/candidates/projectide-semantic-index/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/semantic-index-qualification-product" --evidence "$env:RUNNER_TEMP/semantic-index-qualification-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Semantic index independent synthetic qualification did not complete' }
      - name: Retain original source, TRX and compiled discovery receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-index-qualification-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/semantic-index-qualification-context
            ${{ runner.temp }}/semantic-index-qualification-evidence
          if-no-files-found: error
          retention-days: 7


