name: SBOM Security

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: sbom-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYFT_VERSION: "1.51.0"
  EVIDENCE_REPOSITORY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-sbom:
    name: sbom-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EVIDENCE_REPOSITORY_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Exercise SBOM verifier failure modes
        run: |
          python3 scripts/ci/test_verify_sbom.py
          python3 scripts/ci/test_verify_sbom_vulnerability_gate.py
          python3 scripts/ci/test_verify_grype_sbom_source.py
          python3 scripts/ci/test_audit_sbom_component_inventory.py

      - name: Install pinned Syft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install-syft.sh

      - name: Materialize resolved NuGet lock graphs
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Coglatas.slnx \
            --disable-parallel \
            --verbosity normal \
            --use-lock-file \
            --force-evaluate
          test "$(find src tests -name packages.lock.json -type f | wc -l)" -ge 4 || {
            echo "Expected generated packages.lock.json files for the .NET source graph." >&2
            exit 1
          }

      - name: Prepare leak-detection marker
        shell: bash
        run: |
          marker="SEC09_FAKE_SECRET_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${GITHUB_JOB}"
          printf 'COGLATAS_SBOM_FAKE_SECRET=%s\n' "$marker" >> "$GITHUB_ENV"

      - name: Generate source CycloneDX and SPDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          temp_out="${RUNNER_TEMP}/coglatas-sbom-source"
          final_out="artifacts/sbom/source"
          rm -rf "$temp_out" "$final_out"
          bash scripts/ci/generate-sbom.sh dir "$GITHUB_WORKSPACE" "$temp_out"
          mkdir -p "$final_out"
          cp "$temp_out/sbom.cyclonedx.json" "$temp_out/sbom.spdx.json" "$final_out/"

          python3 scripts/ci/verify_sbom.py validate \
            --cyclonedx "$final_out/sbom.cyclonedx.json" \
            --spdx "$final_out/sbom.spdx.json" \
            --kind source \
            --repository-sha "$EVIDENCE_REPOSITORY_SHA" \
            --run-identity "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}" \
            --syft-version "$SYFT_VERSION" \
            --metadata-out "$final_out/metadata.json" \
            --normalized-out "$final_out/components.normalized.json" \
            --require-package "@playwright/test" \
            --require-package "@angular/core" \
            --require-package "Microsoft.EntityFrameworkCore" \
            --forbid-value "$COGLATAS_SBOM_FAKE_SECRET"

          python3 scripts/ci/verify_sbom.py verify-hashes \
            --metadata "$final_out/metadata.json"

      - name: Upload source SBOM evidence
        uses: actions/upload-artifact@v7
        with:
          name: sbom-source-${{ env.EVIDENCE_REPOSITORY_SHA }}
          path: artifacts/sbom/source
          if-no-files-found: error
          retention-days: 30
