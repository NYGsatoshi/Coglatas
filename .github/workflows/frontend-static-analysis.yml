name: Frontend Static Analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/frontend-static-analysis.yml"
      - "package.json"
      - "package-lock.json"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.css"
      - "**/*.scss"
      - "frontend/**"
      - "tests/**/*.ts"
      - "*.ts"
      - "tools/frontend-inspections/**"
      - "scripts/ci/configure-persistent-caches.sh"
      - "scripts/ci/check-npm-audit-baseline.mjs"
      - "scripts/ci/npm-ci-retry.sh"
  push:
    branches:
      - main

concurrency:
  group: frontend-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-static-analysis:
    name: frontend-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Skip legacy JavaScript frontend static analysis
        shell: bash
        run: |
          {
            echo "### Frontend Static Analysis"
            echo
            echo "SKIPPED: repository-managed ESLint/angular-eslint/Stylelint enforcement is intentionally disabled."
            echo
            echo "The Angular/JavaScript frontend is being retired in favor of the Avalonia migration."
            echo "Do not spend convergence work on legacy JS/TS lint debt."
            echo
            echo "This workflow remains as a stable successful status context and audit marker only."
          } | tee -a "$GITHUB_STEP_SUMMARY"
