name: Real Backend P0 Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/licensed-real-backend-acceptance.yml"
      - ".github/workflows/real-backend-p0-preflight.yml"
      - "infra/compose/test/real-backend-smoke.yml"
      - "package.json"
      - "scripts/ci/build-playwright-grep.mjs"
      - "scripts/ci/functional-compose-harness.sh"
      - "scripts/ci/real-backend-pr-p0-required-tests.txt"
      - "scripts/ci/verify-functional-trust-boundary.sh"
      - "scripts/ci/verify-playwright-required-tests.mjs"
      - "tests/ui/build-playwright-grep.node-test.mjs"
      - "tests/ui/verify-playwright-required-tests.node-test.mjs"
      - "tests/ui/fixed-sha-evidence.mjs"
      - "tests/ui/fixed-sha-evidence.node-test.mjs"
      - "tests/ui/issue-683-race-evidence.mjs"
      - "tests/ui/issue-683-race-evidence.node-test.mjs"
      - "tests/ui/issue-683-race-evidence-reporter.mjs"
      - "tests/ui/run-issue-683-real-backend-evidence.mjs"
      - "tests/ui/real-backend-pr03c-failure-correlation.node-test.mjs"
      - "tests/ui/real-backend-smoke-compose-helpers.mjs"
      - "tests/ui/real-backend-smoke-compose-helpers.node-test.mjs"
      - "tests/ui/real-backend-smoke.spec.ts"
      - "tests/ui/prepare-real-backend-p0-state.mjs"
      - "tests/ui/real-backend-authorization-*"
      - "tests/ui/run-real-backend-p0.mjs"
      - "tests/ui/run-real-backend-fci04.mjs"
      - "tests/functional/**"
      - "playwright.functional.config.ts"
      - "tests/ui/run-real-backend-playwright.mjs"
      - "tests/ui/run-real-backend-smoke-compose.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/licensed-real-backend-acceptance.yml"
      - ".github/workflows/real-backend-p0-preflight.yml"
      - "infra/compose/test/real-backend-smoke.yml"
      - "package.json"
      - "scripts/ci/build-playwright-grep.mjs"
      - "scripts/ci/functional-compose-harness.sh"
      - "scripts/ci/real-backend-pr-p0-required-tests.txt"
      - "scripts/ci/verify-functional-trust-boundary.sh"
      - "scripts/ci/verify-playwright-required-tests.mjs"
      - "tests/ui/build-playwright-grep.node-test.mjs"
      - "tests/ui/verify-playwright-required-tests.node-test.mjs"
      - "tests/ui/fixed-sha-evidence.mjs"
      - "tests/ui/fixed-sha-evidence.node-test.mjs"
      - "tests/ui/issue-683-race-evidence.mjs"
      - "tests/ui/issue-683-race-evidence.node-test.mjs"
      - "tests/ui/issue-683-race-evidence-reporter.mjs"
      - "tests/ui/run-issue-683-real-backend-evidence.mjs"
      - "tests/ui/real-backend-pr03c-failure-correlation.node-test.mjs"
      - "tests/ui/real-backend-smoke-compose-helpers.mjs"
      - "tests/ui/real-backend-smoke-compose-helpers.node-test.mjs"
      - "tests/ui/real-backend-smoke.spec.ts"
      - "tests/ui/prepare-real-backend-p0-state.mjs"
      - "tests/ui/real-backend-authorization-*"
      - "tests/ui/run-real-backend-p0.mjs"
      - "tests/ui/run-real-backend-fci04.mjs"
      - "tests/functional/**"
      - "playwright.functional.config.ts"
      - "tests/ui/run-real-backend-playwright.mjs"
      - "tests/ui/run-real-backend-smoke-compose.mjs"

concurrency:
  group: real-backend-p0-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-backend-p0-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Test P0 manifest and existing real-backend helpers
        run: >-
          node --test
          tests/functional/fci04-owner-reporter.node-test.mjs
          tests/ui/build-playwright-grep.node-test.mjs
          tests/ui/real-backend-smoke-compose-helpers.node-test.mjs
          tests/ui/real-backend-authorization-frame.node-test.mjs
          tests/ui/verify-playwright-required-tests.node-test.mjs
          tests/ui/real-backend-pr03c-failure-correlation.node-test.mjs
          tests/ui/fixed-sha-evidence.node-test.mjs
          tests/ui/issue-683-race-evidence.node-test.mjs

      - name: Check P0 and Functional harness syntax
        shell: bash
        run: |
          bash -n scripts/ci/functional-compose-harness.sh
          bash -n scripts/ci/verify-functional-trust-boundary.sh
          node --check tests/ui/prepare-real-backend-p0-state.mjs
          node --check tests/ui/real-backend-authorization-frame.mjs
          node --check tests/ui/real-backend-smoke-compose-helpers.mjs
          node --check tests/ui/fixed-sha-evidence.mjs
          node --check tests/ui/issue-683-race-evidence.mjs
          node --check tests/ui/issue-683-race-evidence-reporter.mjs
          node --check tests/ui/run-issue-683-real-backend-evidence.mjs
          node --check tests/ui/run-real-backend-fci04.mjs
          node --check tests/functional/fixtures/fci04-owner-reporter.mjs
          node --check tests/ui/run-real-backend-p0.mjs
          node --check tests/ui/run-real-backend-playwright.mjs
          node --check tests/ui/run-real-backend-smoke-compose.mjs

      - name: Test deterministic Functional harness contract
        run: bash scripts/ci/functional-compose-harness.sh --self-test

      - name: Verify protected Functional license trust boundary
        run: bash scripts/ci/verify-functional-trust-boundary.sh .github/workflows/licensed-real-backend-acceptance.yml

      - name: Verify required P0 test titles still exist
        shell: bash
        run: |
          grep_pattern="$(node scripts/ci/build-playwright-grep.mjs \
            scripts/ci/real-backend-pr-p0-required-tests.txt \
            --verify tests/ui/real-backend-smoke.spec.ts)"
          test -n "$grep_pattern"
          {
            echo "### Real backend P0 preflight"
            echo
            echo "- Required manifest: \`scripts/ci/real-backend-pr-p0-required-tests.txt\`"
            echo "- Manifest titles verified against the real-backend Playwright spec"
            echo "- Focused grep generated successfully"
            echo "- Required JUnit result verifier unit-tested"
            echo "- Issue #683 detached fixed-SHA/retry/race-observation policy unit-tested"
            echo "- Functional Compose isolation, fixture-profile, redaction, cleanup-command, and failure-classification invariants self-tested"
            echo "- Protected Syncfusion license lane verified as push/dispatch-only with exact-SHA checkout"
            echo "- Existing P0 JavaScript and Functional shell syntax checked"
          } >> "$GITHUB_STEP_SUMMARY"
