name: Release Supply Chain

on:
  release:
    types: [published]

concurrency:
  group: release-supply-chain-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  COSIGN_VERSION: "3.1.3"
  SYFT_VERSION: "1.51.0"

jobs:
  publish-release-image:
    name: sec11-publish-digest-bound-image
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      subject: ${{ steps.publish.outputs.subject }}
      subject_digest: ${{ steps.publish.outputs.subject_digest }}
      staging_ref: ${{ steps.publish.outputs.staging_ref }}

    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: plain

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release context
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${RELEASE_TAG}"
          [[ "$GITHUB_REF" == "$expected_ref" ]] || {
            echo "Release ref mismatch: expected $expected_ref, got $GITHUB_REF" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Release tag is not a valid OCI tag: $RELEASE_TAG" >&2
            exit 1
          }
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release tag did not resolve to a commit SHA." >&2
            exit 1
          }
          [[ "$GITHUB_SHA" == "$release_sha" ]] || {
            echo "GitHub release event SHA does not match the checked out tag commit." >&2
            exit 1
          }
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Install pinned Syft
        run: bash scripts/ci/install-syft.sh

      - name: Prepare SBOM leak-detection marker
        shell: bash
        run: |
          marker="SEC11_FAKE_SECRET_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${GITHUB_JOB}"
          printf 'COGLATAS_SEC11_FAKE_SECRET=%s\n' "$marker" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build licensed release image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
            exit 1
          }
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          staging_ref="${image_repository}:sec11-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          chmod 600 "$license_file"
          printf '%s' "$SYNCFUSION_LICENSE" > "$license_file"
          docker build \
            --pull \
            --progress=plain \
            --secret id=syncfusion_license,src="$license_file" \
            --tag "$staging_ref" \
            .
          printf 'staging_ref=%s\n' "$staging_ref" >> "$GITHUB_OUTPUT"

      - name: Push and bind the final registry digest
        id: publish
        shell: bash
        env:
          STAGING_REF: ${{ steps.build.outputs.staging_ref }}
        run: |
          set -euo pipefail
          docker push "$STAGING_REF"
          docker pull "$STAGING_REF" >/dev/null
          image_repository="${STAGING_REF%%:*}"
          subject="$(
            docker image inspect "$STAGING_REF" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              awk -v prefix="${image_repository}@" 'index($0, prefix) == 1 { print; exit }'
          )"
          [[ "$subject" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "Push did not resolve to an immutable GHCR sha256 subject: $subject" >&2
            exit 1
          }
          subject_digest="${subject#*@}"
          docker pull "$subject" >/dev/null
          docker image inspect "$subject" >/dev/null

          mkdir -p artifacts/release
          printf '%s\n' "$subject" > artifacts/release/subject.txt
          printf '%s\n' "$subject_digest" > artifacts/release/image.digest
          printf '%s\n' "$STAGING_REF" > artifacts/release/staging-ref.txt
          printf '%s\n' "${{ steps.release.outputs.release_sha }}" > artifacts/release/repository.sha

          printf 'subject=%s\n' "$subject" >> "$GITHUB_OUTPUT"
          printf 'subject_digest=%s\n' "$subject_digest" >> "$GITHUB_OUTPUT"
          printf 'staging_ref=%s\n' "$STAGING_REF" >> "$GITHUB_OUTPUT"

      - name: Verify runtime image hygiene
        shell: bash
        env:
          SUBJECT: ${{ steps.publish.outputs.subject }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$SUBJECT" -c '
            test -s /app/Coglatas.Web.dll &&
            test -s /app/Coglatas.Web.deps.json &&
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE=" &&
            ! find /app -type f \( -name ".env" -o -name ".env.*" -o -name "syncfusion-license.txt" \) -print -quit | grep -q .
          '

      - name: Generate registry-digest SBOMs
        shell: bash
        env:
          SUBJECT: ${{ steps.publish.outputs.subject }}
          SUBJECT_DIGEST: ${{ steps.publish.outputs.subject_digest }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/coglatas-sec11-sbom-first"
          second="${RUNNER_TEMP}/coglatas-sec11-sbom-second"
          final_out="artifacts/release"
          rm -rf "$first" "$second"

          bash scripts/ci/generate-sbom.sh registry "$SUBJECT" "$first"
          cp "$first/sbom.cyclonedx.json" "$first/sbom.spdx.json" "$final_out/"

          python3 scripts/ci/verify_sbom.py validate \
            --cyclonedx "$final_out/sbom.cyclonedx.json" \
            --spdx "$final_out/sbom.spdx.json" \
            --kind image \
            --repository-sha "$RELEASE_SHA" \
            --run-identity "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}" \
            --syft-version "$SYFT_VERSION" \
            --identity-digest "$SUBJECT_DIGEST" \
            --metadata-out "$final_out/metadata.json" \
            --normalized-out "$final_out/components.normalized.json" \
            --require-package "curl" \
            --forbid-value "$COGLATAS_SEC11_FAKE_SECRET" \
            --forbid-value "$SYNCFUSION_LICENSE"

          python3 scripts/ci/verify_sbom.py verify-hashes \
            --metadata "$final_out/metadata.json"

          python3 scripts/ci/audit_sbom_component_inventory.py \
            --sbom "$final_out/sbom.cyclonedx.json" \
            --out "$final_out/component-inventory-warnings.json"

          bash scripts/ci/generate-sbom.sh registry "$SUBJECT" "$second"
          python3 scripts/ci/verify_sbom.py validate \
            --cyclonedx "$second/sbom.cyclonedx.json" \
            --spdx "$second/sbom.spdx.json" \
            --kind image \
            --repository-sha "$RELEASE_SHA" \
            --run-identity "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/repeat" \
            --syft-version "$SYFT_VERSION" \
            --identity-digest "$SUBJECT_DIGEST" \
            --metadata-out "$second/metadata.json" \
            --normalized-out "$second/components.normalized.json" \
            --require-package "curl" \
            --forbid-value "$COGLATAS_SEC11_FAKE_SECRET" \
            --forbid-value "$SYNCFUSION_LICENSE"

          cmp --silent "$final_out/components.normalized.json" "$second/components.normalized.json" || {
            echo "Same immutable registry subject produced a different normalized SBOM projection." >&2
            diff -u "$final_out/components.normalized.json" "$second/components.normalized.json" || true
            exit 1
          }

      - name: Upload digest-bound release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec11-release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 90

      - name: Remove local release image
        if: always()
        shell: bash
        env:
          STAGING_REF: ${{ steps.build.outputs.staging_ref }}
        run: docker image rm --force "$STAGING_REF" || true

  sign-release-subject:
    name: sec11-keyless-sign-and-attest
    needs: publish-release-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download digest-bound release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec11-release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release

      - name: Install checksum-pinned Cosign
        run: bash scripts/ci/install-cosign.sh

      - name: Authenticate to GHCR for signature publication
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build digest-bound provenance and signing evidence
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.publish-release-image.outputs.release_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$RELEASE_SHA" ]] || {
            echo "Signing job SHA diverged from the release artifact commit." >&2
            exit 1
          }
          python3 scripts/ci/release_supply_chain.py build-evidence \
            --subject-file artifacts/release/subject.txt \
            --sbom-metadata artifacts/release/metadata.json \
            --cyclonedx artifacts/release/sbom.cyclonedx.json \
            --spdx artifacts/release/sbom.spdx.json \
            --repository "$GITHUB_REPOSITORY" \
            --repository-sha "$RELEASE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --github-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --cosign-version "$COSIGN_VERSION" \
            --out-dir artifacts/release

      - name: Keyless sign immutable subject
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
        run: |
          set -euo pipefail
          test "$(cat artifacts/release/subject.txt)" = "$SUBJECT"
          cosign sign --yes "$SUBJECT"

      - name: Attest CycloneDX SBOM
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type cyclonedx \
            --predicate artifacts/release/sbom.cyclonedx.json \
            "$SUBJECT"

      - name: Attest SPDX JSON SBOM
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type spdxjson \
            --predicate artifacts/release/sbom.spdx.json \
            "$SUBJECT"

      - name: Attest SLSA v1 provenance
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
        run: |
          set -euo pipefail
          cosign attest --yes \
            --type slsaprovenance1 \
            --predicate artifacts/release/provenance.json \
            "$SUBJECT"

      - name: Upload exact signed predicates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec11-signed-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 90

  verify-release-subject:
    name: sec11-independent-release-verification
    needs:
      - publish-release-image
      - sign-release-subject
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download original publish-job release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec11-release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-original

      - name: Download exact signed predicates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sec11-signed-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release

      - name: Prove signed inputs match publish-job originals
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            subject.txt \
            image.digest \
            staging-ref.txt \
            repository.sha \
            metadata.json \
            sbom.cyclonedx.json \
            sbom.spdx.json \
            components.normalized.json \
            component-inventory-warnings.json
          do
            cmp --silent "artifacts/release-original/$file" "artifacts/release/$file" || {
              echo "Signing handoff changed publish-job artifact: $file" >&2
              exit 1
            }
          done

      - name: Install checksum-pinned Cosign
        run: bash scripts/ci/install-cosign.sh

      - name: Authenticate to GHCR read path
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Revalidate immutable evidence and mutable staging tag
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
          STAGING_REF: ${{ needs.publish-release-image.outputs.staging_ref }}
        run: |
          set -euo pipefail
          python3 scripts/ci/release_supply_chain.py verify-evidence \
            --evidence artifacts/release/release-signing-evidence.json
          test "$(cat artifacts/release/subject.txt)" = "$SUBJECT"
          test "$(cat artifacts/release/staging-ref.txt)" = "$STAGING_REF"

          docker pull "$STAGING_REF" >/dev/null
          image_repository="${STAGING_REF%%:*}"
          resolved="$(
            docker image inspect "$STAGING_REF" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              awk -v prefix="${image_repository}@" 'index($0, prefix) == 1 { print; exit }'
          )"
          [[ "$resolved" == "$SUBJECT" ]] || {
            echo "Mutable staging tag moved after signing: expected $SUBJECT, got $resolved" >&2
            exit 1
          }
          mkdir -p artifacts/release/results
          printf 'verified\n' > artifacts/release/results/mutable-tag.txt

      - name: Build exact-attestation verification policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release/policies
          python3 scripts/ci/release_supply_chain.py write-policy \
            --evidence artifacts/release/release-signing-evidence.json \
            --predicate artifacts/release/sbom.cyclonedx.json \
            --predicate-type cyclonedx \
            --output artifacts/release/policies/cyclonedx.rego
          python3 scripts/ci/release_supply_chain.py write-policy \
            --evidence artifacts/release/release-signing-evidence.json \
            --predicate artifacts/release/sbom.spdx.json \
            --predicate-type spdxjson \
            --output artifacts/release/policies/spdx.rego
          python3 scripts/ci/release_supply_chain.py write-policy \
            --evidence artifacts/release/release-signing-evidence.json \
            --predicate artifacts/release/provenance.json \
            --predicate-type slsaprovenance1 \
            --output artifacts/release/policies/provenance.rego

      - name: Verify keyless signature identity
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
          RELEASE_SHA: ${{ needs.publish-release-image.outputs.release_sha }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          mkdir -p artifacts/release/verification-output artifacts/release/results
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-sha "$RELEASE_SHA" \
            --certificate-github-workflow-trigger "release" \
            "$SUBJECT" > artifacts/release/verification-output/signature.json
          test -s artifacts/release/verification-output/signature.json
          printf 'verified\n' > artifacts/release/results/signature.txt

      - name: Verify exact SBOM and provenance attestations
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
          RELEASE_SHA: ${{ needs.publish-release-image.outputs.release_sha }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          common=(
            --certificate-identity "$identity"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-ref "$GITHUB_REF"
            --certificate-github-workflow-sha "$RELEASE_SHA"
            --certificate-github-workflow-trigger "release"
          )
          mkdir -p artifacts/release/verification-output artifacts/release/results

          cosign verify-attestation \
            "${common[@]}" \
            --type cyclonedx \
            --policy artifacts/release/policies/cyclonedx.rego \
            "$SUBJECT" > artifacts/release/verification-output/cyclonedx.json
          test -s artifacts/release/verification-output/cyclonedx.json
          printf 'verified\n' > artifacts/release/results/cyclonedx.txt

          cosign verify-attestation \
            "${common[@]}" \
            --type spdxjson \
            --policy artifacts/release/policies/spdx.rego \
            "$SUBJECT" > artifacts/release/verification-output/spdx.json
          test -s artifacts/release/verification-output/spdx.json
          printf 'verified\n' > artifacts/release/results/spdx.txt

          cosign verify-attestation \
            "${common[@]}" \
            --type slsaprovenance1 \
            --policy artifacts/release/policies/provenance.rego \
            "$SUBJECT" > artifacts/release/verification-output/provenance.json
          test -s artifacts/release/verification-output/provenance.json
          printf 'verified\n' > artifacts/release/results/provenance.txt

      - name: Emit immutable verification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_supply_chain.py finalize \
            --evidence artifacts/release/release-signing-evidence.json \
            --signature-result artifacts/release/results/signature.txt \
            --cyclonedx-result artifacts/release/results/cyclonedx.txt \
            --spdx-result artifacts/release/results/spdx.txt \
            --provenance-result artifacts/release/results/provenance.txt \
            --mutable-tag-result artifacts/release/results/mutable-tag.txt \
            --output artifacts/release/release-verification.json

      - name: Upload release verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec11-release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release/subject.txt
            artifacts/release/image.digest
            artifacts/release/repository.sha
            artifacts/release/metadata.json
            artifacts/release/sbom.cyclonedx.json
            artifacts/release/sbom.spdx.json
            artifacts/release/provenance.json
            artifacts/release/release-signing-evidence.json
            artifacts/release/release-verification.json
            artifacts/release/verification-output
            artifacts/release/results
          if-no-files-found: error
          retention-days: 90

  promote-release-tag:
    name: sec11-promote-only-after-verification
    needs:
      - publish-release-image
      - verify-release-subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Authenticate to GHCR promotion path
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Promote verified digest to release tag
        shell: bash
        env:
          SUBJECT: ${{ needs.publish-release-image.outputs.subject }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
            echo "Release tag is not a valid OCI tag: $RELEASE_TAG" >&2
            exit 1
          }
          image_repository="${SUBJECT%@*}"
          release_ref="${image_repository}:${RELEASE_TAG}"

          docker pull "$SUBJECT" >/dev/null
          docker tag "$SUBJECT" "$release_ref"
          docker push "$release_ref" >/dev/null
          docker pull "$release_ref" >/dev/null

          resolved="$(
            docker image inspect "$release_ref" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              awk -v prefix="${image_repository}@" 'index($0, prefix) == 1 { print; exit }'
          )"
          [[ "$resolved" == "$SUBJECT" ]] || {
            echo "Promoted release tag does not resolve to the verified digest." >&2
            exit 1
          }

          mkdir -p artifacts/promotion
          printf '%s\n' "$release_ref" > artifacts/promotion/release-ref.txt
          printf '%s\n' "$SUBJECT" > artifacts/promotion/subject.txt

      - name: Upload promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec11-release-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/promotion
          if-no-files-found: error
          retention-days: 90
