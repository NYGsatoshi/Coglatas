name: Release Supply Chain Contract

on:
  pull_request:
    paths:
      - ".github/workflows/release-supply-chain.yml"
      - ".github/workflows/release-supply-chain-contract.yml"
      - "scripts/ci/generate-sbom.sh"
      - "scripts/ci/install-cosign.sh"
      - "scripts/ci/release_supply_chain.py"
      - "scripts/ci/release_assurance_advisory.py"
      - "scripts/ci/release_image_graph.py"
      - "scripts/ci/sec14_browser_evidence.py"
      - "scripts/ci/sec14_main_security_evidence.py"
      - "scripts/security/sec14-browser-fixture*"
      - "scripts/security/run-sec14-browser-fixture.mjs"
      - "tests/ci/test_release_browser_evidence.py"
      - "tests/ci/test_release_browser_attachment.py"
      - "tests/ci/test_release_main_security_evidence.py"
      - "tests/ci/sec14-browser-launcher.test.mjs"
      - "scripts/ci/verify_sbom_vulnerability_gate.py"
      - "scripts/ci/verify_grype_sbom_source.py"
      - "tests/ci/test_release_assurance_advisory.py"
      - "tests/ci/test_release_image_graph.py"
      - "tests/ci/release_image_fixture.py"
      - "tests/ci/test_release_supply_chain.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-supply-chain.yml"
      - ".github/workflows/release-supply-chain-contract.yml"
      - "scripts/ci/generate-sbom.sh"
      - "scripts/ci/install-cosign.sh"
      - "scripts/ci/release_supply_chain.py"
      - "scripts/ci/release_assurance_advisory.py"
      - "scripts/ci/release_image_graph.py"
      - "scripts/ci/sec14_browser_evidence.py"
      - "scripts/ci/sec14_main_security_evidence.py"
      - "scripts/security/sec14-browser-fixture*"
      - "scripts/security/run-sec14-browser-fixture.mjs"
      - "tests/ci/test_release_browser_evidence.py"
      - "tests/ci/test_release_browser_attachment.py"
      - "tests/ci/test_release_main_security_evidence.py"
      - "tests/ci/sec14-browser-launcher.test.mjs"
      - "scripts/ci/verify_sbom_vulnerability_gate.py"
      - "scripts/ci/verify_grype_sbom_source.py"
      - "tests/ci/test_release_assurance_advisory.py"
      - "tests/ci/test_release_image_graph.py"
      - "tests/ci/release_image_fixture.py"
      - "tests/ci/test_release_supply_chain.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec11-contract:
    name: sec11-release-supply-chain-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate SEC-11 scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/install-cosign.sh
          bash -n scripts/ci/generate-sbom.sh
          python3 -m py_compile scripts/ci/release_supply_chain.py
          python3 -m py_compile scripts/ci/release_assurance_advisory.py
          python3 -m py_compile scripts/ci/release_image_graph.py
          python3 -m py_compile scripts/ci/sec14_browser_evidence.py
          python3 -m py_compile scripts/ci/sec14_main_security_evidence.py
          python3 -m py_compile scripts/security/sec14-browser-fixture.py
          bash -n scripts/security/sec14-browser-fixture-run.sh
          node --check scripts/security/run-sec14-browser-fixture.mjs
          node --test tests/ci/sec14-browser-launcher.test.mjs

      - name: Run SEC-11 fail-closed contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover(
              "tests/ci", pattern="test_release*.py"
          )
          for pattern in (
              "test_verify_sbom.py", "test_verify_sbom_vulnerability_gate.py",
              "test_verify_grype_sbom_source.py", "test_audit_sbom_component_inventory.py",
          ):
              native = unittest.TestLoader().discover("scripts/ci", pattern=pattern)
              if native.countTestCases() == 0:
                  raise SystemExit("SEC-09/10 contract collected zero native tests")
              suite.addTests(native)
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("SEC-11 contract collected zero tests")
          print(f"SEC-11 contract collected {count} tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
