name: Sonar Angular sharding qualification

on:
  pull_request:
    branches: ["ci/sonar-coverage-*"]
    paths:
      - ".github/workflows/sonar-angular-shard-proof.yml"
      - "scripts/ci/*sonar-angular-coverage.py"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: sonar-angular-shard-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    name: Angular native coverage proof / ${{ matrix.lane }}
    if: github.repository == 'NYGsatoshi/Coglatas' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ci/sonar-coverage-angular-sharding-')
    strategy:
      fail-fast: false
      matrix:
        lane: [baseline, shard-1, shard-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository frontend Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install pinned frontend package manager
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install frontend dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install existing reporter dependencies without analysis credentials
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Test the qualification parser
        run: python3 -B scripts/ci/test-sonar-angular-coverage.py

      - name: Run original Angular coverage command with native test-result reporter
        env:
          PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_LANE: ${{ matrix.lane }}
        run: python3 -B scripts/ci/verify-sonar-angular-coverage.py collect --lane "$PROOF_LANE"

      - name: Retain original Angular test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-angular-shard-proof-${{ matrix.lane }}-${{ github.run_attempt }}
          path: artifacts/sonar-angular-proof/
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Require identical Angular tests and LCOV hit states
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all original Angular lanes from this attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-angular-shard-proof-*-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-proof

      - name: Validate source identity and compare native results
        env:
          PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci/verify-sonar-angular-coverage.py compare

      - name: Retain Angular equivalence receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-angular-shard-equivalence-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-equivalence.json
          if-no-files-found: error
          retention-days: 7

  canonical:
    name: Verify full unsharded Angular admission against qualified native union
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download original full native Angular execution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-angular-shard-proof-baseline-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-proof/sonar-angular-shard-proof-baseline-${{ github.run_attempt }}

      - name: Download exact full equivalence receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-angular-shard-equivalence-${{ github.run_attempt }}
          path: artifacts/sonar-angular-full-receipt

      - name: Admit original unsharded native coverage
        env:
          PROOF_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B scripts/ci/verify-sonar-angular-coverage.py compare --mode baseline-only

      - name: Require exact canonical admission and full proof receipt agreement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          full = json.loads(Path("artifacts/sonar-angular-full-receipt/sonar-angular-shard-equivalence.json").read_bytes())
          canonical = json.loads(Path("artifacts/sonar-angular-shard-equivalence.json").read_bytes())
          keys = ("sourceSha", "treeSha", "runId", "attempt", "workspace", "inputs",
                  "passedTests", "specFiles", "coverageFiles", "linePoints", "lineVisited",
                  "branchPoints", "branchVisited")
          if (full["mode"] != "full" or full["baselineCompared"] is not True
                  or canonical["mode"] != "baseline-only" or canonical["baselineCompared"] is not False
                  or set(canonical["lanes"]) != {"baseline"}
                  or full["lanes"]["baseline"] != canonical["lanes"]["baseline"]
                  or any(full[key] != canonical[key] for key in keys)):
              raise SystemExit("Canonical Angular admission differs from full native proof")
          PY

      - name: Retain original unsharded admission receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonar-angular-canonical-admission-${{ github.run_attempt }}
          path: artifacts/sonar-angular-shard-equivalence.json
          if-no-files-found: error
          retention-days: 7
