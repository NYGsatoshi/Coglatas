      - test/fci04-ui07-roster-20261027

permissions:
  contents: read

jobs:
  readonly-roster:
    # This trusted qualification ref also runs the callee's canonical FCI-04
    # Fast/Full controls. It never lends its protected environment to a PR.
    uses: ./.github/workflows/licensed-real-backend-acceptance.yml
    with:
      suite: roster
