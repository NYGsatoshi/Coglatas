name: External PR review signal

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  signal:
    name: External PR review signal
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit PR head-change signal
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$pr_number" ]]; then
            echo "No pull request number was present in the event payload." >&2
            exit 1
          fi
          echo "PR head/state changed for #$pr_number."
          echo "The trusted default-branch evaluator will re-read the authoritative PR head through the GitHub API."
