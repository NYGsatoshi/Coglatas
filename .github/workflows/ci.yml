name: PR CI

on:
  pull_request: # Required checks: intentionally unfiltered.

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: CI preflight + route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.route.outputs.backend }}
      backend_ef: ${{ steps.route.outputs.backend_ef }}
      backend_tests: ${{ steps.route.outputs.backend_tests }}
      backend_pr07b: ${{ steps.route.outputs.backend_pr07b }}
      backend_pr07c: ${{ steps.route.outputs.backend_pr07c }}
      backend_pr07d: ${{ steps.route.outputs.backend_pr07d }}
      backend_test_scope: ${{ steps.route.outputs.backend_test_scope }}
      backend_test_filter: ${{ steps.route.outputs.backend_test_filter }}
      frontend: ${{ steps.route.outputs.frontend }}
      frontend_build: ${{ steps.route.outputs.frontend_build }}
      frontend_unit: ${{ steps.route.outputs.frontend_unit }}
      frontend_unit_scope: ${{ steps.route.outputs.frontend_unit_scope }}
      frontend_unit_features: ${{ steps.route.outputs.frontend_unit_features }}
      frontend_architecture: ${{ steps.route.outputs.frontend_architecture }}
      frontend_license_guard: ${{ steps.route.outputs.frontend_license_guard }}
      frontend_storybook: ${{ steps.route.outputs.frontend_storybook }}
      frontend_playwright: ${{ steps.route.outputs.frontend_playwright }}
      avmig_contract: ${{ steps.route.outputs.avmig_contract }}
      avmig_selftests: ${{ steps.route.outputs.avmig_selftests }}
      security: ${{ steps.route.outputs.security }}
      security_dotnet: ${{ steps.route.outputs.security_dotnet }}
      security_compose: ${{ steps.route.outputs.security_compose }}
      security_migration: ${{ steps.route.outputs.security_migration }}
      security_image: ${{ steps.route.outputs.security_image }}
      functional: ${{ steps.route.outputs.functional }}
      functional_reason: ${{ steps.route.outputs.functional_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public-workflow trust boundary
        run: python3 scripts/ci/check-publication-readiness.py

      - name: Enforce required PR check topology
        run: python3 scripts/ci/check-required-pr-checks.py

      - name: Test required-check topology parser
        run: python3 scripts/ci/test-required-pr-checks.py

      - name: Test ReSharper SARIF changed-path normalization
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          module_path = Path("scripts/quality/check-resharper-pr-sarif.py")
          spec = importlib.util.spec_from_file_location("resharper_sarif_gate", module_path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with tempfile.TemporaryDirectory() as directory:
              changed = Path(directory) / "changed.nul"
              changed.write_bytes(b".config/Foo.cs\0./src/Bar.cs\0")
              assert module.read_changed_files(changed) == {".config/Foo.cs", "src/Bar.cs"}
          PY

      - name: Validate CI helper syntax
        run: |
          bash -n scripts/ci/parallel-lane-lib.sh
          bash -n scripts/ci/run-frontend-parallel.sh
          bash -n scripts/ci/run-security-runtime-parallel.sh
          bash -n scripts/ci/restore-main-build-artifacts.sh
          bash -n scripts/performance/with-environment.sh
          node --check tests/ui/run-real-backend-smoke-compose.mjs

      - name: Enforce Coglatas rename completion
        run: python3 scripts/ci/check-coglatas-rename.py

      - name: Route changed files once
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before || '') }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/route-main-ci-changes.sh

  dotnet-build:
    name: .NET build producer
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      built: ${{ steps.scope.outputs.built }}
      backend: ${{ needs.changes.outputs.backend }}
      backend_ef: ${{ needs.changes.outputs.backend_ef }}
      backend_tests: ${{ needs.changes.outputs.backend_tests }}
      backend_test_scope: ${{ needs.changes.outputs.backend_test_scope }}
      backend_test_filter: ${{ needs.changes.outputs.backend_test_filter }}
      avmig_contract: ${{ needs.changes.outputs.avmig_contract }}
      avmig_selftests: ${{ needs.changes.outputs.avmig_selftests }}
      security: ${{ needs.changes.outputs.security }}
      security_dotnet: ${{ needs.changes.outputs.security_dotnet }}
      security_compose: ${{ needs.changes.outputs.security_compose }}
      security_migration: ${{ needs.changes.outputs.security_migration }}
      security_image: ${{ needs.changes.outputs.security_image }}

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve shared build requirement
        id: scope
        shell: bash
        env:
          ROUTE_BACKEND: ${{ needs.changes.outputs.backend }}
          ROUTE_AVMIG_CONTRACT: ${{ needs.changes.outputs.avmig_contract }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "$ROUTE_BACKEND" == "true" || "$ROUTE_AVMIG_CONTRACT" == "true" ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip shared .NET build for unrelated PR
        if: steps.scope.outputs.built != 'true'
        run: echo "No backend-relevant changes detected; shared .NET build is not required."

      - name: Set up .NET SDK
        if: steps.scope.outputs.built == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore authoritative .NET graph
        if: steps.scope.outputs.built == 'true'
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity normal

      - name: Build authoritative .NET graph
        if: steps.scope.outputs.built == 'true'
        run: dotnet build Coglatas.slnx --configuration Release --no-restore --disable-build-servers -m:1

      - name: Package shared .NET build outputs
        if: steps.scope.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/dotnet-build-sha

          mapfile -d '' build_dirs < <(
            find src tests -type d \
              \( -path '*/bin/Release' -o -name obj \) \
              -print0
          )
          if [[ "${#build_dirs[@]}" -eq 0 ]]; then
            echo "::error::Authoritative build completed without reusable bin/obj outputs."
            exit 1
          fi

          tar -cf "$RUNNER_TEMP/dotnet-release-build.tar" \
            artifacts/ci/dotnet-build-sha \
            "${build_dirs[@]}"

          du -h "$RUNNER_TEMP/dotnet-release-build.tar"

      - name: Publish shared .NET build artifact
        if: steps.scope.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-release-build
          path: ${{ runner.temp }}/dotnet-release-build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Generate PR security OpenAPI from shared build
        if: needs.changes.outputs.avmig_contract == 'true'
        shell: bash
        run: bash scripts/ci/generate-security-openapi-from-prebuilt.sh

      - name: Package PR security OpenAPI build output
        if: github.event_name == 'pull_request' && needs.changes.outputs.avmig_contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/openapi/coglatas-openapi.json
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/security-openapi-sha
          tar -cf "$RUNNER_TEMP/security-openapi-build.tar" \
            artifacts/ci/security-openapi-sha \
            artifacts/openapi/coglatas-openapi.json
          du -h "$RUNNER_TEMP/security-openapi-build.tar"

      - name: Publish PR security OpenAPI build artifact
        if: github.event_name == 'pull_request' && needs.changes.outputs.avmig_contract == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-openapi-build
          path: ${{ runner.temp }}/security-openapi-build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  functional-runtime:
    name: PR Functional runtime from shared artifacts
    needs: [changes, dotnet-build, frontend-build]
    if: needs.changes.outputs.functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested PR merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Download shared .NET build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-release-build
          path: ${{ runner.temp }}/functional-inputs
      - name: Download shared frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build-artifacts
          path: ${{ runner.temp }}/functional-inputs
      - name: Assemble Test runtime without rebuilding either application
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/package-pr-functional-runtime.sh "$RUNNER_TEMP/functional-inputs" "$RUNNER_TEMP/pr-functional-runtime"
      - name: Upload same-run Functional runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-functional-runtime
          path: ${{ runner.temp }}/pr-functional-runtime
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  functional-run:
    name: PR Fast Functional domains
    permissions:
      contents: read
      actions: read
    needs: [changes, functional-runtime]
    if: needs.changes.outputs.functional == 'true'
    uses: ./.github/workflows/functional-validation.yml
    with:
      gate: functional-fast
      artifact_name: pr-functional-runtime

  functional-fast:
    name: functional-fast
    needs: [changes, functional-runtime, functional-run]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce selected Functional evidence or explicit exemption
        env:
          ROUTE_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.functional }}
          ROUTING_REASON: ${{ needs.changes.outputs.functional_reason }}
          RUNTIME_RESULT: ${{ needs.functional-runtime.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional-run.result }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$ROUTE_RESULT" = success
          echo "PR head: $PR_HEAD_SHA; tested merge revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Functional routing: $ROUTING_REASON" >> "$GITHUB_STEP_SUMMARY"
          case "$REQUIRED" in
            true)
              test "$RUNTIME_RESULT" = success
              test "$FUNCTIONAL_RESULT" = success
              ;;
            false)
              test "$ROUTING_REASON" = validated-documentation-only
              test "$RUNTIME_RESULT" = skipped
              test "$FUNCTIONAL_RESULT" = skipped
              echo "NOT_APPLICABLE: validated documentation-only change" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit 1 ;;
          esac

  build-test:
    name: build-test
    if: ${{ always() }}
    needs: dotnet-build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coglatas_ci
          POSTGRES_USER: coglatas_ci
          POSTGRES_PASSWORD: coglatas_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coglatas_ci -d coglatas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Test
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_MULTILEVEL_LOOKUP: "0"
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "1"
      # Provider tests that only need the latest schema clone one migrated template
      # instead of replaying the full EF migration chain for every isolated database.
      COGLATAS_TEST_USE_MIGRATED_TEMPLATE: "true"
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=coglatas_ci;Username=coglatas_ci;Password=coglatas_ci_password

    steps:
      - name: Require successful build producer
        env:
          PRODUCER_RESULT: ${{ needs.dotnet-build.result }}
        run: test "$PRODUCER_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip backend checks for unrelated PR
        if: github.event_name == 'pull_request' && needs.dotnet-build.outputs.backend != 'true'
        run: echo "No backend-relevant changes detected; build-test passes without running the backend suite."

      - name: Set up .NET SDK
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Download shared .NET build artifact
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-release-build
          path: ${{ runner.temp }}/dotnet-build-artifact

      - name: Restore shared .NET build outputs
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dotnet-build-artifact/dotnet-release-build.tar"
          [[ -f "$archive" ]] || {
            echo "::error::Shared .NET build artifact is missing."
            exit 1
          }

          tar -xf "$archive" -C "$GITHUB_WORKSPACE"

          expected="$(git rev-parse HEAD)"
          stamp="artifacts/ci/dotnet-build-sha"
          [[ -f "$stamp" ]] || {
            echo "::error::Shared .NET build artifact is missing its SHA stamp."
            exit 1
          }
          actual="$(tr -d '\r\n' < "$stamp")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Shared .NET build artifact SHA $actual does not match test revision $expected."
            exit 1
          fi

      - name: Restore NuGet packages for consumer tools
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend == 'true'
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity minimal

      - name: Restore .NET tools
        # PR tests no longer collect coverage. Tools are needed on PR only for EF;
        # main/manual still need ReportGenerator for the full coverage artifact.
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_ef == 'true'
        run: dotnet tool restore

      - name: Apply PostgreSQL migrations
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_ef == 'true'
        run: dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web --configuration Release --no-build

      - name: Reject pending EF Core model changes
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_ef == 'true'
        run: dotnet ef migrations has-pending-model-changes --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web --configuration Release --no-build

      - name: Test
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_tests == 'true'
        shell: bash
        env:
          BACKEND_TEST_SCOPE: ${{ needs.dotnet-build.outputs.backend_test_scope }}
          BACKEND_TEST_FILTER: ${{ needs.dotnet-build.outputs.backend_test_filter }}
        run: |
          set -euo pipefail
          common_args=(
            --configuration Release
            --no-build
            --no-restore
            --disable-build-servers
            -m:1
            --verbosity normal
          )

          # Coverage is evidence collected from the authoritative full main/manual
          # regression. PRs keep correctness coverage through the same tests without
          # paying per-test coverage instrumentation cost.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            common_args+=(--collect "XPlat Code Coverage")
          fi

          rm -rf artifacts/test-results
          mkdir -p artifacts/test-results/backend artifacts/test-results/architecture

          if [[ "$BACKEND_TEST_SCOPE" == "scoped" && -n "$BACKEND_TEST_FILTER" ]]; then
            dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj \
              "${common_args[@]}" \
              --filter "$BACKEND_TEST_FILTER" \
              --logger "trx;LogFileName=backend-tests.trx" \
              --results-directory artifacts/test-results/backend
          else
            # Run the two test projects explicitly so each keeps its own TRX.
            # The previous solution-level logger wrote both projects to the same
            # backend-tests.trx and the second project overwrote the first.
            dotnet test tests/Coglatas.Architecture.Tests/Coglatas.Architecture.Tests.csproj \
              "${common_args[@]}" \
              --logger "trx;LogFileName=architecture-tests.trx" \
              --results-directory artifacts/test-results/architecture

            dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj \
              "${common_args[@]}" \
              --logger "trx;LogFileName=backend-tests.trx" \
              --results-directory artifacts/test-results/backend
          fi

      - name: Verify backend TRX evidence
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_tests == 'true'
        shell: bash
        env:
          BACKEND_TEST_SCOPE: ${{ needs.dotnet-build.outputs.backend_test_scope }}
        run: |
          set -euo pipefail
          bash scripts/ci/verify-trx-results.sh \
            artifacts/test-results/backend/backend-tests.trx \
            --minimum-total 1 \
            --label "backend test suite"

          if [[ "$BACKEND_TEST_SCOPE" != "scoped" ]]; then
            bash scripts/ci/verify-trx-results.sh \
              artifacts/test-results/architecture/architecture-tests.trx \
              --minimum-total 1 \
              --label "architecture test suite"
          fi

      - name: Generate .NET coverage report
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          dotnet reportgenerator \
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"
          cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .NET coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-coverage-report
          path: artifacts/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend results on failure
        if: failure() && (github.event_name != 'pull_request' || needs.dotnet-build.outputs.backend_tests == 'true')
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  resharper-pr:
    name: ReSharper PR fast lane
    needs: dotnet-build
    if: ${{ github.event_name == 'pull_request' && needs.dotnet-build.outputs.built == 'true' }}
    uses: ./.github/workflows/resharper_pr.yml

  frontend-build:
    name: Frontend build producer
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      frontend: ${{ needs.changes.outputs.frontend }}
      frontend_build: ${{ needs.changes.outputs.frontend_build }}
      frontend_unit: ${{ needs.changes.outputs.frontend_unit }}
      frontend_unit_scope: ${{ needs.changes.outputs.frontend_unit_scope }}
      frontend_unit_features: ${{ needs.changes.outputs.frontend_unit_features }}
      frontend_architecture: ${{ needs.changes.outputs.frontend_architecture }}
      frontend_license_guard: ${{ needs.changes.outputs.frontend_license_guard }}
      frontend_storybook: ${{ needs.changes.outputs.frontend_storybook }}
      frontend_playwright: ${{ needs.changes.outputs.frontend_playwright }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip frontend build producer for unrelated changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend-relevant changes detected; no frontend artifact is required."

      - name: Set up Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Use repository npm version without lifecycle scripts
        if: needs.changes.outputs.frontend == 'true'
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Install Angular dependencies with reviewed lifecycle policy
        if: needs.changes.outputs.frontend == 'true'
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Build production Angular artifact
        if: needs.changes.outputs.frontend_build == 'true' || needs.changes.outputs.frontend_playwright == 'true'
        run: npm --prefix frontend run build

      - name: Build Storybook artifact
        if: needs.changes.outputs.frontend_storybook == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm --prefix frontend run build-storybook

      - name: Package frontend build artifacts
        if: needs.changes.outputs.frontend_build == 'true' || needs.changes.outputs.frontend_playwright == 'true' || needs.changes.outputs.frontend_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          git rev-parse HEAD > artifacts/ci/frontend-build-sha

          outputs=(artifacts/ci/frontend-build-sha)
          if [[ -d frontend/dist/coglatas-web ]]; then
            outputs+=(frontend/dist/coglatas-web)
          fi
          if [[ -d frontend/storybook-static ]]; then
            outputs+=(frontend/storybook-static)
          fi

          if [[ "${#outputs[@]}" -le 1 ]]; then
            echo "::error::Frontend build producer completed without reusable output."
            exit 1
          fi

          tar -cf "$RUNNER_TEMP/frontend-build-artifacts.tar" "${outputs[@]}"
          du -h "$RUNNER_TEMP/frontend-build-artifacts.tar"

      - name: Publish frontend build artifacts
        if: needs.changes.outputs.frontend_build == 'true' || needs.changes.outputs.frontend_playwright == 'true' || needs.changes.outputs.frontend_storybook == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-build-artifacts
          path: ${{ runner.temp }}/frontend-build-artifacts.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  frontend-test:
    name: frontend-test
    if: ${{ always() }}
    needs: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Require successful frontend producer
        env:
          PRODUCER_RESULT: ${{ needs.frontend-build.result }}
        run: test "$PRODUCER_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download redistributed frontend build artifacts
        if: needs.frontend-build.outputs.frontend_build == 'true' || needs.frontend-build.outputs.frontend_playwright == 'true' || needs.frontend-build.outputs.frontend_storybook == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build-artifacts
          path: ${{ runner.temp }}/frontend-build-artifact

      - name: Restore redistributed frontend build artifacts
        if: needs.frontend-build.outputs.frontend_build == 'true' || needs.frontend-build.outputs.frontend_playwright == 'true' || needs.frontend-build.outputs.frontend_storybook == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frontend-build-artifact/frontend-build-artifacts.tar"
          test -f "$archive"
          tar -xf "$archive" -C "$GITHUB_WORKSPACE"

          expected="$(git rev-parse HEAD)"
          actual="$(tr -d '\r\n' < artifacts/ci/frontend-build-sha)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Frontend build artifact SHA $actual does not match test revision $expected."
            exit 1
          fi

          if [[ "${{ needs.frontend-build.outputs.frontend_build }}" == "true" || "${{ needs.frontend-build.outputs.frontend_playwright }}" == "true" ]]; then
            test -f frontend/dist/coglatas-web/index.html
            test -f frontend/dist/coglatas-web/angular-app.marker
          fi
          if [[ "${{ needs.frontend-build.outputs.frontend_storybook }}" == "true" ]]; then
            test -f frontend/storybook-static/index.html
          fi

      - name: Skip frontend checks for unrelated changes
        if: needs.frontend-build.outputs.frontend != 'true'
        run: echo "No frontend-relevant changes detected; frontend-test passes without running the frontend suite."

      - name: Set up Node.js
        if: needs.frontend-build.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Use repository npm version without lifecycle scripts
        if: needs.frontend-build.outputs.frontend == 'true'
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Validate MVP-A CI helper syntax
        if: needs.frontend-build.outputs.frontend == 'true'
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/ci/verify-mvp-a-required-a11y-tests.py \
            scripts/ci/verify-mvp-a-final-checks.py
          bash -n scripts/ci/mvp-a-authz-boundary-acceptance.sh
          bash -n scripts/ci/run-mvp-a-authz-boundary-acceptance.sh
          python3 - <<'PY'
          from pathlib import Path

          source = Path("scripts/ci/mvp-a-authz-boundary-acceptance.sh").read_text(encoding="utf-8")
          start_marker = "node --input-type=module <<'NODE'\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.rindex("\nNODE\n")
          Path("/tmp/mvp-a-authz-boundary-acceptance.mjs").write_text(
              source[start:end], encoding="utf-8"
          )
          PY
          node --check /tmp/mvp-a-authz-boundary-acceptance.mjs

      - name: Verify MVP-A accessibility coverage contract
        if: needs.frontend-build.outputs.frontend == 'true'
        run: python3 scripts/ci/verify-mvp-a-required-a11y-tests.py

      - name: Install UI runner dependencies with reviewed lifecycle policy
        if: needs.frontend-build.outputs.frontend == 'true'
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install Angular dependencies with reviewed lifecycle policy
        if: needs.frontend-build.outputs.frontend == 'true'
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Run frontend checks in parallel
        if: needs.frontend-build.outputs.frontend == 'true'
        shell: bash
        env:
          FRONTEND_BUILD: "false"
          FRONTEND_UNIT: ${{ needs.frontend-build.outputs.frontend_unit }}
          FRONTEND_ARCHITECTURE: ${{ needs.frontend-build.outputs.frontend_architecture }}
          FRONTEND_LICENSE_GUARD: ${{ needs.frontend-build.outputs.frontend_license_guard }}
          FRONTEND_STORYBOOK: "false"
          FRONTEND_PLAYWRIGHT: ${{ needs.frontend-build.outputs.frontend_playwright }}
          COGLATAS_PLAYWRIGHT_REUSE_HOST_BUILD: "true"
        run: bash scripts/ci/run-frontend-parallel.sh

      - name: Upload browser artifacts on failure
        if: failure() && needs.frontend-build.outputs.frontend_playwright == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-ui-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: security-scan
    if: ${{ always() }}
    needs: dotnet-build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      POSTGRES_DB: coglatas
      POSTGRES_USER: coglatas
      POSTGRES_PASSWORD: ci_dummy_password
      DB_PASSWORD: ci_dummy_password
      LOCAL_ADMIN_PASSWORD: ci_dummy_local_admin_password

    steps:
      - name: Require successful build producer
        env:
          PRODUCER_RESULT: ${{ needs.dotnet-build.result }}
        run: test "$PRODUCER_RESULT" = success

      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download redistributed .NET build for security contract
        if: github.event_name == 'pull_request' && needs.dotnet-build.outputs.avmig_contract == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-release-build
          path: ${{ runner.temp }}/security-dotnet-build

      - name: Restore redistributed .NET build for security contract
        if: github.event_name == 'pull_request' && needs.dotnet-build.outputs.avmig_contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/security-dotnet-build/dotnet-release-build.tar"
          test -f "$archive"
          tar -xf "$archive" -C "$GITHUB_WORKSPACE"
          expected="$(git rev-parse HEAD)"
          actual="$(tr -d '\r\n' < artifacts/ci/dotnet-build-sha)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Security .NET build artifact SHA $actual does not match analyzed revision $expected."
            exit 1
          fi

      - name: Download redistributed security OpenAPI build
        if: github.event_name == 'pull_request' && needs.dotnet-build.outputs.avmig_contract == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-openapi-build
          path: ${{ runner.temp }}/security-openapi-build

      - name: Restore redistributed security OpenAPI build
        if: github.event_name == 'pull_request' && needs.dotnet-build.outputs.avmig_contract == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/security-openapi-build/security-openapi-build.tar"
          test -f "$archive"
          tar -xf "$archive" -C "$GITHUB_WORKSPACE"
          expected="$(git rev-parse HEAD)"
          actual="$(tr -d '\r\n' < artifacts/ci/security-openapi-sha)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Security OpenAPI artifact SHA $actual does not match analyzed revision $expected."
            exit 1
          fi
          test -f artifacts/openapi/coglatas-openapi.json
      - name: Create masked SEC-03 synthetic credential
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security == 'true'
        shell: bash
        run: |
          set -euo pipefail
          password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
          printf '::add-mask::%s\n' "$password"
          printf 'COGLATAS_SECURITY_CI_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_dotnet == 'true' || needs.dotnet-build.outputs.avmig_contract == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_dotnet == 'true' || needs.dotnet-build.outputs.avmig_contract == 'true'
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity normal

      - name: Reject vulnerable NuGet packages
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_dotnet == 'true'
        shell: bash
        run: |
          set +e
          dotnet list Coglatas.slnx package --vulnerable --include-transitive > dotnet-vulnerable-packages.txt 2>&1
          status=$?
          set -e
          cat dotnet-vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" dotnet-vulnerable-packages.txt; then
            exit 1
          fi
          exit "$status"

      - name: Generate and verify SEC-01 / AV-MIG contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.avmig_contract == 'true'
        shell: bash
        env:
          # PRs verify the generated contract once; main/manual repeat generation.
          COGLATAS_SECURITY_OPENAPI_DETERMINISM_RUNS: ${{ github.event_name == 'pull_request' && '1' || '2' }}
          COGLATAS_SECURITY_REUSE_PREBUILT_OPENAPI: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          # Verifier mutation suites run on PR only when verifier/policy/toolchain
          # or their concrete Program/AppHub mutation targets changed.
          COGLATAS_SECURITY_AVMIG_SELFTESTS: ${{ github.event_name != 'pull_request' && '1' || (needs.dotnet-build.outputs.avmig_selftests == 'true' && '1' || '0') }}
        run: bash scripts/ci/generate-security-openapi-contract.sh

      - name: Upload OpenAPI 3.1 contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.avmig_contract == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-3.1-contract
          path: artifacts/openapi/coglatas-openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate Compose files
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          # Compose resolves environment-backed build secrets during config validation.
          # This placeholder is used only for static Compose rendering; no licensed build runs here.
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: |
          set -euo pipefail
          docker compose -f infra/compose/dev/db.yml config --quiet
          docker compose -f infra/compose/dev/full.yml config --quiet
          docker compose -f infra/compose/dev/playwright.yml config --quiet
          docker compose -p coglatas-real-backend-smoke-ci-config -f infra/compose/test/real-backend-smoke.yml config --quiet
          docker compose -p coglatas-security-ci-config -f infra/compose/test/real-backend-smoke.yml -f infra/compose/security/security.yml config --quiet
          docker compose -p coglatas-u22-demo-ci-config -f infra/compose/test/real-backend-smoke.yml -f infra/compose/demo/u22.yml config --quiet
          docker compose config --quiet
          docker compose -f infra/compose/dev/local.yml config --quiet
          docker compose -f deploy/onprem/compose.yml config --quiet
          docker compose -f deploy/onprem/compose.yml -f deploy/onprem/compose.ci.yml config --quiet
          docker compose -p deploy -f deploy/sakura/docker-compose.yml config --quiet
          bash scripts/ci/verify-onprem-proxy-topology.sh

      - name: Validate SEC-02 security Compose invariants
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: |
          set -euo pipefail
          docker compose \
            -p coglatas-security-ci-config \
            -f infra/compose/test/real-backend-smoke.yml \
            -f infra/compose/security/security.yml \
            config --format json |
            python3 scripts/ci/verify-security-compose.py

      - name: Test SEC-03 scanner harness contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: bash scripts/security/test-scanner-harness.sh

      - name: Test SEC-04 Schemathesis contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: bash scripts/security/test-schemathesis-contract.sh

      - name: Test SEC-06 ZAP contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: bash scripts/security/test-zap-contract.sh

      - name: Test AUD-02 lifecycle contract
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_compose == 'true'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: bash scripts/security/test-aud02-lifecycle.sh

      - name: Report security validation mode
        if: github.event_name == 'pull_request'
        run: |
          echo "PR fast security mode: runtime DAST/fuzz/restart gates are deferred to main."
          echo "Dependency scans when manifests change, Compose/SEC harness contracts, one-pass SEC-01/AV-MIG when routed, verifier self-tests when verifier inputs change, Trivy, and Gitleaks remain enforced."

      - name: Build reusable security runtime image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          image="coglatas-security-runtime:${GITHUB_SHA}"
          docker build --file infra/docker/security-runtime.Dockerfile --tag "$image" .
          printf 'COGLATAS_SECURITY_RUNTIME_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Run isolated security runtime lanes in parallel
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SYNCFUSION_LICENSE: compose-config-validation-placeholder
        run: bash scripts/ci/run-security-runtime-parallel.sh

      - name: Scan repository filesystem with Trivy
        if: github.event_name != 'pull_request' || needs.dotnet-build.outputs.security_image == 'true'
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.65.0 \
            fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output /repo/trivy-filesystem-report.txt \
            /repo
          status=$?
          set -e
          cat trivy-filesystem-report.txt
          exit "$status"

      - name: Scan PR diff or current ref history with Gitleaks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # With no --log-opts, Gitleaks scans --all local refs. Full-history
          # checkout fetches topic branches too, so bind non-PR scans to this ref.
          scan_log_opts="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            [[ -n "$merge_base" ]] || {
              echo "::error::Unable to resolve the PR merge base for Gitleaks."
              exit 1
            }
            scan_log_opts="${merge_base}..${PR_HEAD_SHA}"
          fi
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose \
            --log-opts="$scan_log_opts" \
            --report-format json \
            --report-path /repo/gitleaks-report.json
          status=$?
          set -e
          [[ -f gitleaks-report.json ]] || printf '[]\n' > gitleaks-report.json
          exit "$status"

      - name: Upload SEC-06 sanitized ZAP evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec06-zap-evidence
          path: artifacts/security/zap/
          if-no-files-found: error
          retention-days: 7

      - name: Upload security reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-scan-reports
          path: |
            dotnet-vulnerable-packages.txt
            trivy-filesystem-report.txt
            gitleaks-report.json
            artifacts/security/schemathesis/
            artifacts/security/zap/
          if-no-files-found: warn
          retention-days: 7


