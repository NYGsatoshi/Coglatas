name: Node Toolchain Preflight

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "infra/docker/backend-dev.Dockerfile"
      - "infra/docker/frontend-dev.Dockerfile"
      - "package.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.npmrc"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "scripts/ci/verify-docker-frontend-deps.mjs"
      - ".github/workflows/**"
      - "scripts/ci/verify-node-toolchain.mjs"
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "infra/docker/backend-dev.Dockerfile"
      - "infra/docker/frontend-dev.Dockerfile"
      - "package.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.npmrc"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "scripts/ci/verify-docker-frontend-deps.mjs"
      - ".github/workflows/**"
      - "scripts/ci/verify-node-toolchain.mjs"

concurrency:
  group: node-toolchain-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-toolchain-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup repository Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Verify Node and npm toolchain policy
        run: node scripts/ci/verify-node-toolchain.mjs


      - name: Verify script-free production Docker dependency path
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
          BUILDKIT_PROGRESS: plain
        run: |
          set -euo pipefail
          image="coglatas-frontend-no-scripts:${GITHUB_SHA}"
          docker build --pull --file Dockerfile \
            --target frontend-unlicensed-smoke \
            --tag "$image" .
          docker image rm --force "$image"

      - name: Report toolchain versions
        shell: bash
        run: |
          {
            echo "### Node toolchain preflight"
            echo
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Docker production frontend base: Node 24"
            echo "- Docker frontend development base: Node 24-alpine"
            echo "- Workflow setup-node majors: Node 24"
            echo "- Runner trust boundary: GitHub-hosted"
          } >> "$GITHUB_STEP_SUMMARY"
