name: ProjectIDE artifact candidate parity

on:
  pull_request:
    paths:
      - src/Coglatas.Domain/ProjectIde/**
      - global.json
      - src/Coglatas.Application/ProjectIde/ReceiptVerification/**
      - tests/Coglatas.Tests/ProjectIde/VersionedArtifactTests.cs
      - tests/Coglatas.Tests/ProjectIde/SyntheticReceiptAuthenticationTests.cs
      - src/Coglatas.Application/ProjectIde/DependencyAcquisition/**
      - tests/Coglatas.Tests/ProjectIde/SyntheticDependencyAcquisitionTests.cs
      - tests/Coglatas.Tests/ProjectIde/Fixtures/artifact-hash-vectors-v1.json
      - tests/ci/projectide-artifact-vectors.test.mjs
      - tests/ci/projectide_artifact_inventory.py
      - tests/ci/projectide_core_isolated.py
      - tests/ci/projectide_integration_inventory.json
      # Recorded debugger producer, replay tests, and immutable fixture are all
      # independent changes that must activate the full two-host artifact suite.
      - tools/ProjectIde.Preview/**
      - tests/Coglatas.Tests/ProjectIde/WebSimulationDebugContractTests.cs
      - frontend/public/assets/projectide/simulation-debug-v1.json
      - .github/workflows/projectide-artifact-candidates.yml

permissions:
  contents: read

concurrency:
  group: projectide-artifact-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Prototype artifact parity (ubuntu-24.04)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.base_ref == 'projectide/integration-20261031' ||
       startsWith(github.base_ref, 'projectide/artifact-foundation-') ||
       startsWith(github.base_ref, 'projectide/receipt-proof-') ||
       startsWith(github.base_ref, 'projectide/synthetic-acquisition-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Set up independent hash runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Set up inventory verifier
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Build with warnings as errors
        run: dotnet build Coglatas.slnx -c Release -warnaserror
      - name: Run complete ProjectIDE inventory
        run: dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj -c Release --no-build --filter FullyQualifiedName~ProjectIde --logger 'trx;LogFileName=projectide.trx' --results-directory candidate-evidence
      - name: Run architecture boundaries
        run: dotnet test tests/Coglatas.Architecture.Tests/Coglatas.Architecture.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=architecture.trx' --results-directory candidate-evidence
      - name: Check independent Node hash vectors
        run: node --test tests/ci/projectide-artifact-vectors.test.mjs
      - name: Recreate exact debugger recording and verify the original fixture bytes
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'frontend/public/assets/projectide/simulation-debug-v1.json'
          $output = 'candidate-evidence/simulation-debug-replayed.json'
          if (!(Test-Path -LiteralPath $asset)) { throw 'Recorded debugger fixture absent' }
          $sourceBlob = git rev-parse "HEAD:$asset"
          $actualBlob = git hash-object -- $asset
          if ($LASTEXITCODE -ne 0 -or $sourceBlob -ne '611369c8d5eb2c2089c82c26cfc29e091ed6188b' -or $actualBlob -ne $sourceBlob) {
            throw 'Exact immutable recording fixture Git blob mismatch'
          }
          dotnet run --project tools/ProjectIde.Preview/ProjectIde.Preview.csproj -c Release --no-build -- $output --simulation-debug
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $output)) { throw 'Live recorded-debugger export failed' }
          # Git smudge/checkout may change line endings on Windows even when the
          # committed blob and the actual exported recording are byte-identical.
          # Hash the exact committed Git blob without PowerShell's text conversion.
          $committedHash = python -B -c 'import hashlib,subprocess,sys; print(hashlib.sha256(subprocess.check_output(["git","cat-file","blob",sys.argv[1]])).hexdigest())' $sourceBlob
          if ($LASTEXITCODE -ne 0) { throw 'Cannot hash exact committed binary recording source' }
          $fixtureHash = ([string]$committedHash).Trim().ToLowerInvariant()
          $exportHash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fixtureHash -ne 'c51b07019b1040505134bc983460324913b6a3d4b2b0399da2022d0da9eed98b' -or $exportHash -ne $fixtureHash) {
            throw 'Recorded-debugger replay diverged from independently pinned repository bytes'
          }
          $data = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json -Depth 128
          $cases = @($data.cases)
          $runCases = @($cases | Where-Object { $null -ne $_.simulationRun -and $null -ne $_.simulationDebug })
          $frames = 0
          foreach ($item in $runCases) { $frames += @($item.simulationDebug.frames).Count }
          if ($cases.Count -ne 12 -or $runCases.Count -ne 9 -or $frames -ne 99) {
            throw 'Expected original twelve cases, nine simulation runs, and ninety-nine recorded debugger frames'
          }
          @{
            candidateHead = (git rev-parse HEAD).Trim()
            fixtureBlob = $sourceBlob
            fixtureSha256 = $fixtureHash
            liveReplaySha256 = $exportHash
            caseCount = $cases.Count
            simulatedRunCount = $runCases.Count
            recordedFrameCount = $frames
            executionScope = 'SYNTHETIC_FIXED_SOURCE_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -LiteralPath 'candidate-evidence/recording-replay-receipt.json' -Encoding utf8
      - name: Reject missing failed skipped or empty test results
        run: |
          foreach ($name in @('projectide', 'architecture')) {
            [xml]$report = Get-Content "candidate-evidence/$name.trx" -Raw
            $counters = $report.TestRun.ResultSummary.Counters
            $results = @($report.TestRun.Results.UnitTestResult)
            if ($report.TestRun.ResultSummary.outcome -ne 'Completed' -or [int]$counters.total -le 0 -or
                $counters.total -ne $counters.passed -or $results.Count -ne [int]$counters.total -or
                @($results | Where-Object outcome -ne 'Passed').Count -ne 0) {
              throw "Incomplete or unsuccessful $name inventory"
            }
            if (($name -eq 'projectide' -and [int]$counters.total -lt 1041) -or
                ($name -eq 'architecture' -and [int]$counters.total -lt 12)) {
              throw "Retained $name inventory shrank"
            }
            if ($name -eq 'projectide') {
              $debugger = @($results | Where-Object { [string]$_.testName -like '*WebSimulationDebugContractTests*' })
              if ($debugger.Count -ne 15 -or @($debugger | Where-Object outcome -ne 'Passed').Count -ne 0) {
                throw 'Recorded debugger native case inventory must contain fifteen distinct passing tests'
              }
            }
          }
          git rev-parse HEAD | Set-Content candidate-evidence/candidate-sha.txt
          Get-FileHash candidate-evidence/*.trx -Algorithm SHA256 | ForEach-Object {
            @{ file = Split-Path $_.Path -Leaf; sha256 = $_.Hash.ToLowerInvariant() }
          } | ConvertTo-Json | Set-Content candidate-evidence/trx-digests.json
      - name: Reconcile retained exact test identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          git show "${env:BASE_SHA}:tests/ci/projectide_integration_inventory.json" | Set-Content candidate-evidence/baseline.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read retained base inventory' }
          python -B tests/ci/projectide_artifact_inventory.py --results candidate-evidence --baseline candidate-evidence/baseline.json --require-receipt-proof --require-acquisition
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete retained test identities' }
      - name: Upload actual candidate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-prototype-ubuntu-24.04-${{ github.run_attempt }}
          path: candidate-evidence
          if-no-files-found: error

  windows:
    name: Prototype artifact parity (windows-latest)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.base_ref == 'projectide/integration-20261031' ||
       startsWith(github.base_ref, 'projectide/artifact-foundation-') ||
       startsWith(github.base_ref, 'projectide/receipt-proof-') ||
       startsWith(github.base_ref, 'projectide/synthetic-acquisition-'))
