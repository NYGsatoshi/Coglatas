        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-prototype-windows-latest-${{ github.run_attempt }}
          path: candidate-evidence
          if-no-files-found: error
