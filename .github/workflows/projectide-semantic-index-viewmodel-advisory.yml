name: ProjectIDE Semantic index ViewModel exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-semantic-index-viewmodel-advisory.yml
      - tests/candidates/projectide-semantic-index-viewmodel/**
      - tests/candidates/workflow-provenance/**

permissions:
  contents: read

env:
  PROVENANCE_BLOB: bc8106b9c4ac38af7ddb53bd4f904aef98d847e8
  PROVENANCE_CONTROLS_BLOB: c9f7ec729870758b86b21f806423ce1bb726933c
  PRODUCT_HEAD: 09347c1113f5f9c007bbbc5052278d5b5151feb5
  SOURCE_BLOB: a1774c1fcbd7e2f1b0cf29c641cfad1468cb90e3
  RUNNER_BLOB: 41b62f7c0346575888d7f266d89a655acbd101e1
  CONTROLS_BLOB: 0eaf5b752b22a0a68ed4efe47ea143d48ec163b2

concurrency:
  group: semantic-index-viewmodel-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-index-viewmodel-ubuntu:
    name: Semantic index ViewModel independent synthetic composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_HEAD: ${{ github.event.pull_request.base.sha }}
      WORKFLOW_HEAD: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot use LF checkout policy' }
      - name: Checkout immutable independent Security Test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source blobs and Product SDK policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $case = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index-viewmodel/SecuritySemanticIndexViewModelCandidateTests.cs'
          if ($LASTEXITCODE -ne 0 -or $case -ne $env:SOURCE_BLOB) { throw 'Candidate source blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index-viewmodel/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Independent runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-semantic-index-viewmodel/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Verifier controls blob mismatch' }
          git cat-file -e "$($env:PRODUCT_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Product commit not present' }
          $policy = git show "$($env:PRODUCT_HEAD):global.json"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy absent' }
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-viewmodel-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
            testHead = $actual
            productHead = $env:PRODUCT_HEAD
            sourceBlob = $case
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_SEMANTIC_INDEX_VIEWMODEL_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Install exact Product .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ${{ runner.temp }}/semantic-index-viewmodel-qualification-context/global.json
      - name: Install pinned composition Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Bind the immutable executing workflow to the reviewed Test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-viewmodel-qualification-context'
          $provenance = git rev-parse 'HEAD:tests/candidates/workflow-provenance/verify_workflow_provenance.py'
          if ($LASTEXITCODE -ne 0 -or $provenance -ne $env:PROVENANCE_BLOB) { throw 'Provenance helper blob mismatch' }
          $provenanceBytes = git hash-object --no-filters -- 'tests/candidates/workflow-provenance/verify_workflow_provenance.py'
          if ($LASTEXITCODE -ne 0 -or $provenanceBytes -ne $env:PROVENANCE_BLOB) { throw 'Provenance helper working bytes mismatch' }
          python -I -B tests/candidates/workflow-provenance/verify_workflow_provenance.py --workflow-path .github/workflows/projectide-semantic-index-viewmodel-advisory.yml --context (Join-Path $context 'workflow-context.json')
          if ($LASTEXITCODE -ne 0) { throw 'Executing workflow provenance was refused' }
      - name: Exercise independent Git provenance refusal controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-viewmodel-qualification-context'
          $log = Join-Path $context 'provenance-controls.log'
          # Pin all executing committed objects and actual unfiltered working bytes before Python imports.
          foreach ($script in @(
            @{ Path = 'tests/candidates/workflow-provenance/verify_workflow_provenance.py'; Sha = $env:PROVENANCE_BLOB },
            @{ Path = 'tests/candidates/workflow-provenance/test_workflow_provenance.py'; Sha = $env:PROVENANCE_CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed Python identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working Python bytes mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; bad=[p for name in sys.argv[1:] for p in Path(name).rglob('*') if p.name.casefold()=='__pycache__' or p.suffix.casefold() in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-semantic-index-viewmodel' 'tests/candidates/workflow-provenance'
          if ($LASTEXITCODE -ne 0) { throw 'Python bytecode cache is not admitted' }
          python -I -B -c "import importlib.util, runpy, sys; s=importlib.util.spec_from_file_location('verify_workflow_provenance', 'tests/candidates/workflow-provenance/verify_workflow_provenance.py'); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m); runpy.run_path('tests/candidates/workflow-provenance/test_workflow_provenance.py', run_name='__main__')" *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($controlsExitCode -ne 0) { throw 'Executing workflow provenance controls failed' }
      - name: Run synthetic verifier regression controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $context = Join-Path $env:RUNNER_TEMP 'semantic-index-viewmodel-qualification-context'
          $log = Join-Path $context 'admission-controls.log'
          # Pin all executing committed objects and actual unfiltered working bytes before Python imports.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-semantic-index-viewmodel/compose_and_verify.py'; Sha = $env:RUNNER_BLOB },
            @{ Path = 'tests/candidates/projectide-semantic-index-viewmodel/test_compose_and_verify.py'; Sha = $env:CONTROLS_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed Python identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working Python bytes mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; bad=[p for name in sys.argv[1:] for p in Path(name).rglob('*') if p.name.casefold()=='__pycache__' or p.suffix.casefold() in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-semantic-index-viewmodel' 'tests/candidates/workflow-provenance'
          if ($LASTEXITCODE -ne 0) { throw 'Python bytecode cache is not admitted' }
          python -I -B -c "import runpy,sys; p=sys.argv[1]; sys.argv=[p]; runpy.run_path(p,run_name='__main__')" 'tests/candidates/projectide-semantic-index-viewmodel/test_compose_and_verify.py' *> $log
          $controlsExitCode = $LASTEXITCODE
          Get-Content -LiteralPath $log
          if ($controlsExitCode -ne 0) { throw 'Semantic index ViewModel synthetic verifier controls failed' }
      - name: Run exact independent source and real compiled xUnit controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Pin all executing committed objects and actual unfiltered working bytes before Python imports.
          foreach ($script in @(
            @{ Path = 'tests/candidates/projectide-semantic-index-viewmodel/compose_and_verify.py'; Sha = $env:RUNNER_BLOB }
          )) {
            $committed = git rev-parse "$($env:TEST_HEAD):$($script.Path)"
            if ($LASTEXITCODE -ne 0 -or $committed -ne $script.Sha) { throw 'Pre-execution committed Python identity mismatch' }
            $working = git hash-object --no-filters -- $script.Path
            if ($LASTEXITCODE -ne 0 -or $working -ne $script.Sha) { throw 'Pre-execution working Python bytes mismatch' }
          }
          python -I -B -c "from pathlib import Path; import sys; bad=[p for name in sys.argv[1:] for p in Path(name).rglob('*') if p.name.casefold()=='__pycache__' or p.suffix.casefold() in ('.pyc','.pyo')]; sys.exit(bool(bad))" 'tests/candidates/projectide-semantic-index-viewmodel' 'tests/candidates/workflow-provenance'
          if ($LASTEXITCODE -ne 0) { throw 'Python bytecode cache is not admitted' }
          python -I -B tests/candidates/projectide-semantic-index-viewmodel/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/semantic-index-viewmodel-qualification-product" --evidence "$env:RUNNER_TEMP/semantic-index-viewmodel-qualification-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Semantic index ViewModel independent synthetic qualification did not complete' }
      - name: Retain original source, TRX and compiled discovery receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semantic-index-viewmodel-qualification-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/semantic-index-viewmodel-qualification-context
            ${{ runner.temp }}/semantic-index-viewmodel-qualification-evidence
          if-no-files-found: error
          retention-days: 7


