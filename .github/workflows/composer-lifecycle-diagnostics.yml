name: Composer Lifecycle Diagnostics

on:
  pull_request:
    paths:
      - 'tests/functional/fixtures/messaging-observation.mjs'
      - 'tests/functional/messaging-observation.node-test.mjs'
      - 'scripts/ci/functional_diagnostics.py'
      - 'scripts/ci/test-functional-diagnostics.py'
      - 'docs/verification/composer-input-lifecycle-observation-20261025.md'
      - '.github/workflows/composer-lifecycle-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'tests/functional/fixtures/messaging-observation.mjs'
      - 'tests/functional/messaging-observation.node-test.mjs'
      - 'scripts/ci/functional_diagnostics.py'
      - 'scripts/ci/test-functional-diagnostics.py'
      - '.github/workflows/composer-lifecycle-diagnostics.yml'

permissions:
  contents: read

jobs:
  structural-diagnostic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Verify privacy-bounded browser observation producer
        run: node --test tests/functional/messaging-observation.node-test.mjs
      - name: Verify independent strict Python evidence consumer
        run: python3 scripts/ci/test-functional-diagnostics.py -v
