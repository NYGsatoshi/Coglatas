name: Security Misconfiguration (Shadow)

on:
  push:
    branches: [main, SecurityTestImplimation]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "infra/**"
      - "deploy/**"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.Dockerfile"
      - "**/compose*.yaml"
      - "**/compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/docker-compose*.yml"
      - "scripts/ci/verify_security_misconfiguration_sarif.py"
      - "tests/ci/test_security_misconfiguration_sarif.py"
  pull_request:
    branches: [main, SecurityTestImplimation]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "infra/**"
      - "deploy/**"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "**/*.Dockerfile"
      - "**/compose*.yaml"
      - "**/compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/docker-compose*.yml"
      - "scripts/ci/verify_security_misconfiguration_sarif.py"
      - "tests/ci/test_security_misconfiguration_sarif.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-misconfiguration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  misconfiguration:
    name: security-misconfiguration-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test SARIF verification failure modes
        run: python3 -B tests/ci/test_security_misconfiguration_sarif.py

      - name: Scan infrastructure configuration with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          version: v0.76.1 # Pin a scanner supporting current policy modules (requires >= 0.72.0).
          format: sarif
          output: security-misconfiguration.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0" # Shadow: findings do not block merges yet.

      - name: Reject missing or malformed scanner evidence
        id: verify
        if: always()
        shell: bash
        env:
          SCANNER_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SCANNER_OUTCOME" != success ]]; then
            echo "::error::Trivy scan did not complete successfully."
            exit 1
          fi
          python3 -B scripts/ci/verify_security_misconfiguration_sarif.py \
            security-misconfiguration.sarif \
            --summary "$GITHUB_STEP_SUMMARY" \
            --sha "$GITHUB_SHA"

      - name: Preserve verified advisory SARIF
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-misconfiguration-sarif
          path: security-misconfiguration.sarif
          if-no-files-found: error
          retention-days: 14
