name: GitHub Actions Static Analysis

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

concurrency:
  group: workflow-static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"

jobs:
  workflow-static-analysis:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changed GitHub Actions inputs
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          test -n "$base"
          test -n "$head"

          workflows_file="$RUNNER_TEMP/changed-workflows.txt"
          actions_flag="$RUNNER_TEMP/local-actions-changed"
          : > "$workflows_file"
          : > "$actions_flag"

          git diff --diff-filter=ACMR --name-only "$base" "$head" --             ".github/workflows/*.yml"             ".github/workflows/*.yaml"             > "$workflows_file"

          if git diff --diff-filter=ACMR --name-only "$base" "$head" -- ".github/actions/**" | grep -q .; then
            printf 'true\n' > "$actions_flag"
          else
            printf 'false\n' > "$actions_flag"
          fi

          {
            echo "Changed workflows:"
            cat "$workflows_file"
            echo "Local actions changed: $(cat "$actions_flag")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test NuGet dependency snapshot conversion
        run: python3 scripts/ci/test_nuget_dependency_snapshot.py

      - name: Install checksum-pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Run actionlint on changed workflows
        id: actionlint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < "$RUNNER_TEMP/changed-workflows.txt"
          if (( ${#workflows[@]} == 0 )); then
            echo "No changed workflow YAML files for actionlint."
            exit 0
          fi

          "$RUNNER_TEMP/actionlint" -color "${workflows[@]}"

      - name: Install checksum-pinned zizmor
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zizmor.tar.gz"
          curl --fail --silent --show-error --location             "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$ZIZMOR_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --version

      - name: Run zizmor on changed GitHub Actions inputs
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < "$RUNNER_TEMP/changed-workflows.txt"
          local_actions_changed="$(cat "$RUNNER_TEMP/local-actions-changed")"

          inputs=("${workflows[@]}")
          if [[ "$local_actions_changed" == "true" && -d .github/actions ]]; then
            inputs+=(".github/actions")
          fi

          if (( ${#inputs[@]} == 0 )); then
            echo "No changed GitHub Actions inputs for zizmor."
            exit 0
          fi

          "$RUNNER_TEMP/zizmor"             --offline             --strict-collection             --min-severity medium             "${inputs[@]}"

      - name: Enforce static-analysis results
        if: always()
        shell: bash
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
        run: |
          set -euo pipefail

          failed=0
          if [[ "$ACTIONLINT_OUTCOME" != "success" ]]; then
            echo "::error::actionlint failed."
            failed=1
          fi
          if [[ "$ZIZMOR_OUTCOME" != "success" ]]; then
            echo "::error::zizmor failed."
            failed=1
          fi

          exit "$failed"
