name: ProjectIDE Compiler output snapshot exact-source advisory

on:
  pull_request:
    branches: [SecurityTestImplimation]
    paths:
      - .github/workflows/projectide-compiler-output-advisory.yml
      - tests/candidates/projectide-compiler-output/**

permissions:
  contents: read

concurrency:
  group: compiler-output-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compiler-output-ubuntu:
    name: Compiler output independent synthetic composition (ubuntu-24.04)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DOTNET_CLI_UI_LANGUAGE: en-US
      PRODUCT_HEAD: d570a6727b5e5af5c8902c1bf2d0575c66c29143
      TEST_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BLOB: b13bc41f398ca0877d1d9505a2899fd7d835b657
      RUNNER_BLOB: ff7702d6f9103810d1bd26cf736d819c44229ba1
      CONTROLS_BLOB: 44b4766e86ddcba576af31417f442942448e384b
    steps:
      - name: Preserve committed source bytes
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Cannot preserve committed source bytes' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Cannot use LF checkout policy' }
      - name: Checkout immutable independent Security Test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source blobs and Product SDK policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:TEST_HEAD) { throw 'Independent Test HEAD mismatch' }
          $case = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/SecurityCompilerOutputSnapshotCandidateTests.cs'
          if ($LASTEXITCODE -ne 0 -or $case -ne $env:SOURCE_BLOB) { throw 'Candidate source blob mismatch' }
          $runner = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $runner -ne $env:RUNNER_BLOB) { throw 'Independent runner blob mismatch' }
          $controls = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $controls -ne $env:CONTROLS_BLOB) { throw 'Admission controls blob mismatch' }
          git cat-file -e "$($env:PRODUCT_HEAD)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Exact Product commit not present' }
          $policy = git show "$($env:PRODUCT_HEAD):global.json"
          if ($LASTEXITCODE -ne 0) { throw 'Immutable Product SDK policy absent' }
          $context = Join-Path $env:RUNNER_TEMP 'compiler-output-qualification-context'
          New-Item -ItemType Directory -Path $context | Out-Null
          $policy | Set-Content -Encoding utf8NoBOM (Join-Path $context 'global.json')
          @{
            testHead = $actual
            productHead = $env:PRODUCT_HEAD
            sourceBlob = $case
            runnerBlob = $runner
            controlsBlob = $controls
            runnerOs = $env:RUNNER_OS
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            executionScope = 'SYNTHETIC_COMPILER_OUTPUT_CORE_AND_VIEWMODEL_ONLY'
            requiredCheckQualified = $false
            independentReviewComplete = $false
            nativeUiQualified = $false
            productionQualified = $false
            trustQualified = $false
            releaseQualified = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $context 'workflow-context.json')
      - name: Install exact Product .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: ${{ runner.temp }}/compiler-output-qualification-context/global.json
      - name: Install pinned composition Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - name: Run exact independent source and real compiled xUnit controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $committed = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $committed -ne $env:RUNNER_BLOB) { throw 'Python executable committed blob mismatch' }
          $working = git hash-object --no-filters -- 'tests/candidates/projectide-compiler-output/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $working -ne $env:RUNNER_BLOB) { throw 'Python executable working bytes mismatch' }
          python -I -B tests/candidates/projectide-compiler-output/compose_and_verify.py --product-head $env:PRODUCT_HEAD --worktree "$env:RUNNER_TEMP/compiler-output-qualification-product" --evidence "$env:RUNNER_TEMP/compiler-output-qualification-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler output independent synthetic qualification did not complete' }
      - name: Exercise admission regressions over original native outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = "$env:RUNNER_TEMP/compiler-output-qualification-context/admission-controls.log"
          $committed = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $committed -ne $env:RUNNER_BLOB) { throw 'Python executable committed blob mismatch' }
          $working = git hash-object --no-filters -- 'tests/candidates/projectide-compiler-output/compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $working -ne $env:RUNNER_BLOB) { throw 'Python executable working bytes mismatch' }
          $committed = git rev-parse 'HEAD:tests/candidates/projectide-compiler-output/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $committed -ne $env:CONTROLS_BLOB) { throw 'Python executable committed blob mismatch' }
          $working = git hash-object --no-filters -- 'tests/candidates/projectide-compiler-output/test_compose_and_verify.py'
          if ($LASTEXITCODE -ne 0 -or $working -ne $env:CONTROLS_BLOB) { throw 'Python executable working bytes mismatch' }
          python -I -B tests/candidates/projectide-compiler-output/test_compose_and_verify.py --native-trx "$env:RUNNER_TEMP/compiler-output-qualification-evidence/candidate.trx" --compiled-discovery "$env:RUNNER_TEMP/compiler-output-qualification-evidence/compiled-discovery.log" -v *> $log
          $result = $LASTEXITCODE
          Get-Content $log
          if ($result -ne 0) { throw 'Compiler output native evidence admission controls failed' }
      - name: Retain original source, TRX and compiled discovery receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-output-qualification-ubuntu-24.04-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/compiler-output-qualification-context
            ${{ runner.temp }}/compiler-output-qualification-evidence
          if-no-files-found: error
          retention-days: 7


