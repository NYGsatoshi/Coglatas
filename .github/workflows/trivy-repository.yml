name: Trivy Repository Dependency Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-repository:
    name: trivy-repository-fs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan repository package and infrastructure dependencies
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-repository.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Preserve SARIF for security review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-repository-sarif
          path: trivy-repository.sarif
          if-no-files-found: error
          retention-days: 14
