name: Trivy Repository Dependency Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy-repository:
    name: trivy-repository-fs
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository package and infrastructure dependencies
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-repository.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload repository vulnerability findings
        if: steps.trivy.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository-fs
