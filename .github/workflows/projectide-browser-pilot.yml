name: ProjectIDE browser pilot

on:
  pull_request:
    branches: [projectide/integration-20261031]
    paths:
      - '.github/workflows/projectide-browser-pilot.yml'
      - '.gitattributes'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'frontend/**'
      - 'tests/ui/**'
      - 'scripts/ci/npm-ci-retry.sh'
      - 'scripts/ci/verify-npm-lockfile.mjs'
      - 'scripts/ci/projectide-browser-pilot*.py'

permissions:
  contents: read

concurrency:
  group: projectide-browser-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: ProjectIDE browser pilot (${{ matrix.project }}, ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: [chromium-desktop, chromium-mobile]
        shard: [1, 2]
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      BROWSER_PROJECT: ${{ matrix.project }}
      BROWSER_SHARD: ${{ matrix.shard }}/2
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      FORCE_COLOR: '0'
    steps:
      - name: Checkout the exact test merge without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the PR head, base, and test merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$PR_BASE"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
      - name: Use the repository Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Install locked dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
          bash scripts/ci/npm-ci-retry.sh .
          bash scripts/ci/npm-ci-retry.sh frontend
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build and execute the selected shard
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/projectide-browser-pilot"
          mkdir -p "$evidence"
          helper=scripts/ci/projectide-browser-pilot.py
          python3 "$helper" select "$evidence"
          mapfile -t specs < "$evidence/spec-arguments.txt"
          npm --prefix frontend run build
          node tests/ui/serve-static.mjs --port 4173 > "$evidence/static-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$PLAYWRIGHT_BASE_URL/health"
          python3 "$helper" serve "$evidence"
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$evidence/browser.json"
          export PLAYWRIGHT_JUNIT_OUTPUT_FILE="$evidence/browser.xml"
          set +e
          node node_modules/@playwright/test/cli.js test \
            --project="$BROWSER_PROJECT" --shard="$BROWSER_SHARD" \
            --workers=2 --global-timeout=840000 --reporter=line,json,junit \
            "${specs[@]}" 2>&1 | tee "$evidence/browser.log"
          pipeline=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline[0]}" > "$evidence/playwright-exit.txt"
          test "${pipeline[1]}" = 0
          git diff --exit-code "$GITHUB_SHA" --
          python3 "$helper" report "$evidence"
          exit "${pipeline[0]}"
      - name: Retain raw reports, identities, and attempt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-shard-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/projectide-browser-pilot
          if-no-files-found: error
          retention-days: 14

  reconcile:
    name: Reconcile ProjectIDE browser pilot evidence
    needs: browser
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout the exact test merge without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download each of the four shard artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pilot-shard-*
          path: ${{ runner.temp }}/pilot-shards
      - name: Verify the exact partition, results, and served identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci/projectide-browser-pilot-test.py
          python3 scripts/ci/projectide-browser-pilot.py reconcile "$RUNNER_TEMP/pilot-shards"
      - name: Retain the consolidated result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-browser-pilot-receipt
          path: ${{ runner.temp }}/pilot-shards/pilot-receipt.json
          if-no-files-found: warn
          retention-days: 14
