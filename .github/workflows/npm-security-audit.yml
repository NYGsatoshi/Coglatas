name: npm Security Audit

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "scripts/ci/check-npm-audit-baseline.mjs"
      - "scripts/ci/npm-audit-baseline.json"
      - "scripts/ci/npm-ci-retry.sh"
      - ".github/workflows/npm-security-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "scripts/ci/verify-npm-lockfile.mjs"
      - "scripts/ci/check-npm-audit-baseline.mjs"
      - "scripts/ci/npm-audit-baseline.json"
      - "scripts/ci/npm-ci-retry.sh"
      - ".github/workflows/npm-security-audit.yml"
  workflow_dispatch:

concurrency:
  group: npm-security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Report Node toolchain
        run: |
          node --version
          npm --version

      - name: Verify npm supply-chain policy
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' lockfiles < <(
            find . -name package-lock.json \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No package-lock.json files found." >&2
            exit 1
          fi

          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            node scripts/ci/verify-npm-lockfile.mjs "$package_dir"
          done

      - name: Audit npm dependency trees
        id: audit
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_ALLOW_GIT: none
          NPM_CONFIG_ALLOW_REMOTE: none
        run: |
          set -uo pipefail
          report_dir="$GITHUB_WORKSPACE/artifacts/npm-audit"
          mkdir -p "$report_dir"

          mapfile -d '' lockfiles < <(
            find . -name package-lock.json \
              -not -path '*/node_modules/*' \
              -print0 | sort -z
          )

          audit_failed=0
          for lockfile in "${lockfiles[@]}"; do
            package_dir="$(dirname "$lockfile")"
            relative_dir="${package_dir#./}"
            if [ "$relative_dir" = "." ] || [ -z "$relative_dir" ]; then
              relative_dir="root"
            fi
            report_name="$(printf '%s' "$relative_dir" | tr '/ ' '__')"
            report_path="$report_dir/${report_name}.json"

            echo "::group::npm audit: $relative_dir"
            set +e
            npm --prefix "$package_dir" audit --package-lock-only --json > "$report_path"
            status=$?
            set -e

            node - "$relative_dir" "$report_path" <<'NODE'
          const fs = require('node:fs');
          const [scope, reportPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(`scope=${scope}`);
          console.log(`counts=${JSON.stringify(counts)}`);

          for (const [name, entry] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (entry.via ?? [])
              .map(item => typeof item === 'string' ? item : `${item.source ?? 'advisory'}:${item.title ?? item.url ?? 'unknown'}`)
              .join(', ');
            const fix = entry.fixAvailable === true
              ? 'available'
              : entry.fixAvailable === false
                ? 'unavailable'
                : JSON.stringify(entry.fixAvailable);
            console.log(`${entry.severity}\t${name}\trange=${entry.range}\tfix=${fix}\tvia=${via}`);
          }
          NODE

            if [ "$status" -ne 0 ]; then
              audit_failed=1
            fi
            echo "::endgroup::"
          done

          echo "vulnerabilities_found=$audit_failed" >> "$GITHUB_OUTPUT"

      - name: Upload npm audit reports
        if: always()
        # The baseline check below remains authoritative if artifact storage
        # is unavailable or its quota is exhausted.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-reports
          path: artifacts/npm-audit/*.json
          if-no-files-found: warn

      - name: Enforce npm High/Critical baseline
        shell: bash
        run: |
          node scripts/ci/check-npm-audit-baseline.mjs \
            artifacts/npm-audit \
            scripts/ci/npm-audit-baseline.json

      - name: Report accepted npm audit debt
        if: steps.audit.outputs.vulnerabilities_found == '1'
        run: |
          echo "npm audit reported known vulnerable dependency trees."
          echo "High/Critical findings are allowed only when they exactly match the reviewed baseline."
          echo "Any new or stale High/Critical baseline entry fails the preceding gate."

  install-policy:
    name: npm install policy
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Classify changed npm install scopes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          base_sha="${BASE_SHA:-}"
          head_sha="${HEAD_SHA:-$GITHUB_SHA}"
          root=false
          frontend=false
          legacy=false
          inspection=false

          route_all() {
            root=true
            frontend=true
            legacy=true
            inspection=true
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ -z "$base_sha" || "$base_sha" == "$zero_sha" ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null || \
             ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            route_all
          else
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                .github/workflows/npm-security-audit.yml|scripts/ci/verify-npm-lockfile.mjs|scripts/ci/npm-ci-retry.sh)
                  route_all
                  ;;
                package.json|package-lock.json)
                  root=true
                  ;;
                frontend/package.json|frontend/package-lock.json)
                  frontend=true
                  ;;
                coglatas-frontend/package.json|coglatas-frontend/package-lock.json)
                  legacy=true
                  ;;
                tools/frontend-inspections/package.json|tools/frontend-inspections/package-lock.json)
                  inspection=true
                  ;;
              esac
            done < <(git diff --name-only "$base_sha" "$head_sha")
          fi

          {
            echo "root=$root"
            echo "frontend=$frontend"
            echo "legacy=$legacy"
            echo "inspection=$inspection"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### npm install-policy routing"
            echo "- root: $root"
            echo "- frontend: $frontend"
            echo "- legacy frontend: $legacy"
            echo "- frontend inspections: $inspection"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce root install policy
        if: steps.scope.outputs.root == 'true'
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Enforce frontend install policy
        if: steps.scope.outputs.frontend == 'true'
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Enforce legacy frontend install policy
        if: steps.scope.outputs.legacy == 'true'
        run: bash scripts/ci/npm-ci-retry.sh coglatas-frontend

      - name: Enforce frontend inspection install policy
        if: steps.scope.outputs.inspection == 'true'
        run: bash scripts/ci/npm-ci-retry.sh tools/frontend-inspections
