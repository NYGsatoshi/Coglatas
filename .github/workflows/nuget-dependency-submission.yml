name: NuGet Dependency Submission

# TEMPORARY CONTEST MODE: dependency submission is metadata publication, not a
# merge-safety gate. Keep it available manually while runner capacity is scarce.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nuget-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-nuget:
    name: detect-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Prove runner routing
        shell: bash
        run: |
          set -euo pipefail
          echo "runner.name=$RUNNER_NAME"
          echo "runner.os=$RUNNER_OS"
          echo "runner.arch=$RUNNER_ARCH"
          echo "runner.environment=$RUNNER_ENVIRONMENT"
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "Unexpected runner environment: $RUNNER_ENVIRONMENT" >&2
            exit 1
          fi

      - name: Checkout for read-only dependency detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test snapshot conversion
        run: python3 scripts/ci/test_nuget_dependency_snapshot.py

      - name: Install verified Component Detection release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_line="$(gh api repos/microsoft/component-detection/releases/latest \
            --jq '.assets[] | select(.name == "component-detection-linux-x64") | [.browser_download_url, .digest] | @tsv')"
          [[ -n "$asset_line" ]] || { echo "Component Detection release asset not found." >&2; exit 1; }
          IFS=$'\t' read -r asset_url asset_digest <<< "$asset_line"
          [[ "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Component Detection release asset has no SHA-256 digest." >&2
            exit 1
          }
          binary="$RUNNER_TEMP/component-detection"
          curl --fail --silent --show-error --location --proto '=https' \
            --proto-redir '=https' --retry 3 --output "$binary" "$asset_url"
          printf '%s  %s\n' "$asset_digest" "$binary" | sed 's/sha256://' | sha256sum --check -
          chmod 700 "$binary"

      - name: Detect NuGet dependencies without write permissions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/component-detection" scan \
            --SourceDirectory "$GITHUB_WORKSPACE" \
            --ManifestFile "$RUNNER_TEMP/nuget-component-detection.json" \
            --DetectorCategories NuGet
          python3 scripts/ci/nuget_dependency_snapshot.py \
            --scan "$RUNNER_TEMP/nuget-component-detection.json" \
            --output "$RUNNER_TEMP/nuget-snapshot.json" \
            --repo-root "$GITHUB_WORKSPACE" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload snapshot for the isolated publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-dependency-snapshot
          path: ${{ runner.temp }}/nuget-snapshot.json
          if-no-files-found: error
          retention-days: 1

  submit-nuget:
    name: submit-nuget
    needs: detect-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # No checkout or execution of repository-provided scripts in this job.
      - name: Download the same-run snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-dependency-snapshot
          path: ${{ runner.temp }}/nuget-publish

      - name: Verify snapshot identity and structure
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/nuget-publish/nuget-snapshot.json"
          test -f "$snapshot"
          test "$(find "$RUNNER_TEMP/nuget-publish" -type f | wc -l)" -eq 1
          test "$(stat -c %s "$snapshot")" -le 33554432
          jq -e --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" '
            .version == 0 and .sha == $sha and .ref == $ref and
            .job.id == $run and .job.correlator == "nuget-github-hosted" and
            .detector.name == "Component Detection" and
            .detector.version == "0.0.1" and
            (.manifests | type == "object" and length > 0) and
            ([.manifests[] | .resolved | length] | add > 0) and
            all(.manifests | to_entries[];
              .key == .value.name and
              .key == .value.file.source_location and
              (.key | startswith("/") | not) and
              (.key | split("/") | index("..") | not)) and
            all(.manifests[] | .resolved | to_entries[];
              .key == .value.package_url and
              (.key | startswith("pkg:nuget/")) and
              (.value.relationship == "direct" or .value.relationship == "indirect") and
              (.value.scope == "runtime" or .value.scope == "development") and
              (.value.dependencies | type == "array"))
          ' "$snapshot" >/dev/null

      - name: Submit NuGet dependency snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/nuget-publish/nuget-snapshot.json" \
            > "$RUNNER_TEMP/nuget-submission-response.json"
          jq -e '.result == "SUCCESS" or .result == "ACCEPTED"' \
            "$RUNNER_TEMP/nuget-submission-response.json" >/dev/null
          echo "NuGet dependency snapshot submitted."
