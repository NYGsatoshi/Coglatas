name: ProjectIDE Test Discovery Web E2E

on:
  push:
    branches: [projectide/integration-20261031]
    paths:
      - tests/ui/projectide-local-tests.spec.ts
      - tests/ui/run-angular-playwright.mjs
      - tests/ci/projectide-test-discovery-browser-receipt.mjs
      - tests/ci/projectide-test-discovery-browser-receipt.node-test.mjs
      - tests/ci/projectide-test-discovery-workflow-routing.node-test.mjs
      - frontend/src/app/features/projectide/**
      - frontend/src/app/core/i18n/messages/projectide.messages.ts
      - frontend/public/assets/projectide/**
      - frontend/scripts/generate-projectide-test-discovery-evidence.mjs
      - frontend/scripts/projectide-test-discovery-original-profiles.json
      - frontend/scripts/projectide-test-discovery-evidence-generator.node-test.mjs
      - .github/workflows/projectide-test-discovery-web-e2e.yml
  pull_request:
    paths:
      - tests/ui/projectide-local-tests.spec.ts
      - tests/ui/run-angular-playwright.mjs
      - tests/ci/projectide-test-discovery-browser-receipt.mjs
      - tests/ci/projectide-test-discovery-browser-receipt.node-test.mjs
      - tests/ci/projectide-test-discovery-workflow-routing.node-test.mjs
      - frontend/src/app/features/projectide/**
      - frontend/src/app/core/i18n/messages/projectide.messages.ts
      - frontend/public/assets/projectide/**
      - frontend/scripts/generate-projectide-test-discovery-evidence.mjs
      - frontend/scripts/projectide-test-discovery-original-profiles.json
      - frontend/scripts/projectide-test-discovery-evidence-generator.node-test.mjs
      - .github/workflows/projectide-test-discovery-web-e2e.yml

permissions:
  contents: read

concurrency:
  group: projectide-web-test-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-web:
    name: Actual Web Test Discovery (ubuntu-24.04, Chromium desktop/mobile)
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.base_ref == 'projectide/project-test-discovery-clients-20261118' ||
        github.base_ref == 'projectide/integration-20261031'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PROJECTIDE_BROWSER_RECEIPT_PATH: artifacts/projectide/browser-discovery-receipt.json
    steps:
      - name: Checkout exact candidate (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"

      - name: Install repository npm without lifecycle scripts
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund

      - name: Verify exact HEAD, selected test and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f tests/ui/projectide-local-tests.spec.ts
          grep -Fq "'tests/ui/projectide-local-tests.spec.ts'" tests/ui/run-angular-playwright.mjs
          node --check tests/ci/projectide-test-discovery-browser-receipt.mjs
          node --check tests/ui/run-angular-playwright.mjs
          node --test tests/ci/projectide-test-discovery-browser-receipt.node-test.mjs tests/ci/projectide-test-discovery-workflow-routing.node-test.mjs

      - name: Install root dependencies using reviewed lock/lifecycle policy
        run: bash scripts/ci/npm-ci-retry.sh .

      - name: Install Angular dependencies using reviewed lock/lifecycle policy
        run: bash scripts/ci/npm-ci-retry.sh frontend

      - name: Install Chromium browser with platform dependencies
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Build actual source-bound Angular production bundle
        run: npm --prefix frontend run build

      - name: Run and verify exact English/Japanese Test Discovery journeys
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/projectide-discovery-report.json
        run: |
          set -euo pipefail
          PLAYWRIGHT_JSON_OUTPUT_NAME="$(mktemp "$PLAYWRIGHT_JSON_OUTPUT_NAME.XXXXXX")"
          PLAYWRIGHT_STATIC_ROOT=frontend/dist/coglatas-web node tests/ui/serve-static.mjs --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          base_url=http://127.0.0.1:4173
          curl --fail --silent --show-error --retry 120 --retry-delay 1 --retry-max-time 120 --retry-connrefused "$base_url/health" >/dev/null
          kill -0 "$server_pid"
          PLAYWRIGHT_BASE_URL="$base_url" node node_modules/@playwright/test/cli.js test \
            tests/ui/projectide-local-tests.spec.ts \
            --project=chromium-desktop --project=chromium-mobile \
            --reporter=json
          test -s "$PLAYWRIGHT_JSON_OUTPUT_NAME"
          kill -0 "$server_pid"
          node tests/ci/projectide-test-discovery-browser-receipt.mjs

      - name: Upload only sanitized passing receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: projectide-web-test-discovery-receipt
          path: artifacts/projectide/browser-discovery-receipt.json
          if-no-files-found: error
          retention-days: 7
