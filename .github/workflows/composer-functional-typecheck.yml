name: Composer Functional Typecheck

on:
  pull_request:
    paths:
      - 'tests/functional/**'
      - 'scripts/ci/functional_diagnostics.py'
      - 'scripts/ci/test-functional-diagnostics.py'
      - '.github/workflows/composer-functional-typecheck.yml'

permissions:
  contents: read

jobs:
  strict-composer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install repository npm version without lifecycle scripts
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Restore root and frontend dependencies using existing trust policy
        run: |
          bash scripts/ci/npm-ci-retry.sh .
          bash scripts/ci/npm-ci-retry.sh frontend
      - name: Strict no-emit Messaging Functional TypeScript contract
        run: npm run typecheck:functional:messaging
