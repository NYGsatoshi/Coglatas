name: SEC-04 Schemathesis Deep

on:
  workflow_dispatch:
  # Fixed, read-only source qualification; this does not reactivate the schedule.
  push:
    branches: [fix/sec04-deep-execution-20261027]
  # Scheduled trigger temporarily disabled on 2026-09-19 to reduce CI consumption.
  # schedule:
  #   - cron: "23 18 * * 1"

concurrency:
  group: sec04-schemathesis-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sec04-schemathesis-deep:
    name: SEC-04 Schemathesis deep
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      COGLATAS_SEC04_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      # The existing processor contract explicitly compiles Python modules.
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/sec04-pycache
      # Existing public security Compose sentinel; no licensed UI is built or tested.
      SYNCFUSION_LICENSE: compose-config-validation-placeholder
      POSTGRES_DB: coglatas
      POSTGRES_USER: coglatas
      POSTGRES_PASSWORD: ci_dummy_password
      DB_PASSWORD: ci_dummy_password
      LOCAL_ADMIN_PASSWORD: ci_dummy_local_admin_password
      COGLATAS_SECURITY_SCHEMATHESIS_LANE: deep

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create masked synthetic security credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
          printf '::add-mask::%s\n' "$password"
          printf 'COGLATAS_SECURITY_CI_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify deep execution and false-green contracts
        run: python3 -B -m unittest discover -s tests/ci -p test_sec04_deep_ci.py -v

      - name: Verify existing Schemathesis processor boundaries
        run: bash scripts/security/test-schemathesis-contract.sh

      - name: Restore
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity normal

      - name: Validate isolated SEC-02 Compose topology
        shell: bash
        run: >-
          docker compose
          -p coglatas-sec04-deep-config
          -f infra/compose/test/real-backend-smoke.yml
          -f infra/compose/security/security.yml
          config --format json
          | python3 scripts/ci/verify-security-compose.py

      - name: Execute and verify the isolated SEC-04 deep lane
        id: execute
        run: python3 -B scripts/ci/run-sec04-deep-ci.py

      - name: Preserve the closed execution outcome
        if: always() && steps.execute.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sec04-deep-execution-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/sec04-deep-execution/result.json
          if-no-files-found: error
          retention-days: 7
