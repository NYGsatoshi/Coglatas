name: SEC-04 Schemathesis Deep

on:
  workflow_dispatch:
  # Scheduled trigger temporarily disabled on 2026-09-19 to reduce CI consumption.
  # schedule:
  #   - cron: "23 18 * * 1"

concurrency:
  group: sec04-schemathesis-deep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sec04-schemathesis-deep:
    name: SEC-04 Schemathesis deep
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      POSTGRES_DB: coglatas
      POSTGRES_USER: coglatas
      POSTGRES_PASSWORD: ci_dummy_password
      DB_PASSWORD: ci_dummy_password
      LOCAL_ADMIN_PASSWORD: ci_dummy_local_admin_password
      COGLATAS_SECURITY_SCHEMATHESIS_LANE: deep

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create masked synthetic security credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )"
          printf '::add-mask::%s\n' "$password"
          printf 'COGLATAS_SECURITY_CI_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Coglatas.slnx --disable-parallel --verbosity normal

      - name: Run isolated SEC-04 deep gate
        shell: bash
        run: >-
          docker compose
          -p coglatas-sec04-deep-config
          -f docker-compose.real-backend-smoke.yml
          -f docker-compose.security.yml
          config --format json
          | python3 scripts/ci/verify-security-compose.py

      - name: Upload sanitized SEC-04 evidence on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sec04-schemathesis-deep-evidence
          path: artifacts/security/schemathesis/
          if-no-files-found: warn
          retention-days: 7
