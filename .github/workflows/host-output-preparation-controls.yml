name: Host output preparation controls
on:
  pull_request:
    paths:
      - 'tests/ui/prepare-host-artifacts.mjs'
      - 'tests/ui/prepare-host-artifacts.node-test.mjs'
      - 'tests/ui/run-real-backend-fci04.mjs'
      - '.github/workflows/host-output-preparation-controls.yml'
  push:
    branches: [main]
    paths:
      - 'tests/ui/prepare-host-artifacts.mjs'
      - 'tests/ui/prepare-host-artifacts.node-test.mjs'
      - 'tests/ui/run-real-backend-fci04.mjs'
      - '.github/workflows/host-output-preparation-controls.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - name: Check host output preparation contracts
        run: node --test tests/ui/prepare-host-artifacts.node-test.mjs
