name: Qodana Deep Analysis

# Qodana policy execution is intentionally kept out of this PR-mutable caller.
# The reusable gate is pinned to an immutable commit so an external PR cannot
# edit or remove its restore, scan, or SARIF-guard steps.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  # Scheduled trigger temporarily disabled on 2026-09-19 to reduce CI consumption.
  # schedule:
  #   - cron: "17 18 * * 0"

concurrency:
  group: qodana-deep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana-dotnet-community:
    name: Qodana Gate
    permissions:
      contents: read
    uses: NYGsatoshi/Coglatas/.github/workflows/qodana_trusted_gate.yml@a83fc584cb9de79fc08410af6d50b647bb541293 # qodana-debt-ratchet-v2
