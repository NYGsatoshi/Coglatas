name: Compatibility Critical Suite Preflight

on:
  workflow_call:
    inputs:
      reuse_main_frontend_artifact:
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/compat-critical-preflight.yml"
      - ".github/workflows/mobile-compatibility.yml"
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/ci/compat-critical*"
      - "scripts/ci/build-compat-critical-grep.mjs"
      - "scripts/ci/run-compat-critical.mjs"
      - "scripts/ci/verify-compat-critical.mjs"
      - "scripts/ci/run-webkit-pinned.mjs"
      - "scripts/ci/verify-webkit-pinned-runtime.mjs"
      - "tests/ui/**"
      - "docs/ci/compat-critical-suite.md"
      - "docs/TESTING.md"
concurrency:
  group: compat-critical-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compat-critical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install repository Playwright dependencies
        run: npm ci --prefer-offline --ignore-scripts --no-audit --no-fund

      - name: Self-test compat-critical contract
        run: >-
          node --test
          tests/ui/compat-critical-contract.node-test.mjs
          tests/ui/compat-browser-engine-workflow.node-test.mjs
          tests/ui/webkit-pinned-provisioning.node-test.mjs

      - name: Check compat-critical runner syntax
        shell: bash
        run: |
          node --check scripts/ci/compat-critical-contract.mjs
          node --check scripts/ci/build-compat-critical-grep.mjs
          node --check scripts/ci/run-compat-critical.mjs
          node --check scripts/ci/verify-compat-critical.mjs

      - name: Verify Chromium browser-engine selection
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile browser-engine
          --project chromium-desktop

      - name: Verify Firefox browser-engine selection
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile browser-engine
          --project firefox-desktop

      - name: Verify WebKit browser-engine selection
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile browser-engine
          --project webkit-desktop

      - name: Verify Chromium mobile selection against Playwright discovery
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile mobile
          --project chromium-mobile

      - name: Verify WebKit mobile selection against Playwright discovery
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile mobile
          --project webkit-mobile

      - name: Verify narrow 320 selection against Playwright discovery
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile mobile
          --project narrow-320

      - name: Verify OS-portability selection against Playwright discovery
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile os-portability
          --project chromium-desktop

      - name: Verify real-backend selection against Playwright discovery
        run: >-
          node scripts/ci/verify-compat-critical.mjs
          --profile real-backend
          --project chromium-desktop

      - name: Summarize COMPAT-04 contract
        shell: bash
        run: |
          {
            echo "### COMPAT-04 critical compatibility contract"
            echo
            echo "- Manifest schema and fail-closed invariants self-tested"
            echo "- Selected source tests resolved by exact title"
            echo "- Browser-engine, all three mobile projects, OS-portability, and real-backend profiles discovered by Playwright"
            echo "- Chromium, Firefox, and WebKit desktop projects select the same browser-engine profile"
            echo "- Zero-test, missing-category, obsolete/superseded, and quarantine-only states fail closed"
            echo "- Selected tests reject arbitrary sleep, unseeded randomness, and pixel-only snapshot assertions"
            echo "- Selected tests reject inline skip, fixme, and expected-failure exceptions"
            echo "- Compatibility execution forces retries=0"
          } >> "$GITHUB_STEP_SUMMARY"

  compat-browser-engine:
    if: inputs.reuse_main_frontend_artifact == true
    needs: compat-critical-preflight
    name: compat-${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            project: chromium-desktop
            browser: chromium
          - engine: firefox
            project: firefox-desktop
            browser: firefox
          - engine: webkit
            project: webkit-desktop
            browser: webkit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install repository Playwright dependencies
        run: npm ci --prefer-offline --ignore-scripts --no-audit --no-fund

      - name: Download Main Frontend producer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-frontend-build
          path: ${{ runner.temp }}/main-frontend-build

      - name: Restore prebuilt frontend output
        run: bash scripts/ci/restore-main-frontend-build.sh "$RUNNER_TEMP/main-frontend-build" "$GITHUB_SHA" "$GITHUB_WORKSPACE"

      - name: Install ${{ matrix.engine }} browser and system dependencies
        if: matrix.engine != 'webkit'
        run: node node_modules/@playwright/test/cli.js install --with-deps "${{ matrix.browser }}"

      - name: Acquire pinned WebKit runtime
        if: matrix.engine == 'webkit'
        run: node scripts/ci/run-webkit-pinned.mjs prepare

      - name: Run compat-critical on ${{ matrix.engine }} with zero retries
        if: matrix.engine != 'webkit'
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        run: npm run test:ui:compat-critical -- --profile browser-engine -- --project=${{ matrix.project }}

      - name: Run WebKit compat-critical in pinned runtime with zero retries
        if: matrix.engine == 'webkit'
        run: node scripts/ci/run-webkit-pinned.mjs run

      - name: Summarize engine evidence
        if: always()
        shell: bash
        run: |
          {
            echo "### COMPAT-01 ${{ matrix.engine }} evidence"
            echo
            echo "- Project: \`${{ matrix.project }}\`"
            echo "- Selection source: \`compat-critical/browser-engine\`"
            echo "- Playwright retries: \`0\`"
            if [ "${{ matrix.engine }}" = "webkit" ]; then
              echo "- WebKit coverage is engine compatibility evidence, not real Safari-device certification."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.engine }} compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compat-${{ matrix.engine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
