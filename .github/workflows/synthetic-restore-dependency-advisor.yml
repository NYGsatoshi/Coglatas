name: Synthetic Restore Dependency Advisor
on:
  pull_request:
    paths:
      - 'scripts/ci/restore-data-dependency-advisor.mjs'
      - 'tests/ci/test_restore_data_dependency_advisor.mjs'
      - 'docs/verification/synthetic-restore-dependency-advisor.md'
      - '.github/workflows/synthetic-restore-dependency-advisor.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/restore-data-dependency-advisor.mjs'
      - 'tests/ci/test_restore_data_dependency_advisor.mjs'
      - '.github/workflows/synthetic-restore-dependency-advisor.yml'
permissions:
  contents: read
jobs:
  synthetic-only-plan-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
      - run: node --test tests/ci/test_restore_data_dependency_advisor.mjs
