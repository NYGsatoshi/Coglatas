name: Local performance evidence pilot

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current PR head, or exact Main for PR number zero
        required: true
        type: string
      base_sha:
        description: Current Main for a PR; approved ancestor for Main qualification
        required: true
        type: string
      pr_number:
        description: PR number, or zero for Main qualification
        required: true
        type: string
      evidence_commit_sha:
        description: Immutable commit containing the signed bundle directory in this repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: performance-local-evidence-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require trusted Main dispatch
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = NYGsatoshi/Coglatas
      - name: Checkout trusted Main verifier and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: trusted-main
      - name: Resolve authoritative source and tree
        id: identity
        working-directory: trusted-main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVIDENCE_COMMIT_SHA: ${{ inputs.evidence_commit_sha }}
        run: python3 scripts/performance/local-github-preflight.py
      - name: Read immutable evidence commit as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.evidence_commit_sha }}
          persist-credentials: false
          fetch-depth: 1
          path: evidence-source
      - name: Verify signature, identities, complete raw cohorts and statistical decisions
        working-directory: trusted-main
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          TREE_SHA: ${{ steps.identity.outputs.tree_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 scripts/performance/performance-local.py verify \
            --bundle ../evidence-source/bundle \
            --expected-sha "$SOURCE_SHA" --expected-base "$BASE_SHA" \
            --expected-tree "$TREE_SHA" --pr-number "$PR_NUMBER" \
            --output ../artifacts/local-evidence-verification.json
      - name: Preserve independent verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-performance-evidence-verification
          path: artifacts/local-evidence-verification.json
          if-no-files-found: warn
          retention-days: 90
