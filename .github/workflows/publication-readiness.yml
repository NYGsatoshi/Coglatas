name: Publication Readiness

on:
  workflow_dispatch:
  pull_request: # Required check: intentionally unfiltered.
  push:
    branches: ["main"]

concurrency:
  group: publication-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publication-readiness:
    name: publication-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test publication and trust-boundary parsers
        run: |
          python3 -m py_compile \
            scripts/ci/required_check_contract.py \
            scripts/ci/check-required-pr-checks.py \
            scripts/ci/github_action_pins.py \
            scripts/ci/test_github_action_pins.py \
            scripts/ci/verify-mvp-a-final-checks.py \
            scripts/ci/test-mvp-a-final-checks.py
          ruby scripts/ci/test-workflow-trust-boundaries-upper-bound.rb
          python3 scripts/ci/test-publication-readiness.py
          python3 scripts/ci/test_github_action_pins.py
          python3 scripts/ci/test-mvp-a-final-checks.py
          python3 scripts/ci/test-main-check-results.py

      - name: Enforce publication safety, trust boundaries, required-check topology, and Action pins
        run: |
          ruby scripts/ci/check-workflow-trust-boundaries-upper-bound.rb
          python3 scripts/ci/github_action_pins.py --inventory-out "${RUNNER_TEMP}/github-actions-inventory.json"
          python3 scripts/ci/check-publication-readiness.py
          python3 scripts/ci/check-required-pr-checks.py

      - name: Scan PR diff or current ref history with Gitleaks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # With no --log-opts, Gitleaks scans --all local refs. Full-history
          # checkout fetches topic branches too, so bind non-PR scans to this ref.
          scan_log_opts="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            [[ -n "$merge_base" ]] || {
              echo "::error::Unable to resolve the PR merge base for Gitleaks."
              exit 1
            }
            scan_log_opts="${merge_base}..${PR_HEAD_SHA}"
          fi
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --redact --verbose \
            --log-opts="$scan_log_opts" \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --report-format json \
            --report-path /repo/gitleaks-publication-report.json
          status=$?
          set -e
          [[ -f gitleaks-publication-report.json ]] || printf '[]\n' > gitleaks-publication-report.json
          exit "$status"

      - name: Upload Action inventory on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-readiness-action-inventory
          path: ${{ runner.temp }}/github-actions-inventory.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload redacted Gitleaks report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-readiness-gitleaks-report
          path: gitleaks-publication-report.json
          if-no-files-found: ignore
          retention-days: 7
