name: External PR approval evaluator

# Compatibility workflow only. External approval is no longer a PR merge gate.
on:
  workflow_run:
    workflows: ["External PR review signal"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Compatibility input; no approval status is published
        required: false
        type: string

permissions: {}

concurrency:
  group: external-pr-approval-compat-${{ github.event.workflow_run.id || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: External PR approval evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Governance approval gate retired
        run: |
          echo "External PR approval is no longer a required merge status."
          echo "Default-branch write authority is enforced by native GitHub repository permissions and owner-only rulesets."
          echo "This workflow remains temporarily for required-check registry compatibility and publishes no commit status."
