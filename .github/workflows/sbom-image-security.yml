name: SBOM Image Security

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  release:
    types: [published]

concurrency:
  group: sbom-image-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYFT_VERSION: "1.51.0"
  GRYPE_VERSION: "0.118.0"
  TRIVY_VERSION: "0.65.0"
  EVIDENCE_REPOSITORY_SHA: ${{ github.sha }}

jobs:
  image-sbom:
    name: sbom-image-trusted
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 90

    env:
      SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
      IMAGE_NAME: coglatas-nyg-sbom:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: plain

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Syft
        run: bash scripts/ci/install-syft.sh

      - name: Install pinned Grype
        run: bash scripts/ci/install-grype.sh

      - name: Prepare leak-detection marker
        shell: bash
        run: |
          marker="SEC09_FAKE_SECRET_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${GITHUB_JOB}"
          printf 'COGLATAS_SBOM_FAKE_SECRET=%s\n' "$marker" >> "$GITHUB_ENV"

      - name: Build licensed production image
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SYNCFUSION_LICENSE:-}" || {
            echo "SYNCFUSION_LICENSE is not configured in the protected environment." >&2
            exit 1
          }
          license_file="$(mktemp)"
          trap 'rm -f "$license_file"' EXIT
          chmod 600 "$license_file"
          printf '%s' "$SYNCFUSION_LICENSE" > "$license_file"
          docker build \
            --pull \
            --progress=plain \
            --secret id=syncfusion_license,src="$license_file" \
            --tag "$IMAGE_NAME" \
            .

      - name: Bind evidence to immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(docker image inspect --format '{{.Id}}' "$IMAGE_NAME")"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Docker returned a non-content-addressed image identity: $image_digest" >&2
            exit 1
          }
          docker image inspect "$image_digest" >/dev/null
          printf 'IMAGE_DIGEST=%s\n' "$image_digest" >> "$GITHUB_ENV"
          mkdir -p artifacts/sbom/image
          printf '%s\n' "$image_digest" > artifacts/sbom/image/image.digest

      - name: Verify runtime image hygiene and application payload
        shell: bash
        run: |
          docker run --rm --entrypoint sh "$IMAGE_DIGEST" -c '
            test -s /app/Coglatas.Web.dll &&
            test -s /app/Coglatas.Web.deps.json &&
            test ! -e /run/secrets &&
            test ! -e /app/.env &&
            ! env | grep -q "^SYNCFUSION_LICENSE=" &&
            ! find /app -type f \( -name ".env" -o -name ".env.*" -o -name "syncfusion-license.txt" \) -print -quit | grep -q .
          '

      - name: Generate and validate final image SBOM
        shell: bash
        run: |
          set -euo pipefail
          first="${RUNNER_TEMP}/coglatas-sbom-image-first"
          second="${RUNNER_TEMP}/coglatas-sbom-image-second"
          final_out="artifacts/sbom/image"
          rm -rf "$first" "$second"

          bash scripts/ci/generate-sbom.sh docker "$IMAGE_DIGEST" "$first"
          cp "$first/sbom.cyclonedx.json" "$first/sbom.spdx.json" "$final_out/"

          python3 scripts/ci/verify_sbom.py validate \
            --cyclonedx "$final_out/sbom.cyclonedx.json" \
            --spdx "$final_out/sbom.spdx.json" \
            --kind image \
            --repository-sha "$EVIDENCE_REPOSITORY_SHA" \
            --run-identity "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}" \
            --syft-version "$SYFT_VERSION" \
            --identity-digest "$IMAGE_DIGEST" \
            --metadata-out "$final_out/metadata.json" \
            --normalized-out "$final_out/components.normalized.json" \
            --require-package "curl" \
            --forbid-value "$COGLATAS_SBOM_FAKE_SECRET" \
            --forbid-value "$SYNCFUSION_LICENSE"

          python3 scripts/ci/verify_sbom.py verify-hashes \
            --metadata "$final_out/metadata.json"

          python3 scripts/ci/audit_sbom_component_inventory.py \
            --sbom "$final_out/sbom.cyclonedx.json" \
            --out "$final_out/component-inventory-warnings.json"

          bash scripts/ci/generate-sbom.sh docker "$IMAGE_DIGEST" "$second"
          python3 scripts/ci/verify_sbom.py validate \
            --cyclonedx "$second/sbom.cyclonedx.json" \
            --spdx "$second/sbom.spdx.json" \
            --kind image \
            --repository-sha "$EVIDENCE_REPOSITORY_SHA" \
            --run-identity "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${GITHUB_JOB}/repeat" \
            --syft-version "$SYFT_VERSION" \
            --identity-digest "$IMAGE_DIGEST" \
            --metadata-out "$second/metadata.json" \
            --normalized-out "$second/components.normalized.json" \
            --require-package "curl" \
            --forbid-value "$COGLATAS_SBOM_FAKE_SECRET" \
            --forbid-value "$SYNCFUSION_LICENSE"

          cmp --silent "$final_out/components.normalized.json" "$second/components.normalized.json" || {
            echo "Same immutable image digest produced a different normalized component projection." >&2
            diff -u "$final_out/components.normalized.json" "$second/components.normalized.json" || true
            exit 1
          }

      - name: Gate digest-bound SBOM vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          final_out="artifacts/sbom/image"
          trivy_cache="${RUNNER_TEMP}/coglatas-trivy-cache"
          rm -rf "$trivy_cache"
          mkdir -p "$trivy_cache"

          grype version -o json > "$final_out/grype-version.json"
          grype db update
          grype db status -o json > "$final_out/grype-db-status.json"
          grype "sbom:$final_out/sbom.cyclonedx.json" \
            -o json > "$final_out/grype-vulnerabilities.json"
          python3 scripts/ci/verify_grype_sbom_source.py \
            --report "$final_out/grype-vulnerabilities.json" \
            --sbom "$final_out/sbom.cyclonedx.json"

          docker run --rm \
            -v "$trivy_cache:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image --download-db-only

          docker run --rm \
            -v "$trivy_cache:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" \
            version --format json > "$final_out/trivy-version.json"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$trivy_cache:/root/.cache/trivy" \
            -v "$PWD:/repo" \
            "aquasec/trivy:${TRIVY_VERSION}" \
            image --skip-db-update --scanners vuln --vuln-type os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output "/repo/$final_out/trivy-vulnerabilities.json" \
            "$IMAGE_DIGEST"

          python3 scripts/ci/verify_sbom_vulnerability_gate.py \
            --sbom "$final_out/sbom.cyclonedx.json" \
            --sbom-metadata "$final_out/metadata.json" \
            --image-digest "$IMAGE_DIGEST" \
            --grype-report "$final_out/grype-vulnerabilities.json" \
            --grype-version-json "$final_out/grype-version.json" \
            --grype-db-status "$final_out/grype-db-status.json" \
            --grype-version "$GRYPE_VERSION" \
            --trivy-report "$final_out/trivy-vulnerabilities.json" \
            --trivy-version-json "$final_out/trivy-version.json" \
            --trivy-version "$TRIVY_VERSION" \
            --policy security/sbom-vulnerability-policy.json \
            --normalized-out "$final_out/vulnerabilities.normalized.json" \
            --summary-out "$final_out/vulnerability-gate-summary.json"

      - name: Upload SEC-10 vulnerability evidence on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-vulnerability-failure-${{ env.EVIDENCE_REPOSITORY_SHA }}
          path: |
            artifacts/sbom/image/grype-version.json
            artifacts/sbom/image/grype-db-status.json
            artifacts/sbom/image/grype-vulnerabilities.json
            artifacts/sbom/image/trivy-version.json
            artifacts/sbom/image/trivy-vulnerabilities.json
            artifacts/sbom/image/vulnerabilities.normalized.json
            artifacts/sbom/image/vulnerability-gate-summary.json
            artifacts/sbom/image/component-inventory-warnings.json
            artifacts/sbom/image/metadata.json
            artifacts/sbom/image/sbom.cyclonedx.json
            artifacts/sbom/image/image.digest
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload final image SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-image-${{ env.EVIDENCE_REPOSITORY_SHA }}
          path: artifacts/sbom/image
          if-no-files-found: error
          retention-days: 30

      - name: Remove per-run image
        if: always()
        run: docker image rm --force "$IMAGE_NAME" || true
