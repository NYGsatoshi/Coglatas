name: Mobile Setup Diagnostic Controls

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-setup-diagnostic-controls.yml"
      - "scripts/ci/run-real-backend-mobile.mjs"
      - "tests/ui/mobile-setup-diagnostics.node-test.mjs"

permissions:
  contents: read

jobs:
  closed-setup-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Verify closed filesystem, source, phase and CLI privacy controls
        run: node --test tests/ui/mobile-setup-diagnostics.node-test.mjs
