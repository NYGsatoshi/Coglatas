name: SonarCloud Scanner

# CI uploads .NET/multi-language analysis to SonarQube Cloud.
# The bound SonarCloud GitHub App publishes the native PR check, summary comment,
# and inline annotations. Do not reintroduce custom SARIF/Checks publication.
# workflow_run resolves an immutable same-repository revision after successful PR CI,
# and environment reviewers approve before the scanner receives its secret.
on: # zizmor: ignore[dangerous-triggers]
  push:
    # Bootstrap this reviewed PR before workflow_dispatch/workflow_run are
    # registered on main. The protected environment still requires review.
    branches: [main, codex/restore-sonarcloud-ci-20261017]
  workflow_run:
    workflows: [PR CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR number (empty scans main)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.event.workflow_run.head_branch || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      ref: ${{ steps.revision.outputs.ref }}
      pr: ${{ steps.revision.outputs.pr }}
      branch: ${{ steps.revision.outputs.branch }}
      base: ${{ steps.revision.outputs.base }}
      head: ${{ steps.revision.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve exact eligible revision without executing PR code
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/codex/restore-sonarcloud-ci-20261017' && '1235' || inputs.pr_number }}
        run: |
          python scripts/ci/test-sonarcloud-ci.py
          python scripts/ci/sonarcloud-ci.py resolve

  analyze:
    needs: resolve
    # Redundant fork and CI-success guard: never release the environment token
    # for a fork or an unsuccessful upstream workflow.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: sonarcloud-analysis-${{ needs.resolve.outputs.pr || 'main' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewers must approve the exact revision before releasing the
    # project-scoped token: MSBuild inputs are executable repository code.
    environment:
      name: sonarcloud-analysis
      url: https://github.com/${{ github.repository }}/commit/${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout approved analysis revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: source/global.json
      - name: Install pinned SonarScanner
        run: dotnet tool install dotnet-sonarscanner --version 12.0.0 --tool-path "$RUNNER_TEMP/sonar"
      - name: Begin analysis
        working-directory: source
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
          PR_BRANCH: ${{ needs.resolve.outputs.branch }}
          PR_BASE: ${{ needs.resolve.outputs.base }}
          REVISION: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN" && test -n "$SONAR_ORGANIZATION" && test -n "$SONAR_PROJECT_KEY"
          args=("/k:$SONAR_PROJECT_KEY" "/o:$SONAR_ORGANIZATION" "/d:sonar.token=$SONAR_TOKEN" "/d:sonar.host.url=https://sonarcloud.io" "/d:sonar.scm.revision=$REVISION" "/d:sonar.python.coverage.reportPaths=coverage.xml" "/d:sonar.qualitygate.wait=false")
          while IFS= read -r line; do
            case "$line" in sonar.exclusions=*|sonar.cpd.exclusions=*|sonar.sourceEncoding=*) args+=("/d:$line");; esac
          done < ../tooling/.sonarcloud.properties
          if [[ -n "$PR_NUMBER" ]]; then
            args+=("/d:sonar.pullrequest.key=$PR_NUMBER" "/d:sonar.pullrequest.branch=$PR_BRANCH" "/d:sonar.pullrequest.base=$PR_BASE")
          else
            args+=("/d:sonar.branch.name=main")
          fi
          "$RUNNER_TEMP/sonar/dotnet-sonarscanner" begin "${args[@]}"
      - name: Build with Sonar analyzers
        working-directory: source
        run: dotnet build Coglatas.slnx --configuration Release --no-incremental
      - name: Run reviewed revision-boundary tests and collect Python coverage
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sonar-python"
          "$RUNNER_TEMP/sonar-python/bin/python" -m pip install --disable-pip-version-check --no-deps coverage==7.13.3
          "$RUNNER_TEMP/sonar-python/bin/python" -m coverage run --branch --include='*/scripts/ci/sonarcloud-ci.py' scripts/ci/test-sonarcloud-ci.py
          "$RUNNER_TEMP/sonar-python/bin/python" -m coverage xml -o coverage.xml
          "$RUNNER_TEMP/sonar-python/bin/python" -m coverage report -m --include='*/scripts/ci/sonarcloud-ci.py' --fail-under=80
      - name: Submit analysis
        working-directory: source
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/sonar/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
      # The SonarCloud GitHub App reports Quality Gate and issues once the
      # SonarCloud project is bound to NYGsatoshi/Coglatas. No local SARIF upload,
      # issue-comment bot, or GitHub Check Run impersonation is performed here.
