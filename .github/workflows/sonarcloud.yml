name: SonarCloud

# SonarScanner needs an analysis token. Never execute it on untrusted PR code.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sonarcloud-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: SonarCloud / trusted main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: syncfusion-licensed-build
    timeout-minutes: 65
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SONAR_SCANNER_VERSION: "11.3.0"

    steps:
      - name: Checkout trusted main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository-pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Require configured SonarCloud project and token
        shell: bash
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          for variable in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure ${variable} for the SonarCloud CI-based analysis before enabling this workflow."
              exit 1
            fi
          done

      - name: Install pinned SonarScanner for .NET
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install dotnet-sonarscanner \
            --tool-path "${RUNNER_TEMP}/sonar-scanner" \
            --version "${SONAR_SCANNER_VERSION}"

      - name: Restore .NET solution
        run: dotnet restore Coglatas.slnx --verbosity minimal

      - name: Begin SonarCloud analysis
        shell: bash
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/sonar-scanner/dotnet-sonarscanner" begin \
            "/k:${SONAR_PROJECT_KEY}" \
            "/o:${SONAR_ORGANIZATION}" \
            "/d:sonar.host.url=https://sonarcloud.io" \
            "/d:sonar.token=${SONAR_TOKEN}" \
            "/d:sonar.sourceEncoding=UTF-8" \
            "/d:sonar.qualitygate.wait=true" \
            "/d:sonar.qualitygate.timeout=300" \
            "/d:sonar.cs.opencover.reportsPaths=artifacts/sonarcloud-test-results/**/coverage.opencover.xml" \
            "/d:sonar.cs.vstest.reportsPaths=artifacts/sonarcloud-test-results/**/*.trx" \
            "/d:sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/TestResults/**,**/test-results/**,**/playwright-report/**,**/.playwright/**,**/storybook-static/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,src/Coglatas.Web/data/**,coglatas-frontend/**" \
            "/d:sonar.cpd.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,**/artifacts/**,src/Coglatas.Web/wwwroot/**,coglatas-frontend/**"

      - name: Build solution for C# and cross-stack analysis
        run: dotnet build Coglatas.slnx --configuration Release --no-restore --no-incremental --disable-build-servers -m

      - name: Collect backend OpenCover and test results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sonarcloud-test-results
          dotnet test tests/Coglatas.Tests/Coglatas.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --disable-build-servers \
            -m:1 \
            --collect "XPlat Code Coverage" \
            --logger "trx;LogFileName=sonarcloud-backend.trx" \
            --results-directory artifacts/sonarcloud-test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          if ! find artifacts/sonarcloud-test-results -type f -name coverage.opencover.xml -print -quit | grep -q .; then
            echo "::error::The backend test collector did not produce OpenCover evidence."
            exit 1
          fi

      - name: Submit SonarCloud report and enforce Quality Gate
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/sonar-scanner/dotnet-sonarscanner" end "/d:sonar.token=${SONAR_TOKEN}"
