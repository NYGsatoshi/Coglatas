name: Pinned Quality Tool Acquisition

on:
  pull_request:
    paths:
      - .github/workflows/qodana-cli-acquisition.yml
      - .github/workflows/qodana_trusted_gate.yml
      - .github/workflows/codeql.yml
      - scripts/ci/install-qodana-cli.sh
      - scripts/ci/test_install_qodana_cli.py
  push:
    branches: [main]
    paths:
      - .github/workflows/qodana-cli-acquisition.yml
      - .github/workflows/qodana_trusted_gate.yml
      - .github/workflows/codeql.yml
      - scripts/ci/install-qodana-cli.sh
      - scripts/ci/test_install_qodana_cli.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-cli:
    name: Verify pinned Qodana CLI acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run native refusal controls
        run: python3 -B scripts/ci/test_install_qodana_cli.py
      - name: Acquire and verify the original pinned release
        run: bash scripts/ci/install-qodana-cli.sh
      - name: Execute the installed CLI on Linux
        shell: bash
        run: |
          command -v qodana
          qodana --version
      - name: Verify successful fallback with the authenticated release bytes
        shell: bash
        run: |
          python3 -B scripts/ci/test_install_qodana_cli.py \
            --verified-archive "$(dirname "$(command -v qodana)")/qodana-linux.tar.gz"

  codeql-selector-control:
    name: Original CodeQL selector after optional warm transfer failure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the pinned action's different bundled default for this control
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE/CodeQL/2.27.3/x64"
          if [[ -d "$cache" && -f "$cache.complete" ]]; then
            test "$("$cache/codeql/codeql" version --format=terse)" = '2.27.3'
            exit 0
          fi
          test ! -e "$cache"
          test ! -e "$cache.complete"
          archive="$RUNNER_TEMP/codeql-control-2.27.3.tar.zst"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-delay 5 --retry-max-time 240 \
            --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/github/codeql-action/releases/assets/648290290' --output "$archive"
          printf '%s  %s\n' '5e7607e1b721728955e31f5402d460ad227cbd2ffed0d4cc610116755796150e' "$archive" | sha256sum --check -
          mkdir -p "$(dirname "$cache")"
          mkdir "$cache"
          tar --zstd --extract --file "$archive" --directory "$cache" --no-same-owner
          test "$("$cache/codeql/codeql" version --format=terse)" = '2.27.3'
          touch "$cache.complete"
      - name: Execute the actual warm step with both transfers unavailable
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/actual-codeql-warm.sh"
          ruby -ryaml -e 'w = YAML.load_file(".github/workflows/codeql.yml"); s = w.fetch("jobs").fetch("analyze").fetch("steps").find { |x| x["name"] == "Warm the normal CodeQL cache with the verified stable bundle" }; File.write(ARGV.fetch(0), s.fetch("run"))' "$script"
          fixture_cache="$(mktemp -d "$RUNNER_TEMP/codeql-control-cache.XXXXXXXX")"
          mock_bin="$(mktemp -d "$RUNNER_TEMP/codeql-control-transfer.XXXXXXXX")"
          printf '#!/usr/bin/env bash\nprintf "call\\n" >> "$WARM_TRANSFER_LOG"\nexit 22\n' > "$mock_bin/curl"
          chmod 0755 "$mock_bin/curl"
          transfer_log="$RUNNER_TEMP/codeql-control-transfers"
          RUNNER_TOOL_CACHE="$fixture_cache" PATH="$mock_bin:$PATH" WARM_TRANSFER_LOG="$transfer_log" bash "$script"
          test "$(wc -l < "$transfer_log")" -eq 2
          test ! -e "$fixture_cache/CodeQL/2.27.4/x64.complete"
          test ! -e "$fixture_cache/CodeQL/2.27.4/x64/codeql/codeql"
      - name: Run the original selector for its different bundled default
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          tools: linked
          languages: actions
          build-mode: none
      - name: Verify the different selected CLI remains available
        shell: bash
        run: |
          test "$("$RUNNER_TOOL_CACHE/CodeQL/2.27.3/x64/codeql/codeql" version --format=terse)" = '2.27.3'
          echo 'Original selector initialized the different bundled default after both optional warm transfers failed. No analysis or SARIF import is claimed.'
