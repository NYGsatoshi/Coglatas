# Test-only real-backend browser smoke stack.
# It runs PostgreSQL, applies EF migrations, starts the ASP.NET Core image that
# serves the built Angular app, then executes Playwright against that real host.
# Invoke with an explicit project name, for example:
# docker compose -p coglatas-real-backend-smoke -f docker-compose.real-backend-smoke.yml config

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coglatas_smoke
      POSTGRES_USER: coglatas_smoke
      POSTGRES_PASSWORD: coglatas_smoke_password
    volumes:
      - real_backend_smoke_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coglatas_smoke -d coglatas_smoke"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    restart: "no"
    volumes:
      - ./:/src
      - real_backend_smoke_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=coglatas_smoke;Username=coglatas_smoke;Password=coglatas_smoke_password
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/Coglatas.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - syncfusion_license
    networks:
      default:
        aliases:
          # Chromium treats the single-label hostname "app" as the HSTS
          # preloaded .app TLD and upgrades HTTP navigation to HTTPS.
          - coglatas-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=coglatas_smoke;Username=coglatas_smoke;Password=coglatas_smoke_password
      DataProtection__KeysPath: /app/data/protection-keys
      Tenancy__AppMode: OnPremSingleTenant
      Tenancy__DefaultTenantSlug: default
      Tenancy__TenantResolutionStrategy: ConfigDefault
      Tenancy__AllowTenantSwitching: "false"
      Tenancy__SeedOnStartup: "true"
      UiShell__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      Security__CookieSecurePolicy: SameAsRequest
      Security__RequireHttps: "false"
      Security__EnableHsts: "false"
      Security__EnableCsrfProtection: "true"
      Security__EnableRateLimiting: "false"
      # Test-only cadence: the production worker remains durably coordinated
      # through PostgreSQL, while this browser proof observes a due transition
      # and a publish-time authorization revocation without minute-scale waits.
      AnnouncementPublisher__PollSeconds: "1"
      # Test-only deterministic synthetic seed:
      # e2e-user@example.test, Browser Smoke Workspace, Browser smoke announcement,
      # Browser Smoke Project, and Browser smoke task.
      COGLATAS_BROWSER_SMOKE_SEED_ENABLED: "true"
      COGLATAS_BROWSER_SMOKE_RESPONSE_GATE_ENABLED: "true"
      COGLATAS_BROWSER_SMOKE_EMAIL: ${COGLATAS_BROWSER_SMOKE_EMAIL:-e2e-user@example.test}
      COGLATAS_BROWSER_SMOKE_PASSWORD: ${COGLATAS_BROWSER_SMOKE_PASSWORD:-E2eSmoke!23456}
    volumes:
      - real_backend_smoke_uploads:/app/storage/uploads
      - real_backend_smoke_data_protection:/app/data/protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  real-backend-playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /work
    environment:
      CI: "true"
      COGLATAS_REAL_BACKEND_SMOKE: "1"
      COGLATAS_REAL_BACKEND_SMOKE_GREP: ${COGLATAS_REAL_BACKEND_SMOKE_GREP:-}
      COGLATAS_ISSUE_683_EVIDENCE: ${COGLATAS_ISSUE_683_EVIDENCE:-}
      COGLATAS_ISSUE_683_EVIDENCE_FILE: ${COGLATAS_ISSUE_683_EVIDENCE_FILE:-}
      PLAYWRIGHT_BASE_URL: http://coglatas-backend:8080
      COGLATAS_BROWSER_SMOKE_EMAIL: ${COGLATAS_BROWSER_SMOKE_EMAIL:-e2e-user@example.test}
      COGLATAS_BROWSER_SMOKE_PASSWORD: ${COGLATAS_BROWSER_SMOKE_PASSWORD:-E2eSmoke!23456}
    volumes:
      - .:/work
      - real_backend_smoke_node_modules:/work/node_modules
    depends_on:
      app:
        condition: service_healthy
    command: >
      bash -lc "npm ci &&
      node tests/ui/run-real-backend-playwright.mjs"

volumes:
  real_backend_smoke_pgdata:
  real_backend_smoke_nuget:
  real_backend_smoke_uploads:
  real_backend_smoke_data_protection:
  real_backend_smoke_node_modules:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
