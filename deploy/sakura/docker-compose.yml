services:
  web:
    build:
      context: ${COGLATAS_SOURCE_DIR:-../..}
      dockerfile: Dockerfile
      secrets:
        - source: syncfusion_license
          target: syncfusion_license
    image: deploy-web
    container_name: coglatas-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-coglatas};Username=${DB_USER:-coglatas_user};Password=${DB_PASSWORD:?set DB_PASSWORD}
      DataProtection__KeysPath: /app/data/protection-keys
      Tenancy__AppMode: ${TENANCY_APP_MODE:-OnPremSingleTenant}
      Tenancy__DefaultTenantSlug: ${TENANCY_DEFAULT_TENANT_SLUG:-default}
      Tenancy__TenantResolutionStrategy: ${TENANCY_RESOLUTION_STRATEGY:-ConfigDefault}
      Tenancy__AllowTenantSwitching: ${TENANCY_ALLOW_SWITCHING:-false}
      Tenancy__SeedOnStartup: "true"
      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      FileStorage__MaxFileSizeBytes: ${FILE_STORAGE_MAX_FILE_SIZE_BYTES:-26214400}
      Security__CookieSecurePolicy: ${SECURITY_COOKIE_SECURE_POLICY:-Always}
      Security__RequireHttps: ${SECURITY_REQUIRE_HTTPS:-true}
      Security__EnableHsts: ${SECURITY_ENABLE_HSTS:-true}
      ReverseProxy__TrustForwardedHeaders: "true"
      # Keep strict header-count symmetry by default. Tunnel overlays that are
      # known to append X-Forwarded-For independently may disable only this
      # check while retaining the trusted peer boundary and ForwardLimit=1.
      ReverseProxy__RequireHeaderSymmetry: ${REVERSE_PROXY_REQUIRE_HEADER_SYMMETRY:-true}
      # Caddy is the only HTTP peer on the private Compose network. Operators
      # may narrow this further by assigning a fixed internal subnet. Set
      # ALLOWED_HOSTS to "localhost;portal.example" (or equivalent) so the
      # forwarded public host is accepted while the container healthcheck stays valid.
      ReverseProxy__TrustedNetworks__0: ${REVERSE_PROXY_TRUSTED_NETWORKS:-172.16.0.0/12}
      Platform__PlatformAdminSetupMode: ${PLATFORM_ADMIN_SETUP_MODE:-false}
      LocalAdmin__SeedOnStartup: ${LOCAL_ADMIN_SEED_ON_STARTUP:-true}
      LocalAdmin__Email: ${LOCAL_ADMIN_EMAIL:-admin@example.com}
      LocalAdmin__Password: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD}
      LocalAdmin__DisplayName: ${LOCAL_ADMIN_DISPLAY_NAME:-Local Admin}
      COGLATAS_SEED_ADMIN_ENABLED: ${COGLATAS_SEED_ADMIN_ENABLED:-false}
      COGLATAS_SEED_ADMIN_EMAIL: ${COGLATAS_SEED_ADMIN_EMAIL:-}
      COGLATAS_SEED_ADMIN_USERNAME: ${COGLATAS_SEED_ADMIN_USERNAME:-}
      COGLATAS_SEED_ADMIN_PASSWORD: ${COGLATAS_SEED_ADMIN_PASSWORD:-}
    expose:
      - "8080"
    volumes:
      - coglatas_uploads:/app/storage/uploads
      - coglatas_data_protection:/app/data/protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: localhost' http://localhost:8080/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      coglatas_internal:
        aliases:
          - web
          - coglatas-web

  caddy:
    image: caddy:2-alpine
    container_name: coglatas-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "127.0.0.1:5000:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${COGLATAS_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      coglatas_internal:
        aliases:
          - caddy
          - coglatas-caddy

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    restart: "no"
    volumes:
      - ${COGLATAS_SOURCE_DIR:-../..}:/src
      - coglatas_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-db};Port=5432;Database=${DB_NAME:-coglatas};Username=${DB_USER:-coglatas_user};Password=${DB_PASSWORD:?set DB_PASSWORD}
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      coglatas_internal:
        aliases:
          - migrate
    command: >
      bash -lc "mkdir -p /src/src/Coglatas.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web"

  postgres:
    image: postgres:18-alpine
    container_name: coglatas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-coglatas}
      POSTGRES_USER: ${DB_USER:-coglatas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      coglatas_internal:
        aliases:
          - db
          - postgres
          - coglatas-db
    volumes:
      - coglatas_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coglatas_user} -d ${DB_NAME:-coglatas}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  coglatas_internal:
    driver: bridge

volumes:
  coglatas_pgdata:
  coglatas_uploads:
  coglatas_data_protection:
  coglatas_nuget:
  caddy_data:
  caddy_config:

secrets:
  syncfusion_license:
    file: ${SYNCFUSION_LICENSE_FILE:-/srv/coglatas/app/secrets/syncfusion-license.txt}
