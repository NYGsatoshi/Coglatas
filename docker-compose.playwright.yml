# Optional CI-parity runner for local Angular screenshot verification.
# Do not approve Windows/macOS host-native screenshot baselines; use this Linux runner or GitHub Actions.
services:
  angular-playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /work
    # This runner is a single container: Playwright and its static Angular server
    # share the same network namespace and do not need a Compose project network.
    # Reusing Docker's built-in bridge avoids consuming a fresh subnet on every
    # self-hosted CI run, which otherwise leaks pool entries when a run is cancelled.
    network_mode: bridge
    environment:
      CI: "true"
      PLAYWRIGHT_SKIP_BUILD: "1"
      NPM_CI_ATTEMPTS: "2"
      COGLATAS_PLAYWRIGHT_REUSE_HOST_BUILD: "${COGLATAS_PLAYWRIGHT_REUSE_HOST_BUILD:-false}"
    volumes:
      - .:/work
      - playwright-root-node-modules:/work/node_modules
      - playwright-frontend-node-modules:/work/frontend/node_modules
      - playwright-npm-cache:/root/.npm
      - playwright-angular-cache:/work/frontend/.angular/cache
    command: >
      bash -lc "bash scripts/ci/npm-ci-retry.sh . &&
      if [ \"$${COGLATAS_PLAYWRIGHT_REUSE_HOST_BUILD}\" != \"true\" ]; then
        bash scripts/ci/npm-ci-retry.sh frontend &&
        npm --prefix frontend run build;
      fi &&
      test -f frontend/dist/coglatas-web/index.html &&
      npm run test:ui:angular"

volumes:
  playwright-root-node-modules:
  playwright-frontend-node-modules:
  playwright-npm-cache:
    external: true
    name: ${PLAYWRIGHT_NPM_CACHE_VOLUME:-coglatas-playwright-npm-cache-node24-v1}
  playwright-angular-cache:
    external: true
    name: ${PLAYWRIGHT_ANGULAR_CACHE_VOLUME:-coglatas-playwright-angular-cache-node24-v1}
