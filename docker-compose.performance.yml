# PERF-02 isolated performance stack.
# Never deploy this Compose file as a production/school environment.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coglatas_performance
      POSTGRES_USER: coglatas_performance
      POSTGRES_PASSWORD: coglatas_performance_password
    volumes:
      - performance_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coglatas_performance -d coglatas_performance"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0.400
    working_dir: /src
    restart: "no"
    volumes:
      - ./:/src
      - performance_nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=coglatas_performance;Username=coglatas_performance;Password=coglatas_performance_password
      NUGET_PACKAGES: /root/.nuget/packages
      Tenancy__SeedOnStartup: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -lc "mkdir -p /src/src/Coglatas.Web/wwwroot &&
      dotnet tool restore &&
      dotnet restore src/Coglatas.Web/Coglatas.Web.csproj /p:RestoreFallbackFolders= &&
      dotnet ef database update --project src/Coglatas.Infrastructure --startup-project src/Coglatas.Web"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - syncfusion_license
    networks:
      default:
        aliases:
          - coglatas-performance
    ports:
      - "127.0.0.1:${COGLATAS_PERFORMANCE_PORT:-18080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=coglatas_performance;Username=coglatas_performance;Password=coglatas_performance_password
      DataProtection__KeysPath: /app/data/protection-keys

      Tenancy__AppMode: SaaS
      Tenancy__DefaultTenantSlug: perf-${COGLATAS_PERFORMANCE_PROFILE:?COGLATAS_PERFORMANCE_PROFILE must be small, medium, or large}
      Tenancy__TenantResolutionStrategy: HeaderForDevelopmentOnly
      Tenancy__AllowTenantSwitching: "true"
      Tenancy__AllowDevelopmentHeaderTenantResolution: "true"
      Tenancy__AllowDevelopmentHeaderInProduction: "false"
      Tenancy__DevelopmentTenantHeaderName: X-Tenant-Slug
      Tenancy__SeedOnStartup: "false"
      UiShell__SeedOnStartup: "false"

      COGLATAS_BROWSER_SMOKE_SEED_ENABLED: "false"
      COGLATAS_BROWSER_SMOKE_RESPONSE_GATE_ENABLED: "false"
      COGLATAS_DEMO_DATASET_ENABLED: "false"
      COGLATAS_SECURITY_CI_FIXTURE_ENABLED: "false"

      COGLATAS_PERFORMANCE_CI_FIXTURE_ENABLED: "true"
      COGLATAS_PERFORMANCE_PROFILE: ${COGLATAS_PERFORMANCE_PROFILE:?COGLATAS_PERFORMANCE_PROFILE must be small, medium, or large}
      COGLATAS_PERFORMANCE_PASSWORD: ${COGLATAS_PERFORMANCE_PASSWORD:?COGLATAS_PERFORMANCE_PASSWORD is required}
      COGLATAS_PERFORMANCE_DATASETS_PATH: /app/performance/datasets.json
      COGLATAS_PERFORMANCE_FIXTURE_EVIDENCE_PATH: /app/performance-evidence/fixture.json

      FileStorage__Provider: LocalFileSystem
      FileStorage__RootPath: /app/storage/uploads
      Security__CookieSecurePolicy: SameAsRequest
      Security__RequireHttps: "false"
      Security__EnableHsts: "false"
      Security__EnableCsrfProtection: "true"
      Security__EnableRateLimiting: "false"
    volumes:
      - ./performance/datasets.json:/app/performance/datasets.json:ro
      - ${COGLATAS_PERFORMANCE_EVIDENCE_DIR:?COGLATAS_PERFORMANCE_EVIDENCE_DIR is required}:/app/performance-evidence
      - performance_uploads:/app/storage/uploads
      - performance_data_protection:/app/data/protection-keys
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health/ready >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s

  performance-browser:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    profiles: ["tooling"]
    working_dir: /work
    volumes:
      - ./:/work
    command: ["bash"]

volumes:
  performance_pgdata:
  performance_nuget:
  performance_uploads:
  performance_data_protection:

secrets:
  syncfusion_license:
    environment: SYNCFUSION_LICENSE
