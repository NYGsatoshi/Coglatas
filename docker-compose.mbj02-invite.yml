# MBJ-02 administrator invite onboarding overlay.
#
# This overlay disables the broad browser-smoke fixture, provisions only the
# synthetic SystemAdmin required to create invites, and passes synthetic
# acceptance credentials to the isolated Playwright runtime. Secrets are
# generated by scripts/ci/run-mbj02-invite-acceptance.sh and are never stored
# in source or evidence artifacts.

services:
  app:
    environment:
      COGLATAS_BROWSER_SMOKE_SEED_ENABLED: "false"
      COGLATAS_BROWSER_SMOKE_RESPONSE_GATE_ENABLED: "false"
      COGLATAS_SEED_ADMIN_ENABLED: "true"
      COGLATAS_SEED_ADMIN_EMAIL: ${COGLATAS_MBJ02_ADMIN_EMAIL:?set COGLATAS_MBJ02_ADMIN_EMAIL}
      COGLATAS_SEED_ADMIN_USERNAME: ${COGLATAS_MBJ02_ADMIN_DISPLAY_NAME:-MBJ02 System Admin}
      COGLATAS_SEED_ADMIN_PASSWORD: ${COGLATAS_MBJ02_ADMIN_PASSWORD:?set COGLATAS_MBJ02_ADMIN_PASSWORD}

  real-backend-playwright:
    environment:
      COGLATAS_MBJ02_ADMIN_EMAIL: ${COGLATAS_MBJ02_ADMIN_EMAIL:?set COGLATAS_MBJ02_ADMIN_EMAIL}
      COGLATAS_MBJ02_ADMIN_DISPLAY_NAME: ${COGLATAS_MBJ02_ADMIN_DISPLAY_NAME:-MBJ02 System Admin}
      COGLATAS_MBJ02_ADMIN_PASSWORD: ${COGLATAS_MBJ02_ADMIN_PASSWORD:?set COGLATAS_MBJ02_ADMIN_PASSWORD}
      COGLATAS_MBJ02_INVITEE_EMAIL: ${COGLATAS_MBJ02_INVITEE_EMAIL:?set COGLATAS_MBJ02_INVITEE_EMAIL}
      COGLATAS_MBJ02_INVITEE_DISPLAY_NAME: ${COGLATAS_MBJ02_INVITEE_DISPLAY_NAME:-MBJ02 Invited User}
      COGLATAS_MBJ02_INVITEE_PASSWORD: ${COGLATAS_MBJ02_INVITEE_PASSWORD:?set COGLATAS_MBJ02_INVITEE_PASSWORD}
      COGLATAS_MBJ02_REVOKED_EMAIL: ${COGLATAS_MBJ02_REVOKED_EMAIL:?set COGLATAS_MBJ02_REVOKED_EMAIL}
      COGLATAS_MBJ02_EXPIRED_EMAIL: ${COGLATAS_MBJ02_EXPIRED_EMAIL:?set COGLATAS_MBJ02_EXPIRED_EMAIL}
      COGLATAS_MBJ02_MISMATCH_TARGET_EMAIL: ${COGLATAS_MBJ02_MISMATCH_TARGET_EMAIL:?set COGLATAS_MBJ02_MISMATCH_TARGET_EMAIL}
      COGLATAS_MBJ02_MISMATCH_OTHER_EMAIL: ${COGLATAS_MBJ02_MISMATCH_OTHER_EMAIL:?set COGLATAS_MBJ02_MISMATCH_OTHER_EMAIL}
      COGLATAS_MBJ02_CROSS_TENANT_EMAIL: ${COGLATAS_MBJ02_CROSS_TENANT_EMAIL:?set COGLATAS_MBJ02_CROSS_TENANT_EMAIL}
      COGLATAS_MBJ02_CROSS_TENANT_TOKEN: ${COGLATAS_MBJ02_CROSS_TENANT_TOKEN:?set COGLATAS_MBJ02_CROSS_TENANT_TOKEN}
      COGLATAS_MBJ02_CROSS_TENANT_WORKSPACE_ID: ${COGLATAS_MBJ02_CROSS_TENANT_WORKSPACE_ID:?set COGLATAS_MBJ02_CROSS_TENANT_WORKSPACE_ID}
