# FCI-07 Functional authorization-negative overlay.
# Layer after docker-compose.real-backend-smoke.yml and docker-compose.security.yml.
# The application stays on the existing SEC-02/SEC-05 multi-tenant fixture while
# the inherited Playwright image executes both canonical Functional negative owners.

services:
  real-backend-playwright:
    environment:
      COGLATAS_SECURITY_CI_FIXTURE_ENABLED: "true"
      COGLATAS_SECURITY_CI_PASSWORD: ${COGLATAS_SECURITY_CI_PASSWORD:?COGLATAS_SECURITY_CI_PASSWORD is required for FCI-07}
      COGLATAS_FUNCTIONAL_FCI07: "1"
    command: >
      bash -lc "npm ci &&
      bash scripts/ci/run-fci07-playwright-owners.sh
      ${COGLATAS_FCI07_GATE:-functional-fast}"
